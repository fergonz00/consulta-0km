}

// ============ DETALLE / MODAL ============
// Historial de consultas de disponibilidad YA respondidas para el mismo modelo.
// Pedido de Fer: "si le respondo que no hay en VW y otro me pregunta de ese modelo,
// que me aparezca lo contestado, para recordar que tal día ya pregunté y me dijeron
// que no hay". Evita volver a molestar al zonal por lo mismo.
//
// Cruza por MODELO (canónico) sobre todas las consultas sin_disponibilidad, en
// cualquier estado — una que quedó "en gestión" o sin responder también importa: es
// una pregunta ya hecha. Las del MISMO COLOR van primero y resaltadas, porque son la
// respuesta literal a lo que están preguntando de nuevo.
function historialDisponibilidad(c, it) {
  if (!c || c.origen !== 'sin_disponibilidad') return '';
  const canonCur = resolveModeloCanonico(it.modelo) || it.modelo;
  const colorCur = _normColor(it.color_pedido || '');
  const previas = [];
  (adminConsultas || []).forEach(oc => {
    if (oc.id === c.id) return;
    if (oc.origen !== 'sin_disponibilidad') return;
    (oc.items || []).forEach(oit => {
      if ((resolveModeloCanonico(oit.modelo) || oit.modelo) !== canonCur) return;
      previas.push({
        id: oc.id,
        color: oit.color_pedido || '',
        mismoColor: !!colorCur && _normColor(oit.color_pedido || '') === colorCur,
        estado: oc.estado,
        disponibilidad: oc.disponibilidad,
        precio: oc.precio_max_admin,
        obs: (oc.observaciones_admin || '').trim(),
        vendedor: oc.vendedor_nombre || oc.vendedor_usuario || '',
        fecha: oc.admin_respuesta_at || oc.created_at,
        respondida: !!oc.admin_respuesta_at
      });
    });
  });
  if (previas.length === 0) return '';
  // Mismo color primero; dentro de cada grupo, lo más reciente arriba.
  previas.sort((a, b) => (b.mismoColor ? 1 : 0) - (a.mismoColor ? 1 : 0) || new Date(b.fecha) - new Date(a.fecha));
  const nMismo = previas.filter(p => p.mismoColor).length;

  const veredicto = (p) => {
    if (p.disponibilidad === 'se_consigue') return { txt: 'SE CONSIGUE', bg: '#dcfce7', fg: '#166534' };
    if (p.disponibilidad === 'no_se_consigue') return { txt: 'NO SE CONSIGUE', bg: '#fee2e2', fg: '#991b1b' };
    if (p.estado === 'en_gestion') return { txt: 'EN GESTIÓN', bg: '#ede9fe', fg: '#5b21b6' };
    if (p.estado === 'pendiente') return { txt: 'SIN RESPONDER', bg: '#fed7aa', fg: '#9a3412' };
    // Respondida antes de que existiera la columna `disponibilidad`.
    if (p.estado === 'aceptada') return { txt: 'SE CONSIGUE', bg: '#dcfce7', fg: '#166534' };
    if (p.estado === 'rechazada') return { txt: 'NO SE CONSIGUE', bg: '#fee2e2', fg: '#991b1b' };
    return { txt: (p.estado || '—').toUpperCase(), bg: '#e5e7eb', fg: '#374151' };
  };

  const MAX = 6;
  const filas = previas.slice(0, MAX).map(p => {
    const v = veredicto(p);
    const marco = p.mismoColor ? 'background:#fffbeb; border-left:3px solid var(--orange); padding-left:7px' : '';
    return `
      <div style="padding:7px 6px; border-bottom:1px dashed var(--vw-grey-2); font-size:12px; ${marco}">
        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap">
          <span class="muted" style="font-size:11px; white-space:nowrap">${p.respondida ? fmtDate(p.fecha) : 'pedida ' + fmtDate(p.fecha)}</span>
          <strong>${escapeHtml(p.color || 'sin color')}</strong>
          ${p.mismoColor ? '<span style="color:var(--orange); font-weight:700; font-size:10px">MISMO COLOR</span>' : ''}
          <span style="background:${v.bg}; color:${v.fg}; padding:1px 7px; border-radius:6px; font-size:10px; font-weight:700">${v.txt}</span>
          ${p.precio ? `<span class="muted">${fmtMoney(p.precio)}</span>` : ''}
          <span class="muted" style="font-size:11px; margin-left:auto">#${p.id} · ${escapeHtml(p.vendedor)}</span>
        </div>
        ${p.obs ? `<div class="muted" style="margin-top:3px; font-style:italic">"${escapeHtml(p.obs)}"</div>` : ''}
      </div>`;
  }).join('');

  const resumenMismo = nMismo
    ? `<span style="color:var(--orange); font-weight:600">${nMismo} ${nMismo === 1 ? 'fue' : 'fueron'} por este mismo color</span>`
    : '<span class="muted">ninguna por este color exacto</span>';

  return `
    <div style="margin-top:12px; padding-top:10px; border-top:1px solid var(--vw-grey-2)">
      <div style="font-size:13px; margin-bottom:6px">
        <strong>📋 Ya consultamos este modelo:</strong> ${previas.length} ${previas.length === 1 ? 'vez' : 'veces'} — ${resumenMismo}
      </div>
      ${filas}
      ${previas.length > MAX ? `<div class="muted" style="font-size:11px; padding-top:6px">y ${previas.length - MAX} más, más viejas.</div>` : ''}
    </div>`;
}

// Bloque "¿Qué hay de lo que piden?" — la respuesta a la pregunta de Fer: me piden un
// auto o un color que no está, ¿qué tengo de eso? Se muestra en las consultas SIN
// DISPONIBILIDAD (y en cualquier item que traiga un color pedido a mano). Cruza el
// modelo+color pedido contra stock, reparto e histórico, y arranca por el veredicto
// para no tener que leer nada más en el 90% de los casos.
function bloqueQueHay(c, it) {
  if (!c || c.origen !== 'sin_disponibilidad') return '';
  const modelo = it.modelo;
  const color = it.color_pedido || '';
  const q = queHayDe(modelo, color);
  const nExacto = q.colorExacto.stock.length;
  const nExactoRep = q.colorExacto.reparto.length;

  // Veredicto de arriba: verde si el auto exacto está, ámbar si está en reparto,
  // violeta si no hay nada de ese color, rojo si no hay nada del modelo entero.
  let veredicto;
  if (nExacto > 0) {
    veredicto = { bg: '#dcfce7', bd: '#86efac', fg: '#166534',
      txt: `✓ Ese auto SÍ está: ${nExacto} ${nExacto === 1 ? 'unidad' : 'unidades'} en stock`,
      sub: 'El vendedor lo cargó como "sin disponibilidad" pero la unidad existe — se puede vender ya.' };
  } else if (nExactoRep > 0) {
    veredicto = { bg: '#fef3c7', bd: '#fcd34d', fg: '#78350f',
      txt: `🚚 Ese auto está EN EL REPARTO: ${nExactoRep} ${nExactoRep === 1 ? 'unidad' : 'unidades'}`,
      sub: 'No hay que pedirle nada al zonal: VW ya nos lo asignó, solo hay que comprarlo.' };
  } else if (q.totalStock === 0 && q.totalReparto === 0) {
    veredicto = { bg: '#fee2e2', bd: '#fca5a5', fg: '#991b1b',
      txt: '✗ De este modelo no tenemos NADA',
      sub: 'Ni una unidad en stock ni en el reparto, en ningún color.' };
  } else {
    veredicto = { bg: '#e0e7ff', bd: '#a5b4fc', fg: '#3730a3',
      txt: `✗ Ese color no está — pero del modelo hay ${q.totalStock} en stock y ${q.totalReparto} en reparto`,
      sub: 'Mirá abajo los colores que sí tenemos, por si le sirve al cliente.' };
  }

  const chips = (arr, vacio) => arr.length
    ? arr.map(x => `<span style="display:inline-block; background:#fff; border:1px solid var(--vw-grey-2); border-radius:12px; padding:3px 10px; margin:3px 5px 3px 0; font-size:12px">${escapeHtml(x.color)}: <strong>${x.n}</strong></span>`).join('')
    : `<span class="muted" style="font-size:12px">${vacio}</span>`;

  // Histórico: ¿VW nos manda este modelo en este color alguna vez? Es lo que decide si
  // vale la pena pedírselo al zonal o si directamente no lo producen para nosotros.
  const h = q.historico;
  const histTxt = !color
    ? ''
    : (h
      ? `Tuvimos <strong>${h.n}</strong> ${h.n === 1 ? 'unidad' : 'unidades'} de <strong>${escapeHtml(modelo)}</strong> en <strong>${escapeHtml(color)}</strong>${h.ultima ? `, la última en <strong>${escapeHtml(new Date(h.ultima + 'T00:00:00').toLocaleDateString('es-AR', { month: 'long', year: 'numeric' }))}</strong>` : ''}. VW nos lo manda.`
      : `<strong>Nunca</strong> tuvimos este modelo en ${escapeHtml(color)} (últimos 18 meses de Oversoft + todo el reparto). Puede que VW no lo produzca en ese color.`);

  return `
    <div style="margin-top:12px; padding-top:10px; border-top:1px solid var(--vw-grey-2)">
      <div style="font-size:13px; margin-bottom:8px"><strong>🔎 Piden:</strong> ${escapeHtml(modelo)}${color ? ` · <strong>${escapeHtml(color)}</strong>` : ''}</div>
      <div style="background:${veredicto.bg}; border:1px solid ${veredicto.bd}; color:${veredicto.fg}; border-radius:8px; padding:10px 12px; margin-bottom:10px">
        <div style="font-weight:700; font-size:13px">${veredicto.txt}</div>
        <div style="font-size:12px; margin-top:3px; opacity:.85">${veredicto.sub}</div>
      </div>
      <div style="font-size:12px; margin-bottom:4px"><strong>📦 De este modelo hay en stock (${q.totalStock}):</strong></div>
      <div style="margin-bottom:8px">${chips(q.otrosColoresStock.concat(q.colorExacto.stock.length ? [{ color: color, n: nExacto }] : []), 'ninguna unidad en stock.')}</div>
      <div style="font-size:12px; margin-bottom:4px"><strong>🚚 En reparto (${q.totalReparto}):</strong></div>
      <div style="margin-bottom:8px">${chips(q.otrosColoresReparto.concat(nExactoRep ? [{ color: color, n: nExactoRep }] : []), 'ninguna unidad en reparto.')}</div>
      ${histTxt ? `<div style="font-size:12px; background:var(--vw-grey-1); border-radius:6px; padding:8px 10px">📅 ${histTxt}</div>` : ''}
    </div>`;
}

/**
 * Bloque "pago por transferencia" del detalle de una consulta.
 *
 * Lo ven los dos: el vendedor, el monto y cuanto cuesta en pesos (para que entienda por
 * que el precio no puede ser el mismo y empuje el pago por SICE); el admin, ademas, a
 * cuanto descuento extra equivale y con que precio efectivo se queda.
 *
 * El costo se recalcula SIEMPRE con la alicuota de hoy. Si la consulta se cargo con otra
 * (cambio el SIRCREB en el medio), se avisa: el numero que decide es el de hoy.
 */
/**
 * Referencia de lo que ya se habia respondido, cuando la consulta se reabrio porque el
 * cliente pidio pagar una parte por transferencia.
 *
 * Pedido de Fer: al reanalizar de cero quiere ver contra que esta comparando — que precio
 * le habia pasado antes y que ganancia le quedaba con ESE precio, antes del pedido nuevo.
 *
 * La ganancia NO se guarda en la base: se recalcula en vivo con la ganancia de hoy, igual
 * que el bloque de "ultimos precios autorizados". Guardarla implicaria dejar el margen en
 * una tabla que se lee con la anon key, y eso rompe el blindaje del costo. Como
 * contrapartida, si cambio la lista en el medio el numero se mueve — por eso va rotulado
 * con la fecha de aquella respuesta.
 */
function bloqueReaperturas(c, it, tipo, showGcia) {
  const rs = reaperturasDe(tipo, c.id);
  if (!rs.length) return '';
  const ESTADO_LBL = { aceptada: 'Aceptada', rechazada: 'Mejor precio', contraoferta: 'Contraoferta',
    en_gestion: 'En gestión', pendiente: 'Pendiente' };
  const filas = rs.map(r => {
    const precio = Number(r.precio_previo) || 0;
    let gciaHtml = '';
    if (showGcia && precio > 0) {
      let gcia = null;
      if (tipo === '0km') {
        const a = analisisAdminVivo({ modelo: it ? it.modelo : null, precio_pedido: precio, chasis: [],
          transferencia_monto: Number(r.transferencia_monto_previo) || 0 });
        gcia = a ? a.gcia_resultante : null;
      } else {
        gcia = margenUsadoReapertura(c, precio, Number(r.transferencia_monto_previo) || 0);
      }
      if (gcia != null) {
        gciaHtml = ` · te quedaba <strong style="color:${gcia >= 0 ? 'var(--green)' : 'var(--red)'}">${fmtPct(gcia)}</strong>`;
      }
    }
    const previa = Number(r.transferencia_monto_previo) || 0;
    return `<div style="padding:6px 0; border-bottom:1px dashed #fed7aa; font-size:12px">
      <div>${fmtDate(r.respuesta_previa_at || r.created_at)} · <strong>${ESTADO_LBL[r.estado_previo] || r.estado_previo || '—'}</strong>${precio > 0 ? ` a <strong>${fmtMoney(precio)}</strong>` : ''}${gciaHtml}</div>
      ${previa > 0 ? `<div class="muted">Esa respuesta ya contemplaba ${fmtMoney(previa)} por transferencia.</div>` : ''}
      ${(r.observaciones_previas || '').trim() ? `<div class="muted" style="white-space:pre-wrap">"${escapeHtml(r.observaciones_previas)}"</div>` : ''}
      <div class="muted">Reabierta ${fmtDate(r.created_at)} por ${escapeHtml(r.solicitada_por_nombre || '—')}: pide ${fmtMoney(r.transferencia_monto)} por transferencia.</div>
    </div>`;
  }).join('');
  return `
    <div class="detalle-section">
      <h4>🔁 Reabierta — lo que le habías pasado antes</h4>
      <div style="background:#fff7ed; border:1px solid #fed7aa; border-radius:8px; padding:8px 12px">
        ${filas}
        <div class="muted" style="font-size:11px; padding-top:6px">${showGcia ? 'La ganancia está recalculada con la de hoy, al precio de aquella respuesta. ' : ''}El análisis de abajo está rehecho de cero con la transferencia adentro.</div>
      </div>
    </div>`;
}

/** Ganancia sobre costo de un usado a un precio dado, neta del costo de la transferencia. */
function margenUsadoReapertura(c, precio, transferencia) {
  const u = getUsadoStock(c.usadoid);
  if (!usadosCostoOk || !u) return null;
  const costo = Number(u.costo_toma) || 0;
  if (!costo) return null;
  const neto = precio - (transferencia > 0 ? costoTransferencia(transferencia) : 0);
  const m = margenUsado(neto, costo);
  return m ? m.sobreCosto : null;
}

/**
 * Formulario del vendedor para reabrir una consulta ya respondida porque el cliente
 * ahora pide pagar una parte por transferencia. Es lo unico que se puede cambiar al
 * reabrir: para pedir otro precio se carga una consulta nueva.
 */
function renderPedirTransferencia(c, tipo) {
  const esVendedor = currentMode === 'vendedor' || currentMode === 'gerente';
  if (!esVendedor) return '';
  if (!['aceptada', 'rechazada', 'contraoferta'].includes(c.estado)) return '';
  const it = tipo === '0km' ? (c.items || [])[0] : c;
  const yaTiene = Number(it && it.transferencia_monto) || 0;
  return `
    <div class="detalle-section">
      <h4>💸 El cliente ahora quiere pagar una parte por transferencia</h4>
      <p class="muted" style="font-size:12px; margin-bottom:8px">
        ${yaTiene > 0
          ? `Esta consulta ya se respondió contemplando ${fmtMoney(yaTiene)} por transferencia. Si el monto cambió, cargá el nuevo.`
          : 'Se respondió dando por hecho que paga todo por SICE o con cheque a la orden.'}
        Cargá el monto exacto y la consulta vuelve a la gerencia para que la analice de nuevo.
      </p>
      <div class="field">
        <input id="reabrirMonto" type="text" inputmode="numeric" placeholder="$0"
          oninput="onReabrirMontoInput(this)"
          style="font-size:18px; font-weight:600; padding:12px">
      </div>
      <div id="reabrirHint" class="field-hint" style="font-size:12px; margin-top:6px"></div>
      <button class="btn-next" style="margin-top:10px" onclick="solicitarTransferencia(${c.id}, '${tipo}')">
        Pedir de nuevo con transferencia
      </button>
    </div>`;
}

function onReabrirMontoInput(el) {
  const raw = el.value.replace(/[^\d]/g, '');
  el.value = raw ? '$' + parseInt(raw, 10).toLocaleString('es-AR') : '';
  const hint = document.getElementById('reabrirHint');
  if (!hint) return;
  const monto = raw ? parseInt(raw, 10) : 0;
  hint.innerHTML = monto > 0
    ? `Costo de cobrarlo así: <strong style="color:var(--red)">${fmtMoney(costoTransferencia(monto))}</strong> <span class="muted">(${fmtPct(alicuotaTransferencia())} de alícuota)</span>`
    : '';
}

/**
 * Reabre la consulta: congela la respuesta que habia, guarda el monto nuevo y la manda
 * de vuelta a pendiente. Los contadores de recordatorio se ponen en cero y `reabierta_at`
 * hace que el "sin responder" cuente desde ahora y no desde que se cargo originalmente.
 */
async function solicitarTransferencia(consultaId, tipo) {
  const el = document.getElementById('reabrirMonto');
  const monto = el ? parseInt((el.value || '').replace(/[^\d]/g, ''), 10) : NaN;
  if (!monto || monto <= 0) { alert('Cargá el monto que va por transferencia.'); return; }

  const lista = tipo === '0km' ? myConsultas : misConsultasUsados;
  const c = (lista || []).find(x => x.id === consultaId);
  if (!c) { alert('No se encontró la consulta. Recargá la pantalla.'); return; }
  const it = tipo === '0km' ? (c.items || [])[0] : c;

  // Precio que se le habia pasado al cliente: si la aceptaron, el que pidio; si no, el
  // que autorizo la gerencia.
  const precioPrevio = c.estado === 'aceptada'
    ? (Number(it && it.precio_pedido) || null)
    : (Number(c.precio_max_admin) || null);
  const tope = Number(it && it.precio_pedido) || precioPrevio || 0;
  if (tope > 0 && monto > tope) {
    if (!confirm(`El monto por transferencia (${fmtMoney(monto)}) es mayor que el precio del auto (${fmtMoney(tope)}). ¿Seguir igual?`)) return;
  }
  if (!confirm(`¿Volver a pedir la consulta contemplando ${fmtMoney(monto)} por transferencia?\n\nVuelve a la gerencia y se analiza de nuevo. La respuesta anterior queda como referencia.`)) return;

  showLoading('Enviando...');
  try {
    const tablaCab = tipo === '0km' ? 'consultas_0km' : 'consultas_usados';
    await sbFetch('consultas_reaperturas', {
      method: 'POST',
      body: JSON.stringify({
        tipo,
        consulta_id: consultaId,
        motivo: 'transferencia',
        solicitada_por_id: currentUser.id,
        solicitada_por_nombre: currentUser.nombre || currentUser.usuario,
        estado_previo: c.estado,
        disponibilidad_previa: c.disponibilidad || null,
        precio_previo: precioPrevio,
        observaciones_previas: c.observaciones_admin || null,
        respuesta_previa_at: c.admin_respuesta_at || null,
        resultado_venta_previo: c.resultado_venta || null,
        transferencia_monto_previo: (it && it.transferencia_monto) || null,
        transferencia_monto: monto,
        alicuota: alicuotaTransferencia()
      })
    });

    const datosTransf = {
      transferencia_monto: monto,
      transferencia_alicuota: alicuotaTransferencia(),
      transferencia_costo: Math.round(costoTransferencia(monto))
    };
    if (tipo === '0km' && it && it.id) {
      await sbFetch(`consultas_0km_items?id=eq.${it.id}`, { method: 'PATCH', body: JSON.stringify(datosTransf) });
    }

    await sbFetch(`${tablaCab}?id=eq.${consultaId}`, {
      method: 'PATCH',
      body: JSON.stringify({
        ...(tipo === 'usado' ? datosTransf : {}),
        estado: 'pendiente',
        // La respuesta vieja ya quedo congelada en consultas_reaperturas: se limpia para
        // que la pantalla no muestre una respuesta que ya no aplica.
        precio_max_admin: null,
        observaciones_admin: null,
        admin_respuesta_at: null,
        admin_user_id: null,
        disponibilidad: null,
        resultado_venta: null,
        motivo_no_venta: null,
        resultado_venta_at: null,
        reabierta_at: new Date().toISOString(),
        recordatorios_enviados: 0,
        ultimo_recordatorio_at: null
      })
    });

    notifyEvent(tipo === '0km' ? 'consulta_0km_reabierta' : 'consulta_usado_reabierta', consultaId)
      .catch(e => console.error(e));

    closeModal();
    if (tipo === '0km') await cargarMisConsultas(); else await cargarMisConsultasUsados();
    hideLoading();
    showToast('Consulta reabierta con la transferencia');
  } catch(e) {
    hideLoading();
    console.error(e);
    alert('Error al reabrir: ' + (e.message || e));
  }
}

// ---------- Numero de preventa al marcar la venta ----------
/**
 * La PV es el NEXO entre la consulta y la venta real. Sin ella, el monto que se
 * autorizo por transferencia se queda en la consulta y la solapa Ventas sigue
 * mostrando la ganancia sin descontar el costo de haberlo cobrado asi.
 *
 * Por eso es OBLIGATORIA cuando la consulta lleva transferencia y opcional (pero
 * ofrecida) cuando no: en el segundo caso no hay ningun numero que perder.
 */

// Ademas del vendedor que hizo la consulta, estos tres pueden anotar la PV de
// CUALQUIER consulta: son los que terminan de cerrar las ventas y muchas veces la
// preventa la carga uno de ellos y no el vendedor. Pedido de Fer el 09-09-2026.
// No les habilita marcar "vendida / no vendida" (eso sigue siendo del vendedor):
// anotar la PV ya implica que se vendio, asi que si no estaba marcada, la marca.
const PV_CARGADORES = ['fngonzalez', 'dlopez', 'mlubrano'];
function puedeAnotarPvDeOtros() {
  return !!(currentUser && PV_CARGADORES.includes(String(currentUser.usuario || '').toLowerCase()));
}

/** Busca la consulta en la lista que corresponda al modo activo. */
function consultaPorId(consultaId, tipo) {
  const listas = tipo === '0km'
    ? [myConsultas, adminConsultas]
    : [misConsultasUsados, adminConsultasUsados];
  for (const l of listas) {
    const c = (l || []).find(x => x.id === consultaId);
    if (c) return c;
  }
  return null;
}

/** Monto por transferencia de una consulta: en 0km vive en el item, en usados en la cabecera. */
function transferenciaDe(c, tipo) {
  const it = tipo === '0km' ? ((c && c.items) || [])[0] : c;
  return Number(it && it.transferencia_monto) || 0;
}

function bloquePreventaVenta(c, tipo) {
  const transf = transferenciaDe(c, tipo);
  return `
    <div style="margin-top:12px; padding:10px 12px; background:${transf > 0 ? '#fff7ed' : 'var(--vw-grey-1)'}; border:1px solid ${transf > 0 ? '#fed7aa' : 'var(--vw-grey-2)'}; border-radius:8px">
      <label style="display:block; font-size:12px; color:var(--vw-grey-4); margin-bottom:4px">
        N° de preventa ${transf > 0 ? '<strong style="color:#9a3412">(obligatorio)</strong>' : '<span class="muted">(opcional)</span>'}
      </label>
      <input id="pvVenta" type="text" placeholder="Ej: 8114/1" autocomplete="off"
        oninput="onPreventaInput()"
        style="width:100%; max-width:220px; padding:10px; border:2px solid var(--vw-grey-2); border-radius:8px; font-size:16px; font-weight:600">
      <div id="pvVentaHint" style="font-size:12px; margin-top:6px; min-height:16px"></div>
      <div class="muted" style="font-size:11px; margin-top:2px">
        ${transf > 0
          ? `Esta consulta se autorizó con <strong>${fmtMoney(transf)}</strong> por transferencia. Con la preventa cargada, ese costo se descuenta solo de la ganancia de la venta.`
          : 'Sirve para cruzar la consulta con la venta real. Si no la tenés a mano, podés dejarla vacía.'}
      </div>
    </div>`;
}

function onPreventaInput() {
  const hint = document.getElementById('pvVentaHint');
  if (hint) hint.innerHTML = '';
}

/**
 * Valida la PV contra Oversoft (Edge `validar-preventa`). Devuelve el numero
 * normalizado si esta OK, null si hay que corregirlo, y '' si se dejo vacia
 * estando permitido.
 */
async function resolverPreventa(c, tipo) {
  const el = document.getElementById('pvVenta');
  const hint = document.getElementById('pvVentaHint');
  const txt = el ? (el.value || '').trim() : '';
  const transf = transferenciaDe(c, tipo);

  if (!txt) {
    if (transf > 0) {
      if (hint) hint.innerHTML = '<span style="color:var(--red)">Cargá la preventa: es lo que hace que el costo de la transferencia llegue a la ganancia.</span>';
      if (el) el.focus();
      return null;
    }
    return '';
  }

  if (hint) hint.innerHTML = '<span class="muted">Verificando la preventa…</span>';
  let r;
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/validar-preventa`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json'
      },
      // Se valida contra el vendedor DE LA CONSULTA, no contra quien esta tipeando:
      // cuando la carga Fer, Daniel o Matias, la preventa sigue siendo del vendedor
      // que hizo la consulta.
      body: JSON.stringify({
        preventa: txt,
        usuario: c.vendedor_usuario || currentUser.usuario,
        tipo,
        consulta_id: c.id
      })
    });
    r = await res.json();
  } catch (e) {
    // La validacion no puede ser un muro: si la Edge no responde, se guarda igual
    // el numero tal cual lo tipeo y queda para revisar.
    console.warn('[PV] no se pudo validar:', e);
    return txt.replace(/^PV\s*/i, '').trim();
  }

  if (!r || r.ok !== true) {
    if (hint) hint.innerHTML = `<span style="color:var(--red)">${escapeHtml((r && r.mensaje) || 'No se pudo verificar la preventa.')}</span>`;
    if (el) el.focus();
    return null;
  }
  if (hint) {
    hint.innerHTML = `<span style="color:${r.revisar ? '#92400e' : 'var(--green)'}">${escapeHtml(r.mensaje || '')}</span>`;
  }
  return r.preventa_normalizada || txt;
}

/**
 * Anotar la PV de una consulta que ya se vendio (o que se vendio y todavia nadie
 * marco). Es lo unico que Fer, Daniel y Matias pueden tocar de una consulta ajena.
 *
 * Sin esto la PV solo se podia cargar en el mismo momento en que el vendedor
 * marcaba la venta: si se le pasaba, el monto por transferencia no llegaba nunca a
 * la ganancia de Ventas y no habia forma de arreglarlo desde la pantalla.
 */
function bloqueAnotarPv(c, tipo) {
  const esPropia = !!(currentUser && c.vendedor_id === currentUser.id);
  if (!puedeAnotarPvDeOtros() && !esPropia) return '';
  if (['pendiente', 'en_gestion'].includes(c.estado)) return '';
  if (c.resultado_venta === 'no_vendida') return '';

  const transf = transferenciaDe(c, tipo);
  const yaTiene = !!(c.preventa || '').trim();
  // Con PV cargada solo los tres pueden corregirla: un numero mal tipeado manda el
  // costo de la transferencia a la venta equivocada y no se nota.
  if (yaTiene && !puedeAnotarPvDeOtros()) return '';
  // Si todavia no se marco el resultado y la consulta es propia, el bloque de
  // "Resultado de venta" ya trae el input: no hace falta duplicarlo.
  if (!c.resultado_venta && esPropia) return '';

  return `
    <div class="detalle-section">
      <h4>${yaTiene ? '✏️ Corregir el N° de preventa' : '🧾 Anotar el N° de preventa'}</h4>
      <p class="muted" style="font-size:12px; margin-bottom:8px">
        ${yaTiene
          ? `Está cargada como <strong>${escapeHtml(c.preventa)}</strong>. Si es la equivocada, cargá la correcta.`
          : (transf > 0
            ? `Esta consulta se autorizó con <strong>${fmtMoney(transf)}</strong> por transferencia. Con la preventa cargada, ese costo se descuenta solo de la ganancia de la venta.`
            : 'Sirve para cruzar la consulta con la venta real.')}
        ${c.resultado_venta !== 'vendida' ? ' Al guardarla queda marcada como <strong>vendida</strong>.' : ''}
      </p>
      <div class="field">
        <input id="pvVenta" type="text" placeholder="Ej: 8114/1" autocomplete="off"
          value="${escapeHtml(c.preventa || '')}"
          oninput="onPreventaInput()"
          style="width:100%; max-width:220px; padding:10px; border:2px solid var(--vw-grey-2); border-radius:8px; font-size:16px; font-weight:600">
      </div>
      <div id="pvVentaHint" style="font-size:12px; margin-top:6px; min-height:16px"></div>
      <button class="btn-next" style="margin-top:10px" onclick="guardarPreventaSuelta(${c.id}, '${tipo}')">
        Guardar preventa
      </button>
    </div>`;
}

/** Guarda (o corrige) la PV de una consulta ya respondida. */
async function guardarPreventaSuelta(consultaId, tipo) {
  const c = consultaPorId(consultaId, tipo);
  if (!c) { alert('No se encontró la consulta. Recargá la pantalla.'); return; }
  const pv = await resolverPreventa(c, tipo);
  if (pv === null) return;
  if (!pv) { alert('Cargá el número de preventa.'); return; }
  if (!confirm(`¿Guardar la preventa ${pv} en esta consulta?`)) return;

  showLoading('Guardando...');
  try {
    const tabla = tipo === '0km' ? 'consultas_0km' : 'consultas_usados';
    const cambios = { preventa: pv };
    // Anotar la PV es decir que se vendio: si nadie lo habia marcado, se marca.
    if (c.resultado_venta !== 'vendida') {
      cambios.resultado_venta = 'vendida';
      cambios.motivo_no_venta = null;
      cambios.resultado_venta_at = new Date().toISOString();
    }
    await sbFetch(`${tabla}?id=eq.${consultaId}`, { method: 'PATCH', body: JSON.stringify(cambios) });
    closeModal();
    if (currentMode === 'admin') {
      await (tipo === '0km' ? cargarConsultasAdmin() : cargarConsultasAdminUsados());
    } else {
      await (tipo === '0km' ? cargarMisConsultas() : cargarMisConsultasUsados());
    }
    hideLoading();
    showToast('Preventa guardada');
  } catch (e) {
    hideLoading();
    console.error(e);
    alert('Error al guardar: ' + (e.message || e));
  }
}

/**
 * Aviso que va PEGADO a la contestacion, para el vendedor: si esa parte que iba
 * por transferencia termina entrando por SICE o con e-cheque a la orden, la plata
 * no pasa por nuestro banco y no paga impuestos — asi que ese ahorro se le puede
 * dar al cliente como mejora de precio. Pedido de Fer: que el vendedor lo tenga a
 * mano para negociar la forma de pago, no solo el precio.
 */
function notaVolverASice(c, tipo) {
  const it = tipo === '0km' ? (c.items || [])[0] : c;
  const monto = Number(it && it.transferencia_monto) || 0;
  if (monto <= 0) return '';
  if (['pendiente', 'en_gestion'].includes(c.estado)) return '';
  const ahorro = costoTransferencia(monto);
  return `
    <div style="margin-top:10px; background:#ecfdf5; border:1px solid #a7f3d0; border-radius:8px; padding:10px 12px; font-size:13px; color:#065f46">
      💡 <strong>Si esa parte la termina pagando por SICE o con e-cheque a la orden</strong>, se le pueden sumar
      <strong>${fmtMoney(ahorro)}</strong> más de descuento: es exactamente lo que nos ahorramos de impuestos
      (${fmtPct(alicuotaTransferencia())} sobre los ${fmtMoney(monto)} que iban por transferencia).
      Avisá antes de cerrar si cambia la forma de pago.
    </div>`;
}

function bloqueTransferencia(it, showGcia, precioRef) {
  const monto = Number(it && it.transferencia_monto) || 0;
  if (monto <= 0) return '';
  const costo = costoTransferencia(monto);
  const precio = Number(precioRef != null ? precioRef : it.precio_pedido) || 0;
  const alicHoy = alicuotaTransferencia();
  const alicVieja = Number(it.transferencia_alicuota) || 0;
  const cambio = alicVieja > 0 && Math.abs(alicVieja - alicHoy) > 1e-9;
  const pl = Number(it.precio_lista) || 0;
  const dtoTr = pl > 0 ? costo / pl : null;
  return `
    <div style="background:#fff7ed; border:1px solid #fed7aa; border-radius:8px; padding:10px 12px; margin-top:10px">
      <div style="font-size:12px; font-weight:700; color:#9a3412; margin-bottom:6px">💸 PAGA UNA PARTE POR TRANSFERENCIA</div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; font-size:13px">
        <div><span class="muted">Monto por transferencia:</span> <strong>${fmtMoney(monto)}</strong></div>
        <div><span class="muted">Costo de impuestos:</span> <strong style="color:var(--red)">${fmtMoney(costo)}</strong></div>
        ${precio > 0 ? `<div><span class="muted">Entran de verdad:</span> <strong>${fmtMoney(precio - costo)}</strong></div>` : ''}
        ${showGcia && dtoTr != null ? `<div><span class="muted">Equivale a dto extra:</span> <strong style="color:var(--red)">${fmtPct(dtoTr)}</strong></div>` : ''}
      </div>
      <div class="muted" style="font-size:11px; margin-top:6px">${textoAlicuota()} sobre ${fmtMoney(monto)}${showGcia ? ' · la ganancia de arriba ya lo tiene descontado' : ''}</div>
      ${cambio ? `<div style="font-size:11px; color:#92400e; margin-top:4px">Se cargó con ${fmtPct(alicVieja)}; hoy la alícuota es ${fmtPct(alicHoy)} y es la que se está usando.</div>` : ''}
      ${avisoAlicuota()}
    </div>`;
}

function abrirDetalle(consultaId, editMode = false) {
  const list = currentMode === 'admin' ? adminConsultas : myConsultas;
  const c = list.find(x => x.id === consultaId);
  if (!c) return;
  const overlay = document.getElementById('modalOverlay');
  const cont = document.getElementById('modalContent');
  const cliente = c.tipo_cliente === 'particular' ? `${c.cliente_nombre || ''} ${c.cliente_apellido || ''}`.trim() : (c.reventa_nombre || '');
  // gcia y % financiación SOLO admin — y SOLO si la Edge realmente mando la ganancia.
  // Sin el segundo chequeo, una sesion sin credenciales pinta margenes calculados
  // sobre una ganancia 0 (ver gciaDisponible).
  const showGcia = currentMode === 'admin' && gciaDisponible;
  const itemsHtml = (c.items || []).map((it, i) => {
    // Para items de reparto creados antes del fix, los campos del analisis vienen en null
    // y el modelo guardado puede ser el alias (sin "VW " ni "MY##"). Recalculamos en vivo
    // usando stockData / bt actuales y normalizamos el modelo al canonico para que
    // todos los lookups posteriores (competencia, stock del modelo, ventasMes) matcheen.
    if (it.es_reparto) {
      const canon = resolveModeloCanonico(it.modelo) || it.modelo;
      if (it.oferta_vigente_min == null) {
        const pseudoU = { modelo: canon, esReparto: true, chasisSeleccionados: [], precioPedido: it.precio_pedido };
        const a = calcularAnalisisUnidad(pseudoU);
        if (a) {
          it = { ...it, modelo: canon,
            oferta_vigente_min: a.oferta_vigente_min,
            gcia_vigente_min: a.gcia_vigente_min,
            precio_lista: it.precio_lista || a.precio_lista,
            dto_extra_pedido: a.dto_extra_pedido,
            gcia_resultante: a.gcia_resultante };
        } else {
          it = { ...it, modelo: canon };
        }
      } else if (canon !== it.modelo) {
        it = { ...it, modelo: canon };
      }
    }
    // Admin: la gcia que importa es la de HOY. La guardada la calculo el vendedor con la ganancia
    // blindada (0), asi que recalculamos el analisis en vivo desde stockData. Mantiene el precio
    // pedido; oferta/dto/gcia pasan a reflejar el stock y la ganancia reales del momento.
    if (showGcia && it.precio_pedido != null) {
      const aLive = analisisAdminVivo(it);
      if (aLive) {
        it = { ...it,
          oferta_vigente_min: aLive.oferta_vigente_min,
          gcia_vigente_min: aLive.gcia_vigente_min,
          precio_lista: aLive.precio_lista || it.precio_lista,
          dto_extra_pedido: aLive.dto_extra_pedido,
          gcia_resultante: aLive.gcia_resultante };
      }
    }
    const chasis = (it.chasis || []).map(ch => {
      // El chasis que pidieron quedo guardado en la consulta, pero la demora es un
      // dato de HOY: se cruza en vivo contra el stock para que al responder no se
      // prometa una entrega de una unidad que sigue trabada en la terminal.
      const liveCh = (stockData || []).find(r => r.serie === ch.serie) || {};
      const dem = liveCh.demora || null;
      // Idem con el bloqueo: puede haberse trabado (o habilitado) despues.
      const blq = liveCh.bloqueo || null;
      // El precio especial por chasis tambien es dato de HOY: puede haberse cargado
      // (o sacado) despues de que el vendedor mando la consulta.
      const espCh = liveCh.fuente_oferta === 'unidad' && liveCh.oferta_vigente > 0;
      return `<div style="font-size:12px; padding:4px 0; border-bottom:1px dashed var(--vw-grey-2)">
        <strong>${escapeHtml(ch.color || '—')}</strong> · <span class="muted">${escapeHtml(ch.serie || '')}</span>
        ${ch.enReparto ? ' <span class="tag-badge" style="background:#c7d2fe; color:#312e81">EN REPARTO</span>' : ''}
        ${ch.fecha_factura ? `· <span class="muted">Fact ${escapeHtml(ch.fecha_factura)}</span>` : ''}
        · ${fmtMoney(ch.oferta_vigente)}${ch.fuente_oferta === 'stock_limitado' ? ' <span class="tag-badge lim">LIM</span>' : ''}
        ${espCh ? ' <span class="tag-badge" style="background:#dcfce7; color:#166534">OFERTA ESPECIAL</span>' : ''}
        ${cartelBloqueo(blq)}
        ${cartelDemora(dem)}
      </div>`;
    }).join('');
    // Stock actual del mismo modelo (solo admin), ordenado de mas viejo a mas nuevo,
    // con los chasis pedidos resaltados.
    let stockHtml = '';
    if (showGcia) {
      const seriesPedidas = new Set((it.chasis || []).map(ch => ch.serie));
      const stockMismoModelo = (stockData || [])
        .filter(r => r.libre && r.modelo === it.modelo)
        .sort((a, b) => {
          if (a.fecha_factura && b.fecha_factura) return a.fecha_factura - b.fecha_factura;
          if (a.fecha_factura) return -1;
          if (b.fecha_factura) return 1;
          return 0;
        });
      // Ofertas especiales por chasis (portal_precios_unidad): se muestran SIEMPRE,
      // aunque la unidad con oferta no sea la que estan consultando. Es justo el dato
      // que decide la respuesta: en vez de bajarle el precio al chasis pedido, ofrecer
      // el otro que ya esta de oferta.
      const nEsp = stockMismoModelo.filter(r => r.fuente_oferta === 'unidad' && r.oferta_vigente > 0).length;
      const filas = stockMismoModelo.map(r => {
        const pedido = seriesPedidas.has(r.serie);
        const esp = r.fuente_oferta === 'unidad' && r.oferta_vigente > 0;
        // Diferencia contra la oferta normal del modelo (la del Baratito).
        const deltaEsp = esp && r.oferta_baratito > 0 ? r.oferta_vigente - r.oferta_baratito : null;
        const style = pedido ? 'background:#fff3cd; border-left:3px solid var(--orange); padding-left:6px'
          : (esp ? 'background:#f0fdf4; border-left:3px solid #16a34a; padding-left:6px' : '');
        return `<div style="font-size:12px; padding:4px 6px; border-bottom:1px dashed var(--vw-grey-2); ${style}">
          ${pedido ? '<strong>► </strong>' : ''}<strong>${escapeHtml(r.color || '—')}</strong>
          · <span class="muted">${escapeHtml(r.serie)}</span>
          ${r.fecha_factura_str ? `· <span class="muted">${escapeHtml(r.fecha_factura_str)}</span>` : ''}
          ${r.enReparto ? ' <span class="tag-badge" style="background:#c7d2fe; color:#312e81">EN REPARTO</span>' : ''}
          ${r.aRecibir ? ' <span class="tag-badge" style="background:#fbbf24; color:#78350f">A RECIBIR</span>' : ''}
          ${r.demora ? ' <span class="tag-badge" style="background:#fecaca; color:#7f1d1d">NO LLEGÓ</span>' : ''}
          ${r.bloqueo ? ' <span class="tag-badge" style="background:#dc2626; color:#fff">NO SE PUEDE VENDER</span>' : ''}
          ${pedido ? ' <span style="color:var(--orange); font-weight:700; font-size:11px">PEDIDO</span>' : ''}
          ${esp ? `<div style="font-size:11px; color:#166534; font-weight:700; margin-top:2px">💲 Oferta especial: ${fmtMoney(r.oferta_vigente)}${deltaEsp != null ? ` <span style="font-weight:400">(${deltaEsp < 0 ? '−' : '+'}${fmtMoney(Math.abs(deltaEsp))} vs ${fmtMoney(r.oferta_baratito)} del modelo)</span>` : ''}${r.gcia_vigente ? ` <span style="font-weight:400">· gcia ${fmtPct(r.gcia_vigente)}</span>` : ''}</div>` : ''}

        </div>`;
      }).join('') || '<div class="muted" style="font-size:12px; padding:6px 0">Sin stock libre actual.</div>';
      stockHtml = `
        <div style="margin-top:12px; padding-top:10px; border-top:1px solid var(--vw-grey-2)">
          <div style="font-size:13px; margin-bottom:6px">
            <strong>📦 Stock actual del modelo:</strong> ${stockMismoModelo.filter(r => !r.enReparto).length} chasis libre${stockMismoModelo.filter(r => !r.enReparto).length === 1 ? '' : 's'}${stockMismoModelo.some(r => r.enReparto) ? ` + ${stockMismoModelo.filter(r => r.enReparto).length} en reparto` : ''}
            <span class="muted" style="font-size:11px">(de más viejo a más nuevo)</span>
            ${nEsp ? `<div style="font-size:12px; color:#166534; font-weight:700; margin-top:2px">💲 ${nEsp} ${nEsp === 1 ? 'chasis tiene' : 'chasis tienen'} oferta especial cargada</div>` : ''}
          </div>
          ${filas}
        </div>
      `;
    }
    // Reparto VW (para reponer) — solo admin, abajo del stock. Muestra si VW ya
    // asigno unidades de este modelo que todavia no entraron a Oversoft: cuantas
    // y desglose por color, separando "disponibles para pedir" de "ya pedidas".
    let repartoStockHtml = '';
    if (showGcia) {
      const ncCur = (((stockData || []).find(s => s.modelo === it.modelo)) || {}).nombreCorto || (resolveModeloCanonico(it.modelo) || null);
      let rep = repartoStockData[it.modelo];
      if (!rep) rep = Object.values(repartoStockData).find(x => (ncCur && x.nombreCorto === ncCur) || x.modelo === (resolveModeloCanonico(it.modelo) || it.modelo));
      const chip = (obj) => Object.keys(obj.colores).sort().map(c =>
        `<span style="display:inline-block; background:#fff; border:1px solid var(--vw-grey-2); border-radius:12px; padding:2px 8px; margin:2px 4px 2px 0; font-size:12px">${escapeHtml(c)}: <strong>${obj.colores[c]}</strong></span>`
      ).join('');
      if (rep && rep.total > 0) {
        const disp = rep.disponibles || { total: 0, colores: {} };
        const ped = rep.pedidas || { total: 0, colores: {} };
        repartoStockHtml = `
          <div style="margin-top:12px; padding-top:10px; border-top:1px solid var(--vw-grey-2)">
            <div style="font-size:13px; margin-bottom:6px">
              <strong>🚚 En reparto (para reponer):</strong> ${rep.total} ${rep.total === 1 ? 'unidad' : 'unidades'}
              <span class="muted" style="font-size:11px">(asignadas por VW, todavía no en Oversoft)</span>
            </div>
            ${disp.total ? `<div style="font-size:12px; padding:3px 0"><strong style="color:var(--green)">Disponibles para pedir (${disp.total}):</strong><br>${chip(disp)}</div>` : ''}
            ${ped.total ? `<div style="font-size:12px; padding:3px 0"><span class="muted">Ya pedidas / en camino (${ped.total}):</span><br>${chip(ped)}</div>` : ''}
          </div>`;
      } else {
        repartoStockHtml = `
          <div style="margin-top:12px; padding-top:10px; border-top:1px solid var(--vw-grey-2)">
            <div style="font-size:13px"><strong>🚚 En reparto:</strong> <span class="muted">sin unidades de este modelo para reponer.</span></div>
          </div>`;
      }
    }
    // Comparativa vs competencia — solo admin.
    //  - ElCeroKm / Espasa vienen CON flete y formularios: se comparan con el precio pedido tal cual.
    //  - Mercado Libre viene SIN flete y formularios (API del portal de precios): a nuestra oferta
    //    y al precio pedido se les resta FYF antes de ubicarlos en el ranking.
    let competenciaHtml = '';
    if (showGcia && (competenciaMap[it.modelo] || competenciaML[it.modelo])) {
      const comp = competenciaMap[it.modelo] || {};
      const ml = competenciaML[it.modelo];
      // Number(null) es 0: una consulta sin precio no se compara contra nada.
      const ped = it.precio_pedido != null && Number(it.precio_pedido) > 0 ? Number(it.precio_pedido) : null;
      const filaComp = (label, precio) => {
        if (!precio || isNaN(precio)) return '';
        if (!ped) {
          return `
          <div style="display:grid; grid-template-columns:1fr auto; gap:10px; padding:6px 6px; border-bottom:1px dashed var(--vw-grey-2); font-size:12px">
            <span><strong>${escapeHtml(label)}</strong></span>
            <span class="muted">${fmtMoney(precio)}</span>
          </div>`;
        }
        const diff = (ped - precio) / precio;
        const isHigher = diff > 0;
        const color = isHigher ? 'var(--red)' : 'var(--green)';
        const pctTxt = (Math.abs(diff) * 100).toFixed(2) + '%';
        const txt = isHigher ? `${pctTxt} más caro` : `${pctTxt} más barato`;
        const dolarDiff = ped - precio;
        const dolarTxt = (dolarDiff >= 0 ? '+' : '−') + fmtMoney(Math.abs(dolarDiff)).replace('$', '$');
        return `
          <div style="display:grid; grid-template-columns:1fr auto auto; gap:10px; padding:6px 6px; border-bottom:1px dashed var(--vw-grey-2); font-size:12px; align-items:center">
            <span><strong>${escapeHtml(label)}</strong> <span class="muted">${fmtMoney(precio)}</span></span>
            <span class="muted" style="font-size:11px">(${dolarTxt})</span>
            <span style="color:${color}; font-weight:600; text-align:right; white-space:nowrap">${txt}</span>
          </div>
        `;
      };
      const filasComp = [filaComp('ElCeroKm', comp.tu0km), filaComp('EspasaOnline', comp.espasa)].filter(Boolean).join('');
      const okmHtml = filasComp ? `
            <div style="font-size:12px; font-weight:700; margin:2px 0 4px">🏷 ElCeroKm / Espasa
              <span class="muted" style="font-weight:400; font-size:11px">(con flete y formularios${ped ? `, contra el precio pedido ${fmtMoney(ped)}` : ''})</span>
            </div>
            ${filasComp}` : '';

      // Mercado Libre, CON flete y formularios como ElCeroKm: la API trae el contado
      // sin FyF y aca se le suma FYF, asi se compara directo con la oferta de Baratito
      // y con el precio pedido. El puesto no cambia (a todos se les suma lo mismo).
      let mlHtml = '';
      if (ml && ml.rivales && ml.rivales.length) {
        const oferta = Number(ml.nuestro_sin_fyf) > 0 ? Number(ml.nuestro_sin_fyf) + FYF : null;
        const rivales = ml.rivales.map(r => ({ ...r, precio: r.precio_sin_fyf + FYF }));
        const total = rivales.length + 1;
        const mejor = rivales[0];
        // Un puesto por concesionario: los que publican más barato quedan adelante.
        const puestoDe = (precio) => 1 + rivales.filter(r => r.precio < precio).length;
        const colorPuesto = (p) => p === 1 ? 'var(--green)' : p <= 3 ? '#b45309' : 'var(--red)';
        const lineaPuesto = (label, precio) => {
          const p = puestoDe(precio);
          return `
            <div style="display:grid; grid-template-columns:1fr auto; gap:10px; padding:6px 6px; border-bottom:1px dashed var(--vw-grey-2); font-size:12px; align-items:center">
              <span><strong>${label}</strong> <span class="muted">${fmtMoney(precio)}</span></span>
              <strong style="color:${colorPuesto(p)}; white-space:nowrap">${p}° de ${total} en ML</strong>
            </div>`;
        };
        // Misma fila que ElCeroKm: precio del concesionario, diferencia en pesos y en %.
        const ref = ped || oferta;
        const filaML = (r) => {
          const nombre = `<a href="${escapeHtml(r.url)}" target="_blank" rel="noopener">${escapeHtml(r.vendedor)}</a>`
            + (r.incluye_fyf === true ? '' : ` <span class="muted" style="font-size:11px">(${r.incluye_fyf === false ? 'contado' : 'contado, no aclara FyF'} + FyF)</span>`);
          if (!ref) {
            return `
            <div style="display:grid; grid-template-columns:1fr auto; gap:10px; padding:6px 6px; border-bottom:1px dashed var(--vw-grey-2); font-size:12px">
              <span>${nombre}</span><span class="muted">${fmtMoney(r.precio)}</span>
            </div>`;
          }
          const diff = (ref - r.precio) / r.precio;
          const color = diff > 0 ? 'var(--red)' : 'var(--green)';
          const pctTxt = (Math.abs(diff) * 100).toFixed(2) + '%';
          const dolar = ref - r.precio;
          return `
            <div style="display:grid; grid-template-columns:1fr auto auto; gap:10px; padding:6px 6px; border-bottom:1px dashed var(--vw-grey-2); font-size:12px; align-items:center">
              <span>${nombre} <span class="muted">${fmtMoney(r.precio)}</span></span>
              <span class="muted" style="font-size:11px">(${dolar >= 0 ? '+' : '−'}${fmtMoney(Math.abs(dolar))})</span>
              <span style="color:${color}; font-weight:600; text-align:right; white-space:nowrap">${diff > 0 ? `${pctTxt} más caro` : `${pctTxt} más barato`}</span>
            </div>`;
        };
        mlHtml = `
          <div style="margin-top:10px">
            <div style="font-size:12px; font-weight:700; margin-bottom:4px">🛒 Mercado Libre
              <span class="muted" style="font-weight:400; font-size:11px">(contado de concesionarios oficiales VW, con flete y formularios${ped ? `, contra el precio pedido ${fmtMoney(ped)}` : oferta ? ', contra nuestra oferta' : ''})</span>
            </div>
            ${oferta ? lineaPuesto('Nuestra oferta (Baratito)', oferta) : ''}
            ${ped ? lineaPuesto('Precio pedido', ped) : ''}
            ${filaML(mejor)}
            ${rivales.length > 1 ? `
            <details style="margin-top:2px">
              <summary style="cursor:pointer; font-size:12px; padding:4px 6px">Ver los ${rivales.length} concesionarios de ML</summary>
              ${rivales.slice(1).map(filaML).join('')}
            </details>` : ''}
          </div>`;
      }

      if (okmHtml || mlHtml) {
        competenciaHtml = `
          <div style="margin-top:12px; padding-top:10px; border-top:1px solid var(--vw-grey-2)">
            <div style="font-size:13px; margin-bottom:6px"><strong>📊 Vs competencia</strong></div>
            ${okmHtml}
            ${mlHtml}
          </div>
        `;
      }
    }
    // nombreCorto del modelo = clave de rotacionData (el snapshot del Motor). Sale del stock
    // si el modelo tiene unidades, y si no del catalogo. Lo comparten el cartel de vendidos
    // y el bloque de rotacion de mas abajo.
    const MES_ABR = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    const ncRot = showGcia
      ? ((((stockData || []).find(s => s.modelo === it.modelo)) || {}).nombreCorto
         || (((catalogoModelos || []).find(c => c.modelo === it.modelo || c.nombreCorto === it.modelo)) || {}).nombreCorto
         || null)
      : null;
    // Vendidos en el ULTIMO MES COMPLETO — solo admin. Sale de rotacionData (Oversoft en vivo,
    // mismo snapshot del Motor que los precios y que el bloque de rotacion), no de ninguna
    // planilla. Antes leia la col M de la tab "bt" del espejo, que en realidad era "vendidos
    // 60 dias": el cartel decia "ultimo mes" y mostraba otra cosa.
    // Arriba el mes EN CURSO (hasta hoy) y abajo el ultimo mes completo como referencia.
    let ventasMesHtml = '';
    if (showGcia && ncRot && rotacionData[ncRot]) {
      const _hoyV = new Date();
      const _vpm = rotacionData[ncRot].ventasPorMes || {};
      const _mk = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
      const _mt = d => MES_ABR[d.getMonth()] + ' ' + String(d.getFullYear()).slice(2);
      const _u = n => n + ' ' + (n === 1 ? 'unidad' : 'unidades');
      const _mesAct = new Date(_hoyV.getFullYear(), _hoyV.getMonth(), 1);
      const _mesAnt = new Date(_hoyV.getFullYear(), _hoyV.getMonth() - 1, 1);
      const vAct = Number(_vpm[_mk(_mesAct)]) || 0;
      const vAnt = Number(_vpm[_mk(_mesAnt)]) || 0;
      ventasMesHtml = `
        <div style="margin-top:8px; padding:6px 8px; background:#e7f1ff; border-left:3px solid var(--vw-blue); border-radius:4px; font-size:12px">
          <strong>📈 Vendidos en ${_mt(_mesAct)} (al ${_hoyV.getDate()}):</strong> ${_u(vAct)} de <strong>${escapeHtml(it.modelo)}</strong>
          <div style="color:#555; margin-top:2px">${_mt(_mesAnt)} completo: ${_u(vAnt)}</div>
        </div>`;
    }
    // Rotación del modelo (los comparativos del Baratito) — solo admin. Los datos
    // vienen de la Edge (rotacionData, mismo snapshot del Motor que los precios):
    // vendidos últimos 4 meses COMPLETOS, meses de stock (stock/(vend4/4)) y días
    // en venderse (promedio real últimos 12 meses). Mismos criterios y colores que
    // el panel Baratito de precios.
    let rotacionHtml = '';
    if (showGcia) {
      const rot = ncRot ? rotacionData[ncRot] : null;
      if (rot) {
        const mesesKeys = [];
        const _hoy = new Date();
        for (let k = 4; k >= 1; k--) {
          const x = new Date(_hoy.getFullYear(), _hoy.getMonth() - k, 1);
          mesesKeys.push(x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0'));
        }
        const vpm = rot.ventasPorMes || {};
        const vend4 = mesesKeys.reduce((a, mk) => a + (Number(vpm[mk]) || 0), 0);
        const celdasMeses = mesesKeys.map(mk =>
          `<div style="text-align:center"><div class="muted" style="font-size:10px">${MES_ABR[parseInt(mk.slice(5), 10) - 1]}</div><div style="font-weight:700">${Number(vpm[mk]) || 0}</div></div>`
        ).join('');
        // meses de stock: mismo criterio que Baratito (ritmo = vend4/4; ∞ si hay stock y 0 ventas)
        const ritmo = vend4 / 4;
        const stockM = Number(rot.stock) || 0;
        let mesesTxt, mesesColor;
        if (ritmo <= 0) { mesesTxt = stockM > 0 ? '∞' : '0 m'; mesesColor = stockM > 0 ? 'var(--red)' : 'var(--vw-grey-3)'; }
        else {
          const mm = stockM / ritmo;
          mesesTxt = mm.toFixed(1).replace('.', ',') + ' m';
          mesesColor = mm > 6 ? 'var(--red)' : (mm >= 3 ? '#d97706' : 'var(--green)');
        }
        // días en venderse (prom 12m + lentos), colores como Baratito: ≤30 verde / ≤60 ámbar / >60 rojo
        const dv = rot.diasVenta || null;
        let diasTxt = '—', diasColor = 'var(--vw-grey-3)', diasSub = 'sin ventas medidas';
        if (dv && dv.diasProm != null) {
          const dd = Math.round(dv.diasProm);
          diasTxt = dd + ' d';
          diasColor = dd > 60 ? 'var(--red)' : (dd > 30 ? '#d97706' : 'var(--green)');
          diasSub = 'prom. sobre ' + (dv.n || 0) + ' venta' + ((dv.n || 0) === 1 ? '' : 's') + ' (12 m)'
            + (dv.lentoN ? ` · ${dv.lentoN} lenta${dv.lentoN === 1 ? '' : 's'} (máx ${Math.round(dv.lentoMax || 0)} d)` : '');
        }
        const caja = (titulo, cuerpo) =>
          `<div style="background:#fff; border:1px solid var(--vw-grey-2); border-radius:6px; padding:8px"><div class="muted" style="font-size:11px; margin-bottom:4px">${titulo}</div>${cuerpo}</div>`;
        rotacionHtml = `
          <div style="margin-top:12px; padding-top:10px; border-top:1px solid var(--vw-grey-2)">
            <div style="font-size:13px; margin-bottom:6px">
              <strong>🔄 Rotación del modelo</strong>
              <span class="muted" style="font-size:11px">(mismos números que el Baratito)</span>
            </div>
            <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:8px; font-size:12px">
              ${caja('Vendidos · últ. 4 meses completos',
                `<div style="display:grid; grid-template-columns:repeat(4,1fr); gap:4px">${celdasMeses}</div>
                 <div style="margin-top:4px; text-align:center"><strong>${vend4}</strong> <span class="muted">total</span></div>`)}
              ${caja('Meses de stock',
                `<div style="font-size:18px; font-weight:700; color:${mesesColor}">${mesesTxt}</div>
                 <div class="muted" style="font-size:11px">${stockM} en stock · ritmo ${ritmo.toFixed(1).replace('.', ',')}/mes</div>`)}
              ${caja('Días en venderse',
                `<div style="font-size:18px; font-weight:700; color:${diasColor}">${diasTxt}</div>
                 <div class="muted" style="font-size:11px">${diasSub}</div>`)}
            </div>
          </div>`;
      }
    }
    const repartoBadge = it.es_reparto
      ? ' <span style="background:#fbbf24; color:#78350f; padding:2px 7px; border-radius:8px; font-size:10px; font-weight:700; margin-left:6px">REPARTO</span>'
      : '';
    // Solo para items viejos de reparto (sin chasis). Los nuevos si traen chasis:
    // la unidad de reparto se elige con serie y color, igual que una de stock.
    const noChasisMsg = (it.es_reparto && !(it.chasis || []).length)
      ? `<div class="muted" style="font-size:12px; padding:6px 0">Sin chasis en stock libre — la unidad viene en reparto.</div>`
      : '';
    // El analisis se calcula igual para reparto y stock (oferta_vigente y gcia salen de cualquier
    // chasis del modelo en stockData, precio_lista override de bt para reparto).
    // Consulta de disponibilidad pura: el vendedor no pidió precio, así que no hay dto
    // ni gcia resultante que mostrar. En vez de cuatro guiones, damos la referencia con
    // la que el admin va a decidir: el precio Baratito del modelo y su ganancia de hoy.
    const refIt = (c.origen === 'sin_disponibilidad' && it.precio_pedido == null) ? refAdminUnidad(it) : null;
    const analisisHtml = refIt
      ? `<div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:10px; font-size:13px">
          <div><span class="muted">Precio pedido:</span> <strong>Solo consulta de disponibilidad</strong></div>
          <div><span class="muted">Precio Baratito hoy:</span> <strong>${fmtMoney(refIt.oferta)}</strong></div>
          <div><span class="muted">Precio de lista:</span> <strong>${fmtMoney(refIt.precio_lista)}</strong></div>
          ${showGcia ? `<div><span class="muted">Gcia a ese precio:</span> <strong style="color:${(refIt.gcia||0) >= 0 ? 'var(--green)' : 'var(--red)'}">${fmtPct(refIt.gcia)}</strong></div>` : ''}
        </div>
        ${bloqueTransferencia(it, showGcia, refIt.oferta)}`
      : `<div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:10px; font-size:13px">
          <div><span class="muted">${c.origen === 'venta_hecha' ? 'Vendida en:' : 'Precio pedido:'}</span> <strong>${fmtMoney(it.precio_pedido)}</strong></div>
          <div><span class="muted">Oferta vigente:</span> <strong>${fmtMoney(it.oferta_vigente_min)}</strong></div>
          <div><span class="muted">${c.origen === 'venta_hecha' ? 'Dto extra de la venta:' : 'Dto extra pedido:'}</span> <strong>${fmtPct(it.dto_extra_pedido)}</strong></div>
          ${showGcia ? `<div><span class="muted">Gcia resultante:</span> <strong style="color:${(it.gcia_resultante||0) >= 0 ? 'var(--green)' : 'var(--red)'}">${fmtPct(it.gcia_resultante)}</strong></div>` : ''}
        </div>
        ${bloqueTransferencia(it, showGcia)}`;
    // Últimos precios autorizados de ESTE modelo (solo admin). Referencia para decidir:
    // recorre todas las consultas ya resueltas del mismo modelo y toma el precio que se
    // autorizó en cada una — aceptada → precio_pedido; rechazada/contraoferta → precio_max_admin.
    // El margen se recalcula EN VIVO al precio autorizado con la ganancia real de hoy
    // (analisisAdminVivo), porque la gcia guardada en el item la calculó el vendedor con la
    // ganancia blindada (0) y no sirve. Ordenados por fecha de respuesta, los 3 más recientes.
    let historialHtml = '';
    if (showGcia) {
      const canonCur = resolveModeloCanonico(it.modelo) || it.modelo;
      const autorizados = [];
      (adminConsultas || []).forEach(oc => {
        if (oc.id === c.id) return; // no incluir la consulta abierta
        if (!['aceptada', 'rechazada', 'contraoferta'].includes(oc.estado)) return;
        (oc.items || []).forEach(oit => {
          const canonH = resolveModeloCanonico(oit.modelo) || oit.modelo;
          if (canonH !== canonCur) return;
          const precioAut = oc.estado === 'aceptada' ? oit.precio_pedido : oc.precio_max_admin;
          if (!precioAut) return;
          autorizados.push({ precio: precioAut, fecha: oc.admin_respuesta_at || oc.created_at, estado: oc.estado });
        });
      });
      autorizados.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
      const ultimos3 = autorizados.slice(0, 3);
      if (ultimos3.length) {
        const ESTADO_LBL = { aceptada: 'Aceptada', rechazada: 'Mejor precio', contraoferta: 'Contraoferta' };
        const ESTADO_BG = { aceptada: '#dcfce7;color:#166534', rechazada: '#fee2e2;color:#991b1b', contraoferta: '#fef3c7;color:#92400e' };
        const filas = ultimos3.map(h => {
          const aut = analisisAdminVivo({ modelo: it.modelo, precio_pedido: h.precio, chasis: [] });
          const margen = aut ? aut.gcia_resultante : null;
          const mColor = margen == null ? 'var(--vw-grey-3)' : (margen >= 0 ? 'var(--green)' : 'var(--red)');
          return `<div style="display:grid; grid-template-columns:auto 1fr auto; gap:10px; padding:6px 6px; border-bottom:1px dashed var(--vw-grey-2); font-size:12px; align-items:center">
              <span class="muted" style="font-size:11px; white-space:nowrap">${fmtDate(h.fecha)}</span>
              <span><strong>${fmtMoney(h.precio)}</strong> <span style="background:${ESTADO_BG[h.estado] || '#e5e7eb;color:#374151'}; padding:1px 6px; border-radius:6px; font-size:10px; font-weight:700">${ESTADO_LBL[h.estado] || h.estado}</span></span>
              <span style="color:${mColor}; font-weight:700; text-align:right; white-space:nowrap">${margen == null ? '—' : fmtPct(margen)}</span>
            </div>`;
        }).join('');
        historialHtml = `
          <div style="margin-top:12px; padding-top:10px; border-top:1px solid var(--vw-grey-2)">
            <div style="font-size:13px; margin-bottom:6px">
              <strong>🧾 Últimos precios autorizados</strong>
              <span class="muted" style="font-size:11px">(margen recalculado con la ganancia de hoy)</span>
            </div>
            ${filas}
          </div>`;
      }
    }
    return `
      <div class="card" style="background:var(--vw-grey-1)">
        <h3 style="font-size:14px; margin-bottom:8px">Unidad ${i + 1}: ${escapeHtml(it.modelo)}${repartoBadge}</h3>
        ${chasis}
        ${noChasisMsg}
        ${ventasMesHtml}
        ${analisisHtml}
        ${historialHtml}
        ${competenciaHtml}
        ${rotacionHtml}
        ${showGcia ? bloqueQueHay(c, it) : ''}
        ${showGcia ? historialDisponibilidad(c, it) : ''}
        ${stockHtml}
        ${repartoStockHtml}
      </div>
    `;
  }).join('');

  let financiaTxt = 'No financia';
  if (c.financia) {
    const ent = c.financia_entidad === 'otros' ? (c.financia_entidad_otro || 'otros') : (c.financia_entidad || '');
    financiaTxt = `Sí · ${ent.toUpperCase()} · ${fmtMoney(c.financia_monto)}` + (showGcia && c.financia_pct ? ` (${(c.financia_pct*100).toFixed(1)}%)` : '');
  }
  let vsOtroTxt = c.vs_otro_concesionario === 'si' ? `Sí — ${escapeHtml(c.concesionario_nombre)}: ${fmtMoney(c.concesionario_precio)}`
    : (c.vs_otro_concesionario === 'no_quiere_pasar' ? 'No quiere pasar el concesionario' : 'No');
  let fuenteTxt = c.fuente_dato === 'otro' ? (c.fuente_dato_otro || 'otro') : (c.fuente_dato || '—');

  const isAdmin = currentMode === 'admin';
  const isPending = c.estado === 'pendiente' || c.estado === 'en_gestion';
  const showEditForm = isAdmin && (isPending || editMode);
  // Sin disponibilidad: la respuesta no es "acepto el precio" sino "se consigue o no".
  const esSinDisp = c.origen === 'sin_disponibilidad';
  const btnEliminar = (isAdmin && _esSuperadmin())
    ? `<button onclick="eliminarConsulta(${c.id})" style="background:#991B1B; color:#fff; padding:10px 14px; border-radius:8px; border:none; font-weight:600; cursor:pointer">🗑 Eliminar</button>`
    : '';
  let footerHtml = `${btnEliminar}<button class="btn-secondary" onclick="closeModal()">Cerrar</button>`;
  if (showEditForm) {
    let defaultVal = '';
    let defaultObs = '';
    if (editMode) {
      defaultVal = c.precio_max_admin ? '$' + Math.round(c.precio_max_admin).toLocaleString('es-AR') : '';
      defaultObs = c.observaciones_admin || '';
    } else {
      // Pre-llenar con la oferta vigente actual de la primera unidad para que solo
      // tenga que ajustarla (en vez de tipear desde cero). Si por algun motivo no hay
      // oferta vigente (reparto sin registros en stockData), caemos al precio pedido.
      const first = (c.items && c.items[0]) || null;

// Muestra/oculta el textarea de comentario del admin (colapsado por defecto para
// ganar espacio vertical en el celular). El contenido nunca se pierde: solo se
// togglea el display; #adminObs sigue en el DOM y las acciones leen su value.
function toggleAdminObs() {
  const wrap = document.getElementById('adminObsWrap');
  const btn = document.getElementById('adminObsToggle');
  if (!wrap || !btn) return;
  const abrir = wrap.style.display === 'none';
  wrap.style.display = abrir ? 'block' : 'none';
  btn.style.display = abrir ? 'none' : 'inline-block';
  if (abrir) { const ta = document.getElementById('adminObs'); if (ta) ta.focus(); }
}

function onAdminPrecioMaxInput(consultaId, el) {
  const raw = el.value.replace(/[^\d]/g, '');
  el.value = raw ? '$' + parseInt(raw, 10).toLocaleString('es-AR') : '';
  const wordsDiv = document.getElementById('adminPrecioMaxWords');
  if (wordsDiv) {
    const t = numToTextES(raw ? parseInt(raw, 10) : 0);
    wordsDiv.textContent = t ? `≈ ${t}` : '';
  }
  const hint = document.getElementById('adminPrecioMaxHint');
  const c = adminConsultas.find(x => x.id === consultaId);
  if (!c || !c.items || c.items.length === 0) { hint.textContent = ''; return; }
  if (!raw) { hint.textContent = ''; return; }
  const precio = parseInt(raw, 10);
  const it = c.items[0];
  // Gcia/oferta de HOY (no la guardada por el vendedor con ganancia blindada). En
  // "sin disponibilidad" el modelo puede no tener ninguna unidad: refAdminUnidad cae
  // al catalogo (precio Baratito del modelo) para que igual haya margen.
  const ref = refAdminUnidad(it);
  if (!ref || !ref.precio_lista || ref.precio_lista <= 0) { hint.textContent = ''; return; }
  const oferta_vigente = ref.oferta;
  const precio_lista = ref.precio_lista;
  const gcia_vigente = ref.gcia;
  const dto = (oferta_vigente - precio) / precio_lista;
  // Si una parte se cobra por transferencia, el precio que se autoriza NO es lo que
  // entra: hay que descontarle la alicuota del mes sobre el monto transferido. Sin
  // esto el hint muestra una ganancia que no existe.
  const montoTr = Number(it.transferencia_monto) || 0;
  const costoTr = montoTr > 0 ? costoTransferencia(montoTr) : 0;
  const dtoTr = costoTr > 0 ? costoTr / precio_lista : 0;
  const gcia = (gcia_vigente || 0) - dto - dtoTr;
  const colorG = gcia >= 0 ? 'var(--green)' : 'var(--red)';
  hint.innerHTML = costoTr > 0
    ? `Con ${fmtMoney(precio)}: dto extra ${fmtPct(dto)} + ${fmtPct(dtoTr)} de la transferencia ` +
      `(${fmtMoney(costoTr)}) · entran ${fmtMoney(precio - costoTr)} · ` +
      `<strong style="color:${colorG}">gcia ${fmtPct(gcia)}</strong>`
    : `Con ${fmtMoney(precio)}: dto extra ${fmtPct(dto)} · <strong style="color:${colorG}">gcia ${fmtPct(gcia)}</strong>`;
}

// ---------- Resultado de venta (lo marca el vendedor) ----------
function renderResultadoVentaSection(c) {
  const esVendedor = currentMode === 'vendedor' || currentMode === 'gerente';
  const yaCargado = !!c.resultado_venta;
  // No mostrar nada cuando todavia esta pendiente y nadie cargo resultado.
  // Si ya hay resultado cargado, mostrarlo siempre (vendedor y admin).
  if (!yaCargado && !esVendedor) return '';
  if (!yaCargado && c.estado === 'pendiente') return ''; // todavia no respondida, no tiene sentido cargar venta

  if (yaCargado) {
    const esVendida = c.resultado_venta === 'vendida';
    const badge = esVendida
      ? `<span style="background:#d1fae5; color:#065f46; padding:4px 10px; border-radius:20px; font-size:12px; font-weight:600">✓ VENDIDA</span>`
      : `<span style="background:#fee2e2; color:#991b1b; padding:4px 10px; border-radius:20px; font-size:12px; font-weight:600">✗ NO VENDIDA</span>`;
    return `
      <div class="detalle-section">
        <h4>Resultado de venta</h4>
        <div class="kv">
          <span class="k">Resultado</span><span class="v">${badge}</span>
          ${c.preventa ? `<span class="k">Preventa</span><span class="v"><strong>${escapeHtml(c.preventa)}</strong></span>` : ''}
          ${c.resultado_venta_at ? `<span class="k">Cargado</span><span class="v">${fmtDate(c.resultado_venta_at)}</span>` : ''}
        </div>
        ${(c.motivo_no_venta || '').trim() ? `
          <div style="margin-top:10px">
            <div style="font-size:12px; color:var(--vw-grey-4); margin-bottom:4px">Motivo</div>
            <div style="white-space:pre-wrap; padding:8px; background:var(--vw-grey-1); border-radius:6px">${escapeHtml(c.motivo_no_venta)}</div>
          </div>
        ` : ''}
      </div>
    `;
  }
  // Vendedor con consulta respondida y sin resultado todavia: mostrar botones
  return `
    <div class="detalle-section">
      <h4>Resultado de venta</h4>
      <p style="font-size:13px; color:var(--vw-grey-4); margin-bottom:10px">¿Cómo terminó esta consulta con el cliente?</p>
      <div id="resultadoVentaActions">
        <div style="display:flex; gap:8px; flex-wrap:wrap">
          <button onclick="marcarVendida(${c.id})" style="background:#16a34a; color:#fff; padding:10px 18px; border-radius:8px; border:none; font-weight:600; cursor:pointer">✓ Sí, se vendió</button>
          <button onclick="mostrarMotivoNoVenta(${c.id})" style="background:#dc2626; color:#fff; padding:10px 18px; border-radius:8px; border:none; font-weight:600; cursor:pointer">✗ No se vendió</button>
        </div>
        ${bloquePreventaVenta(c, '0km')}
      </div>
      <div id="resultadoVentaMotivo" class="hidden" style="margin-top:12px">
        <label style="display:block; font-size:12px; color:var(--vw-grey-4); margin-bottom:4px">Motivo (obligatorio)</label>
        <textarea id="motivoNoVentaTxt" rows="3" placeholder="Ej: el cliente decidió comprar otra marca, no le alcanzaba el descuento, se cayó la financiación..."
          style="width:100%; padding:10px; border:2px solid var(--vw-grey-2); border-radius:8px; font-size:14px; font-family:inherit; resize:vertical"></textarea>
        <div style="display:flex; gap:8px; margin-top:8px; justify-content:flex-end">
          <button onclick="ocultarMotivoNoVenta()" class="btn-secondary">Cancelar</button>
          <button onclick="marcarNoVendida(${c.id})" style="background:#dc2626; color:#fff; padding:10px 18px; border-radius:8px; border:none; font-weight:600; cursor:pointer">Guardar motivo</button>
        </div>

async function marcarVendida(consultaId) {
  const c = (myConsultas || []).find(x => x.id === consultaId);
  if (!c) { alert('No se encontró la consulta. Recargá la pantalla.'); return; }
  // La PV se valida ANTES de pedir la confirmacion: si esta mal, no tiene sentido
  // preguntar nada. Devuelve null cuando el vendedor tiene que corregirla.
  const pv = await resolverPreventa(c, '0km');
  if (pv === null) return;
  if (!confirm('¿Confirmar que esta consulta terminó en venta?')) return;
  showLoading('Guardando...');
  try {
    await sbFetch(`consultas_0km?id=eq.${consultaId}`, {
      method: 'PATCH',
      body: JSON.stringify({
        resultado_venta: 'vendida',
        motivo_no_venta: null,
        preventa: pv || null,
        resultado_venta_at: new Date().toISOString()
      })
    });
    closeModal();
    await cargarMisConsultas();
    hideLoading();
    showToast('Marcada como vendida');
  } catch(e) { hideLoading(); console.error(e); alert('Error: ' + (e.message || e)); }
}
async function marcarNoVendida(consultaId) {
  const motivo = (document.getElementById('motivoNoVentaTxt').value || '').trim();
  if (!motivo) { alert('Cargá el motivo por el que no se vendió'); return; }
  showLoading('Guardando...');
  try {
    await sbFetch(`consultas_0km?id=eq.${consultaId}`, {
      method: 'PATCH',
      body: JSON.stringify({
        resultado_venta: 'no_vendida',
        motivo_no_venta: motivo,
        resultado_venta_at: new Date().toISOString()
      })
    });
    closeModal();
    await cargarMisConsultas();
    hideLoading();
    showToast('Marcada como no vendida');
  } catch(e) { hideLoading(); console.error(e); alert('Error: ' + (e.message || e)); }
}

function getAdminObs() {
  const el = document.getElementById('adminObs');
  return el ? (el.value || '').trim() : '';
}
function getAdminPrecioMax() {
  const el = document.getElementById('adminPrecioMax');
  if (!el) return null;

// ===== Respuesta a una consulta SIN DISPONIBILIDAD =====
// Acá lo primero que se responde no es un precio sino si el auto se consigue. El precio
// es opcional: si se consigue y además se autoriza un valor, va en precio_max_admin.
// Los tres botones cubren el circuito real: consultar al zonal lleva tiempo, así que
// "en gestión" existe para parar los recordatorios sin cerrar la consulta.
async function marcarEnGestion(consultaId) {
  if (currentMode !== 'admin') { showToast('No autorizado'); return; }
  if (!confirm('¿Marcar como "en gestión con el zonal"?\n\nLa consulta queda abierta en Pendientes y dejan de llegar los recordatorios hasta que la respondas.')) return;
  showLoading('Guardando...');
  try {
    const obs = getAdminObs();
    await sbFetch(`consultas_0km?id=eq.${consultaId}`, {
      method: 'PATCH',
      body: JSON.stringify({
        estado: 'en_gestion',
        admin_user_id: currentUser.id,
        observaciones_admin: obs || null
      })
    });
    closeModal();
    await cargarConsultasAdmin();
    hideLoading();
    showToast('Marcada en gestión — sin recordatorios');
  } catch(e) { hideLoading(); console.error(e); alert('Error: ' + (e.message || e)); }
}

async function responderDisponibilidad(consultaId, seConsigue) {
  if (currentMode !== 'admin') { showToast('No autorizado'); return; }
  const obs = getAdminObs();
  const precio = getAdminPrecioMax();
  if (!seConsigue && !obs) {
    if (!confirm('Vas a responder que NO se consigue, sin comentario. ¿Seguir igual?')) return;
  } else {
    const txtPrecio = precio ? ` y autorizar ${fmtMoney(precio)}` : '';
    if (!confirm(`¿Responder que ${seConsigue ? 'SÍ' : 'NO'} se consigue${seConsigue ? txtPrecio : ''}?`)) return;
  }

// ============================================================================
// ============ CONSULTAS DE USADOS ===========================================
// ============================================================================
// Mismo circuito que las de 0km (el vendedor pide mejor precio, el admin acepta
// / rechaza / contraoferta) pero sobre una unidad usada concreta del stock.
//
// Diferencias de fondo con el 0km, todas pedidas por Fer (19/08/2026):
//  - SIN el analisis de atras (competencia, rotacion, stock del modelo, reparto,
//    ventas del mes). Un usado es una unidad unica: no hay "otros chasis" ni
//    ritmo de venta del modelo. Lo unico que se analiza es LA GANANCIA NUEVA.
//  - El costo es el de OVERSOFT (`usados.preciodetoma`), lo que se tomo real.
//    No se cae al precio del tasador. Si Oversoft no lo tiene, se dice.
//  - Historial POR UNIDAD (usadoid), no por modelo: "si antes pase contraofertas
//    por ese usado, que me figuren".
//
// COSTO BLINDADO: el costo y el margen NUNCA se guardan en `consultas_usados`
// ni viajan al browser del vendedor. La tabla no tiene columna de costo a
// proposito (RLS esta deshabilitado y el vendedor lee la tabla con la anon key:
// cualquier columna que guardemos ahi la puede ver). El margen se calcula en
// vivo, en la pantalla del admin, contra el costo que devuelve la Edge Function
// `usados-disponibles` solo a los usuarios autorizados.

const USADOS_EDGE_URL = SUPABASE_URL + '/functions/v1/usados-disponibles';

// ---------- Seccion activa (0km / usados) ----------
function setSeccion(s) {
  seccion = s;
  document.getElementById('tabSec0km').classList.toggle('active', s === '0km');

    if (_selMultipleActivo) toggleSelMultiple();
    else _selMultipleIds.clear();

}

// El boton "+ Nueva consulta" abre el wizard que corresponda a la seccion.
function nuevaConsultaDispatch() {
  return seccion === 'usados' ? showNuevaConsultaUsado() : showNuevaConsulta();
}

// ---------- Stock de usados ----------
// Manda las credenciales del logueado: la Edge devuelve el costo de toma SOLO
// si es uno de los usuarios autorizados (mismo patron que stock-disponible).
async function cargarUsadosStock(forzar = false) {
  if (usadosStockCargado && !forzar) return;
  const creds = credsEdge();
  const res = await fetch(USADOS_EDGE_URL, {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(creds)
  });
  if (!res.ok) throw new Error('usados-disponibles ' + res.status);
  const data = await res.json();
  if (!data || data.ok === false) throw new Error(data && data.error ? data.error : 'respuesta inválida');
  usadosStock = data.usados || [];
  usadosCostoOk = !!data.costoIncluido;
  usadosStockCargado = true;
}

function getUsadoStock(usadoid) {
  return usadosStock.find(u => Number(u.usadoid) === Number(usadoid)) || null;
}

// Texto corto de la unidad para titulos y listas.
function tituloUsadoStock(u) {
  if (!u) return '—';
  return u.patente ? `${u.unidad} (${u.patente})` : u.unidad;
}

// Particular vs. reventa (pedido de Fer, 27/08/2026). Las consultas anteriores a
// esa fecha no tienen el dato: en vez de inventar "particular" no se muestra nada,
// asi se ve de una que es una consulta vieja y no una venta a particular.

}

function txtTipoClienteUsado(tipo) {
