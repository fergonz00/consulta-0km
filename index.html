function abrirDetalle(consultaId, editMode = false) {
  const list = currentMode === 'admin' ? adminConsultas : myConsultas;
  const c = list.find(x => x.id === consultaId);
  if (!c) return;
  const overlay = document.getElementById('modalOverlay');
  const cont = document.getElementById('modalContent');
  const cliente = c.tipo_cliente === 'particular' ? `${c.cliente_nombre || ''} ${c.cliente_apellido || ''}`.trim() : (c.reventa_nombre || '');
  const showGcia = currentMode === 'admin'; // gcia y % financiación SOLO admin (fngonzalez)
  const itemsHtml = (c.items || []).map((it, i) => {
    // Para items de reparto creados antes del fix, los campos del analisis vienen en null
    // y el modelo guardado puede ser el alias (sin "VW " ni "MY##"). Recalculamos en vivo
    // usando stockData / bt actuales y normalizamos el modelo al canonico para que
    // todos los lookups posteriores (competencia, stock del modelo, ventasMes) matcheen.
    if (it.es_reparto) {
      const canon = resolveModeloCanonico(it.modelo) || it.modelo;
      if (it.oferta_vigente_min == null) {
        const pseudoU = { modelo: canon, esReparto: true, chasisSeleccionados: [], precioPedido: it.precio_pedido };
        const a = calcularAnalisisUnidad(pseudoU);
        if (a) {
          it = { ...it, modelo: canon,
            oferta_vigente_min: a.oferta_vigente_min,
            gcia_vigente_min: a.gcia_vigente_min,
            precio_lista: it.precio_lista || a.precio_lista,
            dto_extra_pedido: a.dto_extra_pedido,
            gcia_resultante: a.gcia_resultante };
        } else {
          it = { ...it, modelo: canon };
        }
      } else if (canon !== it.modelo) {
        it = { ...it, modelo: canon };
      }
    }
    // Admin: la gcia que importa es la de HOY. La guardada la calculo el vendedor con la ganancia
    // blindada (0), asi que recalculamos el analisis en vivo desde stockData. Mantiene el precio
    // pedido; oferta/dto/gcia pasan a reflejar el stock y la ganancia reales del momento.
    if (showGcia && it.precio_pedido != null) {
      const aLive = analisisAdminVivo(it);
      if (aLive) {
        it = { ...it,
          oferta_vigente_min: aLive.oferta_vigente_min,
          gcia_vigente_min: aLive.gcia_vigente_min,
          precio_lista: aLive.precio_lista || it.precio_lista,
          dto_extra_pedido: aLive.dto_extra_pedido,
          gcia_resultante: aLive.gcia_resultante };
      }
    }
    const chasis = (it.chasis || []).map(ch =>
      `<div style="font-size:12px; padding:4px 0; border-bottom:1px dashed var(--vw-grey-2)">
        <strong>${escapeHtml(ch.color || '—')}</strong> · <span class="muted">${escapeHtml(ch.serie || '')}</span>
        ${ch.enReparto ? ' <span class="tag-badge" style="background:#c7d2fe; color:#312e81">EN REPARTO</span>' : ''}
        ${ch.fecha_factura ? `· <span class="muted">Fact ${escapeHtml(ch.fecha_factura)}</span>` : ''}
        · ${fmtMoney(ch.oferta_vigente)}${ch.fuente_oferta === 'stock_limitado' ? ' <span class="tag-badge lim">LIM</span>' : ''}
      </div>`
    ).join('');
    // Stock actual del mismo modelo (solo admin), ordenado de mas viejo a mas nuevo,
    // con los chasis pedidos resaltados.
    let stockHtml = '';
    if (showGcia) {
      const seriesPedidas = new Set((it.chasis || []).map(ch => ch.serie));
      const stockMismoModelo = (stockData || [])
        .filter(r => r.libre && r.modelo === it.modelo)
        .sort((a, b) => {
          if (a.fecha_factura && b.fecha_factura) return a.fecha_factura - b.fecha_factura;
          if (a.fecha_factura) return -1;
          if (b.fecha_factura) return 1;
          return 0;
        });
      const filas = stockMismoModelo.map(r => {
        const pedido = seriesPedidas.has(r.serie);
        const style = pedido ? 'background:#fff3cd; border-left:3px solid var(--orange); padding-left:6px' : '';
        return `<div style="font-size:12px; padding:4px 6px; border-bottom:1px dashed var(--vw-grey-2); ${style}">
          ${pedido ? '<strong>► </strong>' : ''}<strong>${escapeHtml(r.color || '—')}</strong>
          · <span class="muted">${escapeHtml(r.serie)}</span>
          ${r.fecha_factura_str ? `· <span class="muted">${escapeHtml(r.fecha_factura_str)}</span>` : ''}
          ${r.enReparto ? ' <span class="tag-badge" style="background:#c7d2fe; color:#312e81">EN REPARTO</span>' : ''}
          ${r.aRecibir ? ' <span class="tag-badge" style="background:#fbbf24; color:#78350f">A RECIBIR</span>' : ''}
          ${pedido ? ' <span style="color:var(--orange); font-weight:700; font-size:11px">PEDIDO</span>' : ''}
        </div>`;
      }).join('') || '<div class="muted" style="font-size:12px; padding:6px 0">Sin stock libre actual.</div>';
      stockHtml = `
        <div style="margin-top:12px; padding-top:10px; border-top:1px solid var(--vw-grey-2)">
          <div style="font-size:13px; margin-bottom:6px">
            <strong>📦 Stock actual del modelo:</strong> ${stockMismoModelo.filter(r => !r.enReparto).length} chasis libre${stockMismoModelo.filter(r => !r.enReparto).length === 1 ? '' : 's'}${stockMismoModelo.some(r => r.enReparto) ? ` + ${stockMismoModelo.filter(r => r.enReparto).length} en reparto` : ''}
            <span class="muted" style="font-size:11px">(de más viejo a más nuevo)</span>
          </div>
          ${filas}
        </div>
      `;
    }
    // Reparto VW (para reponer) — solo admin, abajo del stock. Muestra si VW ya
    // asigno unidades de este modelo que todavia no entraron a Oversoft: cuantas
    // y desglose por color, separando "disponibles para pedir" de "ya pedidas".
    let repartoStockHtml = '';
    if (showGcia) {
      const ncCur = (((stockData || []).find(s => s.modelo === it.modelo)) || {}).nombreCorto || (resolveModeloCanonico(it.modelo) || null);
      let rep = repartoStockData[it.modelo];
      if (!rep) rep = Object.values(repartoStockData).find(x => (ncCur && x.nombreCorto === ncCur) || x.modelo === (resolveModeloCanonico(it.modelo) || it.modelo));
      const chip = (obj) => Object.keys(obj.colores).sort().map(c =>
        `<span style="display:inline-block; background:#fff; border:1px solid var(--vw-grey-2); border-radius:12px; padding:2px 8px; margin:2px 4px 2px 0; font-size:12px">${escapeHtml(c)}: <strong>${obj.colores[c]}</strong></span>`
      ).join('');
      if (rep && rep.total > 0) {
        const disp = rep.disponibles || { total: 0, colores: {} };
        const ped = rep.pedidas || { total: 0, colores: {} };
        repartoStockHtml = `
          <div style="margin-top:12px; padding-top:10px; border-top:1px solid var(--vw-grey-2)">
            <div style="font-size:13px; margin-bottom:6px">
              <strong>🚚 En reparto (para reponer):</strong> ${rep.total} ${rep.total === 1 ? 'unidad' : 'unidades'}
              <span class="muted" style="font-size:11px">(asignadas por VW, todavía no en Oversoft)</span>
            </div>
            ${disp.total ? `<div style="font-size:12px; padding:3px 0"><strong style="color:var(--green)">Disponibles para pedir (${disp.total}):</strong><br>${chip(disp)}</div>` : ''}
            ${ped.total ? `<div style="font-size:12px; padding:3px 0"><span class="muted">Ya pedidas / en camino (${ped.total}):</span><br>${chip(ped)}</div>` : ''}
          </div>`;
      } else {
        repartoStockHtml = `
          <div style="margin-top:12px; padding-top:10px; border-top:1px solid var(--vw-grey-2)">
            <div style="font-size:13px"><strong>🚚 En reparto:</strong> <span class="muted">sin unidades de este modelo para reponer.</span></div>
          </div>`;
      }
    }
    // Comparativa vs competencia (tu0km y espasaonline) — solo admin, solo si el modelo aparece en el sheet.
    let competenciaHtml = '';
    if (showGcia && competenciaMap[it.modelo]) {
      const comp = competenciaMap[it.modelo];
      const ped = it.precio_pedido;
      const filaComp = (label, precio) => {
        if (!precio || isNaN(precio)) return '';
        const diff = (ped - precio) / precio;
        const isHigher = diff > 0;
        const color = isHigher ? 'var(--red)' : 'var(--green)';
        const pctTxt = (Math.abs(diff) * 100).toFixed(2) + '%';
        const txt = isHigher ? `${pctTxt} más caro` : `${pctTxt} más barato`;
        const dolarDiff = ped - precio;
        const dolarTxt = (dolarDiff >= 0 ? '+' : '−') + fmtMoney(Math.abs(dolarDiff)).replace('$', '$');
        return `
          <div style="display:grid; grid-template-columns:1fr auto auto; gap:10px; padding:6px 6px; border-bottom:1px dashed var(--vw-grey-2); font-size:12px; align-items:center">
            <span><strong>${escapeHtml(label)}</strong> <span class="muted">${fmtMoney(precio)}</span></span>
            <span class="muted" style="font-size:11px">(${dolarTxt})</span>
            <span style="color:${color}; font-weight:600; text-align:right; white-space:nowrap">${txt}</span>
          </div>
        `;
      };
      const filasComp = [filaComp('ElCeroKm', comp.tu0km), filaComp('EspasaOnline', comp.espasa)].filter(Boolean).join('');
      if (filasComp) {
        competenciaHtml = `
          <div style="margin-top:12px; padding-top:10px; border-top:1px solid var(--vw-grey-2)">
            <div style="font-size:13px; margin-bottom:6px">
              <strong>📊 Vs competencia</strong>
              <span class="muted" style="font-size:11px">(comparado con precio pedido ${fmtMoney(ped)})</span>
            </div>
            ${filasComp}
          </div>
        `;
      }
    }
    // Vendidos en el ultimo mes — solo admin, solo si el modelo aparece en la pestaña "bt".
    let ventasMesHtml = '';
    if (showGcia) {
      const v = ventasBtMap[it.modelo];

        ventasMesHtml = `
          <div style="margin-top:8px; padding:6px 8px; background:#e7f1ff; border-left:3px solid var(--vw-blue); border-radius:4px; font-size:12px">

          </div>`;

    }
    // Rotación del modelo (los comparativos del Baratito) — solo admin. Los datos
    // vienen de la Edge (rotacionData, mismo snapshot del Motor que los precios):
    // vendidos últimos 4 meses COMPLETOS, meses de stock (stock/(vend4/4)) y días
    // en venderse (promedio real últimos 12 meses). Mismos criterios y colores que
    // el panel Baratito de precios.
    let rotacionHtml = '';

      const rot = ncRot ? rotacionData[ncRot] : null;
      if (rot) {
        const MES_ABR = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
        const mesesKeys = [];
        const _hoy = new Date();
        for (let k = 4; k >= 1; k--) {
          const x = new Date(_hoy.getFullYear(), _hoy.getMonth() - k, 1);

        const vpm = rot.ventasPorMes || {};

        ).join('');

        else {

                 <div style="margin-top:4px; text-align:center"><strong>${vend4}</strong> <span class="muted">total</span></div>`)}
              ${caja('Meses de stock',
                `<div style="font-size:18px; font-weight:700; color:${mesesColor}">${mesesTxt}</div>

              ${caja('Días en venderse',

            </div>
          </div>`;

    const repartoBadge = it.es_reparto

      : '';
    // Solo para items viejos de reparto (sin chasis). Los nuevos si traen chasis:
    // la unidad de reparto se elige con serie y color, igual que una de stock.
    const noChasisMsg = (it.es_reparto && !(it.chasis || []).length)
      ? `<div class="muted" style="font-size:12px; padding:6px 0">Sin chasis en stock libre — la unidad viene en reparto.</div>`
      : '';
    // El analisis se calcula igual para reparto y stock (oferta_vigente y gcia salen de cualquier
    // chasis del modelo en stockData, precio_lista override de bt para reparto).
    const analisisHtml = `
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:10px; font-size:13px">
        <div><span class="muted">Precio pedido:</span> <strong>${fmtMoney(it.precio_pedido)}</strong></div>
        <div><span class="muted">Oferta vigente:</span> <strong>${fmtMoney(it.oferta_vigente_min)}</strong></div>
        <div><span class="muted">Dto extra pedido:</span> <strong>${fmtPct(it.dto_extra_pedido)}</strong></div>
        ${showGcia ? `<div><span class="muted">Gcia resultante:</span> <strong style="color:${(it.gcia_resultante||0) >= 0 ? 'var(--green)' : 'var(--red)'}">${fmtPct(it.gcia_resultante)}</strong></div>` : ''}
      </div>`;
    // Últimos precios autorizados de ESTE modelo (solo admin). Referencia para decidir:
    // recorre todas las consultas ya resueltas del mismo modelo y toma el precio que se
    // autorizó en cada una — aceptada → precio_pedido; rechazada/contraoferta → precio_max_admin.
    // El margen se recalcula EN VIVO al precio autorizado con la ganancia real de hoy
    // (analisisAdminVivo), porque la gcia guardada en el item la calculó el vendedor con la
    // ganancia blindada (0) y no sirve. Ordenados por fecha de respuesta, los 3 más recientes.
    let historialHtml = '';
    if (showGcia) {
      const canonCur = resolveModeloCanonico(it.modelo) || it.modelo;
      const autorizados = [];
      (adminConsultas || []).forEach(oc => {
        if (oc.id === c.id) return; // no incluir la consulta abierta
        if (!['aceptada', 'rechazada', 'contraoferta'].includes(oc.estado)) return;
        (oc.items || []).forEach(oit => {
          const canonH = resolveModeloCanonico(oit.modelo) || oit.modelo;
          if (canonH !== canonCur) return;
          const precioAut = oc.estado === 'aceptada' ? oit.precio_pedido : oc.precio_max_admin;
          if (!precioAut) return;
          autorizados.push({ precio: precioAut, fecha: oc.admin_respuesta_at || oc.created_at, estado: oc.estado });
        });
      });
      autorizados.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
      const ultimos3 = autorizados.slice(0, 3);
      if (ultimos3.length) {
        const ESTADO_LBL = { aceptada: 'Aceptada', rechazada: 'Mejor precio', contraoferta: 'Contraoferta' };
        const ESTADO_BG = { aceptada: '#dcfce7;color:#166534', rechazada: '#fee2e2;color:#991b1b', contraoferta: '#fef3c7;color:#92400e' };
        const filas = ultimos3.map(h => {
          const aut = analisisAdminVivo({ modelo: it.modelo, precio_pedido: h.precio, chasis: [] });
          const margen = aut ? aut.gcia_resultante : null;
          const mColor = margen == null ? 'var(--vw-grey-3)' : (margen >= 0 ? 'var(--green)' : 'var(--red)');
          return `<div style="display:grid; grid-template-columns:auto 1fr auto; gap:10px; padding:6px 6px; border-bottom:1px dashed var(--vw-grey-2); font-size:12px; align-items:center">
              <span class="muted" style="font-size:11px; white-space:nowrap">${fmtDate(h.fecha)}</span>
              <span><strong>${fmtMoney(h.precio)}</strong> <span style="background:${ESTADO_BG[h.estado] || '#e5e7eb;color:#374151'}; padding:1px 6px; border-radius:6px; font-size:10px; font-weight:700">${ESTADO_LBL[h.estado] || h.estado}</span></span>
              <span style="color:${mColor}; font-weight:700; text-align:right; white-space:nowrap">${margen == null ? '—' : fmtPct(margen)}</span>
            </div>`;
        }).join('');
        historialHtml = `
          <div style="margin-top:12px; padding-top:10px; border-top:1px solid var(--vw-grey-2)">
            <div style="font-size:13px; margin-bottom:6px">
              <strong>🧾 Últimos precios autorizados</strong>
              <span class="muted" style="font-size:11px">(margen recalculado con la ganancia de hoy)</span>
            </div>
            ${filas}
          </div>`;
      }
    }
    return `
      <div class="card" style="background:var(--vw-grey-1)">
        <h3 style="font-size:14px; margin-bottom:8px">Unidad ${i + 1}: ${escapeHtml(it.modelo)}${repartoBadge}</h3>
        ${chasis}
        ${noChasisMsg}
        ${ventasMesHtml}
        ${analisisHtml}
        ${historialHtml}
        ${competenciaHtml}
        ${rotacionHtml}
        ${stockHtml}
        ${repartoStockHtml}
      </div>
    `;
  }).join('');

  let financiaTxt = 'No financia';
  if (c.financia) {
    const ent = c.financia_entidad === 'otros' ? (c.financia_entidad_otro || 'otros') : (c.financia_entidad || '');
    financiaTxt = `Sí · ${ent.toUpperCase()} · ${fmtMoney(c.financia_monto)}` + (showGcia && c.financia_pct ? ` (${(c.financia_pct*100).toFixed(1)}%)` : '');
  }
  let vsOtroTxt = c.vs_otro_concesionario === 'si' ? `Sí — ${escapeHtml(c.concesionario_nombre)}: ${fmtMoney(c.concesionario_precio)}`
    : (c.vs_otro_concesionario === 'no_quiere_pasar' ? 'No quiere pasar el concesionario' : 'No');
  let fuenteTxt = c.fuente_dato === 'otro' ? (c.fuente_dato_otro || 'otro') : (c.fuente_dato || '—');

  const isAdmin = currentMode === 'admin';
  const isPending = c.estado === 'pendiente';
  const showEditForm = isAdmin && (isPending || editMode);
  const btnEliminar = (isAdmin && _esSuperadmin())
    ? `<button onclick="eliminarConsulta(${c.id})" style="background:#991B1B; color:#fff; padding:10px 14px; border-radius:8px; border:none; font-weight:600; cursor:pointer">🗑 Eliminar</button>`
    : '';
  let footerHtml = `${btnEliminar}<button class="btn-secondary" onclick="closeModal()">Cerrar</button>`;
  if (showEditForm) {
    let defaultVal = '';
    let defaultObs = '';
    if (editMode) {
      defaultVal = c.precio_max_admin ? '$' + Math.round(c.precio_max_admin).toLocaleString('es-AR') : '';
      defaultObs = c.observaciones_admin || '';
    } else {
      // Pre-llenar con la oferta vigente actual de la primera unidad para que solo
      // tenga que ajustarla (en vez de tipear desde cero). Si por algun motivo no hay
      // oferta vigente (reparto sin registros en stockData), caemos al precio pedido.
      const first = (c.items && c.items[0]) || null;
      const defaultPrecio = first
        ? (first.oferta_vigente_min || first.precio_pedido)
        : null;
      defaultVal = defaultPrecio ? '$' + Math.round(defaultPrecio).toLocaleString('es-AR') : '';
    }
    const cancelBtn = editMode
      ? `<button class="btn-secondary" onclick="abrirDetalle(${c.id}, false)">Cancelar</button>`
      : `<button class="btn-secondary" onclick="closeModal()">Cancelar</button>`;
    const editBanner = editMode
      ? `<div style="background:#fff3cd; border:1px solid #f59e0b; border-radius:8px; padding:8px 12px; font-size:13px; color:#7c2d12">✏️ Editando respuesta — al guardar se reenviará el WhatsApp al vendedor.</div>`
      : '';
    footerHtml = `
      <div style="display:flex; flex-direction:column; gap:10px; width:100%">
        ${editBanner}
        <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start">
          <div style="flex:1; min-width:240px">
            <label style="display:block; font-size:12px; color:var(--vw-grey-4); margin-bottom:4px">Mejor precio máximo (con FyF)</label>
            <input id="adminPrecioMax" type="text" inputmode="numeric" placeholder="$0"
              value="${defaultVal}"
              oninput="onAdminPrecioMaxInput(${c.id}, this)"
              style="width:100%; padding:14px; border:2px solid var(--vw-grey-2); border-radius:8px; font-size:20px; font-weight:600; letter-spacing:0.5px">
            <div id="adminPrecioMaxWords" style="font-size:13px; color:var(--vw-grey-4); margin-top:6px; min-height:18px; font-style:italic"></div>
            <div id="adminPrecioMaxHint" class="field-hint"></div>
          </div>
          <div style="flex:2; min-width:240px">
            <!-- Comentario COLAPSADO por defecto (pedido de Fer 3-jul: en el celu el
                 textarea fijo achicaba el área scrolleable del detalle). Si se está
                 editando una respuesta que YA tiene comentario, arranca abierto.
                 El textarea queda siempre en el DOM (display:none) porque
                 aceptar/rechazar/contraofertar leen #adminObs.value. -->
            <button id="adminObsToggle" type="button" onclick="toggleAdminObs()"
              style="display:${(defaultObs || '').trim() ? 'none' : 'inline-block'}; background:none; border:1px dashed var(--vw-grey-2); border-radius:8px; padding:8px 12px; font-size:13px; color:var(--vw-grey-4); cursor:pointer">💬 Comentario (opcional)</button>
            <div id="adminObsWrap" style="display:${(defaultObs || '').trim() ? 'block' : 'none'}">
              <label style="display:block; font-size:12px; color:var(--vw-grey-4); margin-bottom:4px">Comentario (opcional)
                <a onclick="toggleAdminObs()" style="cursor:pointer; margin-left:6px; font-size:11px; color:var(--vw-blue)">ocultar</a>
              </label>
              <textarea id="adminObs" rows="3" placeholder="Ej: Acepto el precio pero con la unidad gris más vieja del stock"
                style="width:100%; padding:10px; border:2px solid var(--vw-grey-2); border-radius:8px; font-size:14px; font-family:inherit; resize:vertical">${escapeHtml(defaultObs)}</textarea>
            </div>
          </div>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:space-between; align-items:center">
          ${_esSuperadmin() ? `<button onclick="eliminarConsulta(${c.id})" style="background:#991B1B; color:#fff; padding:10px 14px; border-radius:8px; border:none; font-weight:600; cursor:pointer">🗑 Eliminar</button>` : '<div></div>'}
          <div style="display:flex; gap:8px; flex-wrap:wrap">
            ${cancelBtn}
            <button class="btn-danger" onclick="rechazarMejora(${c.id})">No acepto</button>
            <button onclick="contraofertarMejora(${c.id})" style="background:#3730a3; color:#fff; padding:10px 18px; border-radius:8px; border:none; font-weight:600; cursor:pointer">Contraofertar</button>
            <button class="btn-success" onclick="aceptarMejora(${c.id})">Aceptar mejora</button>
          </div>
        </div>
      </div>
    `;
  }

  cont.innerHTML = `
    <div class="modal-header">
      <h2>#${c.id} — ${escapeHtml(cliente)}</h2>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="detalle-section">
        <h4>Vendedor</h4>
        <div class="kv"><span class="k">Nombre</span><span class="v">${escapeHtml(c.vendedor_nombre || c.vendedor_usuario || '')}</span></div>
        ${c.cargada_por_nombre ? `<div class="kv"><span class="k">Cargada por</span><span class="v">${escapeHtml(c.cargada_por_nombre)}</span></div>` : ''}
        <div class="kv"><span class="k">Fecha</span><span class="v">${fmtDate(c.created_at)}</span></div>
        <div class="kv"><span class="k">Estado</span><span class="v"><span class="estado ${c.estado}">${c.estado}</span></span></div>
      </div>
      <div class="detalle-section">
        <h4>Cliente</h4>
        <div class="kv">
          <span class="k">Tipo</span><span class="v">${c.tipo_cliente === 'particular' ? 'Particular' : 'Reventa'}</span>
          ${c.tipo_cliente === 'particular' ? `
            <span class="k">Nombre</span><span class="v">${escapeHtml((c.cliente_nombre||'') + ' ' + (c.cliente_apellido||''))}</span>
            <span class="k">Fuente dato</span><span class="v">${escapeHtml(fuenteTxt)}</span>
            <span class="k">Tiene usado</span><span class="v">${c.tiene_usado ? 'Sí' : 'No'}</span>
          ` : `
            <span class="k">Reventa</span><span class="v">${escapeHtml(c.reventa_nombre || '')}</span>
          `}
          <span class="k">Provincia</span><span class="v">${escapeHtml(c.provincia || '')}</span>
          <span class="k">Localidad</span><span class="v">${escapeHtml(c.localidad || '')}</span>
          <span class="k">Financiación</span><span class="v">${financiaTxt}</span>
          <span class="k">VS otro presupuesto</span><span class="v">${vsOtroTxt}</span>
        </div>
      </div>
      <div class="detalle-section">
        <h4>Unidades</h4>
        ${itemsHtml || '<div class="muted">—</div>'}
      </div>
      ${(c.observaciones_vendedor || '').trim() ? `
        <div class="detalle-section">
          <h4>Observaciones del vendedor</h4>
          <div style="white-space:pre-wrap; padding:4px 0">${escapeHtml(c.observaciones_vendedor)}</div>
        </div>
      ` : ''}
      ${(!isPending && !editMode && (isAdmin || c.precio_max_admin || c.observaciones_admin)) ? `
        <div class="detalle-section">
          <h4>Respuesta</h4>
          <div class="kv">
            <span class="k">Estado</span><span class="v"><span class="estado ${c.estado}">${c.estado}</span></span>
            ${c.precio_max_admin ? `<span class="k">Mejor precio máx</span><span class="v">${fmtMoney(c.precio_max_admin)}</span>` : ''}
            ${c.admin_respuesta_at ? `<span class="k">Respondido</span><span class="v">${fmtDate(c.admin_respuesta_at)}</span>` : ''}
          </div>
          ${(c.observaciones_admin || '').trim() ? `
            <div style="margin-top:10px">
              <div style="font-size:12px; color:var(--vw-grey-4); margin-bottom:4px">Comentario del administrador</div>
              <div style="white-space:pre-wrap; padding:8px; background:var(--vw-grey-1); border-radius:6px">${escapeHtml(c.observaciones_admin)}</div>
            </div>
          ` : ''}
          ${isAdmin ? `
            <div style="margin-top:12px; display:flex; justify-content:flex-end">
              <button onclick="abrirDetalle(${c.id}, true)" class="btn-secondary" style="font-size:13px; padding:8px 14px">✏️ Editar respuesta</button>
            </div>
          ` : ''}
        </div>
      ` : ''}
      ${renderResultadoVentaSection(c)}
    </div>
    <div class="modal-footer">${footerHtml}</div>
  `;
  overlay.classList.remove('hidden');
  // Si admin tiene una pendiente con precio pre-llenado, calcular el hint inicial.
  // Tambien aplica al modo edicion (admin reabriendo una resuelta para modificarla).
  if (showEditForm) {
    setTimeout(() => {
      const el = document.getElementById('adminPrecioMax');
      if (el && el.value) onAdminPrecioMaxInput(c.id, el);
    }, 0);
  }
}
function closeModal() { document.getElementById('modalOverlay').classList.add('hidden'); }

// Muestra/oculta el textarea de comentario del admin (colapsado por defecto para
// ganar espacio vertical en el celular). El contenido nunca se pierde: solo se
// togglea el display; #adminObs sigue en el DOM y las acciones leen su value.
function toggleAdminObs() {
  const wrap = document.getElementById('adminObsWrap');
  const btn = document.getElementById('adminObsToggle');
  if (!wrap || !btn) return;
  const abrir = wrap.style.display === 'none';
  wrap.style.display = abrir ? 'block' : 'none';
  btn.style.display = abrir ? 'none' : 'inline-block';
  if (abrir) { const ta = document.getElementById('adminObs'); if (ta) ta.focus(); }
}

function onAdminPrecioMaxInput(consultaId, el) {
  const raw = el.value.replace(/[^\d]/g, '');
  el.value = raw ? '$' + parseInt(raw, 10).toLocaleString('es-AR') : '';
  const wordsDiv = document.getElementById('adminPrecioMaxWords');
  if (wordsDiv) {
    const t = numToTextES(raw ? parseInt(raw, 10) : 0);
    wordsDiv.textContent = t ? `≈ ${t}` : '';
  }
  const hint = document.getElementById('adminPrecioMaxHint');
  const c = adminConsultas.find(x => x.id === consultaId);
  if (!c || !c.items || c.items.length === 0) { hint.textContent = ''; return; }
  if (!raw) { hint.textContent = ''; return; }
  const precio = parseInt(raw, 10);
  const it = c.items[0];
  // Gcia/oferta de HOY (no la guardada por el vendedor con ganancia blindada). Ver analisisAdminVivo.
  const aLive = analisisAdminVivo(it);
  const oferta_vigente = aLive ? aLive.oferta_vigente_min : it.oferta_vigente_min;
  const precio_lista = (aLive && aLive.precio_lista) ? aLive.precio_lista : it.precio_lista;
  const gcia_vigente = aLive ? aLive.gcia_vigente_min : it.gcia_vigente_min;
  if (!precio_lista || precio_lista <= 0) { hint.textContent = ''; return; }
  const dto = (oferta_vigente - precio) / precio_lista;
  const gcia = (gcia_vigente || 0) - dto;
  hint.innerHTML = `Con ${fmtMoney(precio)}: dto extra ${fmtPct(dto)} · <strong style="color:${gcia>=0?'var(--green)':'var(--red)'}">gcia ${fmtPct(gcia)}</strong>`;
}

// ---------- Resultado de venta (lo marca el vendedor) ----------
function renderResultadoVentaSection(c) {
  const esVendedor = currentMode === 'vendedor' || currentMode === 'gerente';
  const yaCargado = !!c.resultado_venta;
  // No mostrar nada cuando todavia esta pendiente y nadie cargo resultado.
  // Si ya hay resultado cargado, mostrarlo siempre (vendedor y admin).
  if (!yaCargado && !esVendedor) return '';
  if (!yaCargado && c.estado === 'pendiente') return ''; // todavia no respondida, no tiene sentido cargar venta

  if (yaCargado) {
    const esVendida = c.resultado_venta === 'vendida';
    const badge = esVendida
      ? `<span style="background:#d1fae5; color:#065f46; padding:4px 10px; border-radius:20px; font-size:12px; font-weight:600">✓ VENDIDA</span>`
      : `<span style="background:#fee2e2; color:#991b1b; padding:4px 10px; border-radius:20px; font-size:12px; font-weight:600">✗ NO VENDIDA</span>`;
    return `
      <div class="detalle-section">
        <h4>Resultado de venta</h4>
        <div class="kv">
          <span class="k">Resultado</span><span class="v">${badge}</span>
          ${c.resultado_venta_at ? `<span class="k">Cargado</span><span class="v">${fmtDate(c.resultado_venta_at)}</span>` : ''}
        </div>
        ${(c.motivo_no_venta || '').trim() ? `
          <div style="margin-top:10px">
            <div style="font-size:12px; color:var(--vw-grey-4); margin-bottom:4px">Motivo</div>
            <div style="white-space:pre-wrap; padding:8px; background:var(--vw-grey-1); border-radius:6px">${escapeHtml(c.motivo_no_venta)}</div>
          </div>
        ` : ''}
      </div>
    `;
  }
  // Vendedor con consulta respondida y sin resultado todavia: mostrar botones
  return `
    <div class="detalle-section">
      <h4>Resultado de venta</h4>
      <p style="font-size:13px; color:var(--vw-grey-4); margin-bottom:10px">¿Cómo terminó esta consulta con el cliente?</p>
      <div id="resultadoVentaActions" style="display:flex; gap:8px; flex-wrap:wrap">
        <button onclick="marcarVendida(${c.id})" style="background:#16a34a; color:#fff; padding:10px 18px; border-radius:8px; border:none; font-weight:600; cursor:pointer">✓ Sí, se vendió</button>
        <button onclick="mostrarMotivoNoVenta(${c.id})" style="background:#dc2626; color:#fff; padding:10px 18px; border-radius:8px; border:none; font-weight:600; cursor:pointer">✗ No se vendió</button>
      </div>
      <div id="resultadoVentaMotivo" class="hidden" style="margin-top:12px">
        <label style="display:block; font-size:12px; color:var(--vw-grey-4); margin-bottom:4px">Motivo (obligatorio)</label>
        <textarea id="motivoNoVentaTxt" rows="3" placeholder="Ej: el cliente decidió comprar otra marca, no le alcanzaba el descuento, se cayó la financiación..."
          style="width:100%; padding:10px; border:2px solid var(--vw-grey-2); border-radius:8px; font-size:14px; font-family:inherit; resize:vertical"></textarea>
        <div style="display:flex; gap:8px; margin-top:8px; justify-content:flex-end">
          <button onclick="ocultarMotivoNoVenta()" class="btn-secondary">Cancelar</button>
          <button onclick="marcarNoVendida(${c.id})" style="background:#dc2626; color:#fff; padding:10px 18px; border-radius:8px; border:none; font-weight:600; cursor:pointer">Guardar motivo</button>
        </div>
      </div>
    </div>
  `;
}
function mostrarMotivoNoVenta() {
  document.getElementById('resultadoVentaActions').classList.add('hidden');
  document.getElementById('resultadoVentaMotivo').classList.remove('hidden');
  document.getElementById('motivoNoVentaTxt').focus();
}
function ocultarMotivoNoVenta() {
  document.getElementById('resultadoVentaActions').classList.remove('hidden');
  document.getElementById('resultadoVentaMotivo').classList.add('hidden');
}
async function marcarVendida(consultaId) {
  if (!confirm('¿Confirmar que esta consulta terminó en venta?')) return;
  showLoading('Guardando...');
  try {
    await sbFetch(`consultas_0km?id=eq.${consultaId}`, {
      method: 'PATCH',
      body: JSON.stringify({
        resultado_venta: 'vendida',
        motivo_no_venta: null,
        resultado_venta_at: new Date().toISOString()
      })
    });
    closeModal();
    await cargarMisConsultas();
    hideLoading();
    showToast('Marcada como vendida');
  } catch(e) { hideLoading(); console.error(e); alert('Error: ' + (e.message || e)); }
}
async function marcarNoVendida(consultaId) {
  const motivo = (document.getElementById('motivoNoVentaTxt').value || '').trim();
  if (!motivo) { alert('Cargá el motivo por el que no se vendió'); return; }
  showLoading('Guardando...');
  try {
    await sbFetch(`consultas_0km?id=eq.${consultaId}`, {
      method: 'PATCH',
      body: JSON.stringify({
        resultado_venta: 'no_vendida',
        motivo_no_venta: motivo,
        resultado_venta_at: new Date().toISOString()
      })
    });
    closeModal();
    await cargarMisConsultas();
    hideLoading();
    showToast('Marcada como no vendida');
  } catch(e) { hideLoading(); console.error(e); alert('Error: ' + (e.message || e)); }
}

function getAdminObs() {
  const el = document.getElementById('adminObs');
  return el ? (el.value || '').trim() : '';
}
function getAdminPrecioMax() {
  const el = document.getElementById('adminPrecioMax');
  if (!el) return null;
  const raw = (el.value || '').replace(/[^\d]/g, '');
  return raw ? parseInt(raw, 10) : null;
}

async function aceptarMejora(consultaId) {
  if (!confirm('¿Aceptar la mejora pedida?')) return;
  showLoading('Guardando...');
  try {
    const obs = getAdminObs();
    await sbFetch(`consultas_0km?id=eq.${consultaId}`, {
      method: 'PATCH',
      body: JSON.stringify({
        estado: 'aceptada',
        admin_user_id: currentUser.id,
        admin_respuesta_at: new Date().toISOString(),
        precio_max_admin: null,
        observaciones_admin: obs || null
      })
    });
    notifyVendedorRespuesta(consultaId).catch(e => console.error(e));
    closeModal();
    await cargarConsultasAdmin();
    hideLoading();
    showToast('Mejora aceptada');

// ============ ADMIN USUARIOS ============
async function cargarUsuarios() {
  const cont = document.getElementById('adminUsuariosList');
  cont.innerHTML = '<div class="empty">Cargando...</div>';
  try {
    const data = await sbFetch('tasador_usuarios?select=id,usuario,nombre,email,telefono_wa,callmebot_key,roles,rol,activo,debe_cambiar_clave&order=usuario.asc');
    usuariosList = data || [];
    renderUsuariosList();
  } catch(e) {
    console.error(e);
    cont.innerHTML = '<div class="empty"><p>Error al cargar usuarios</p></div>';
  }
}

function renderUsuariosList() {
  const cont = document.getElementById('adminUsuariosList');
  const q = (document.getElementById('uSearch').value || '').toLowerCase().trim();
  let list = usuariosList;
  if (q) list = list.filter(u =>
    (u.usuario || '').toLowerCase().includes(q) ||
    (u.nombre || '').toLowerCase().includes(q) ||
    (u.email || '').toLowerCase().includes(q)
  );
  if (list.length === 0) {
    cont.innerHTML = '<div class="empty"><p>Sin usuarios.</p></div>';
    return;
  }
  // Mostrar el "+ Nuevo usuario" solo a superadmin
  const btnNuevo = document.getElementById('btnNuevoUsuario');
  if (btnNuevo) btnNuevo.classList.toggle('hidden', !_esSuperadmin());
  const esSuperadmin = _esSuperadmin();
  cont.innerHTML = list.map(u => {
    const roles = Array.isArray(u.roles) ? u.roles : (u.rol ? [u.rol] : []);
    const rolesTxt = roles.length > 0 ? roles.join(', ') : '—';
    const activoCls = u.activo === false ? 'rechazada' : 'aceptada';
    const activoTxt = u.activo === false ? 'Inactivo' : 'Activo';
    const tieneWA = u.telefono_wa ? '✓' : '✗';

    const botonesSuperadmin = esSuperadmin ? `
      <button class="btn-secondary" style="font-size:12px; padding:8px 12px" onclick="abrirEditarUsuario('${u.id}')">Editar</button>
      <button class="btn-primary" style="font-size:12px; padding:8px 12px" onclick="entrarComoUsuario('${u.id}')">Entrar como</button>
      <button class="btn-secondary" style="font-size:12px; padding:8px 12px" onclick="toggleActivoUsuario('${u.id}', ${u.activo === false})">${u.activo === false ? 'Activar' : 'Desactivar'}</button>
    ` : '';
    return `
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap">
          <div style="flex:1; min-width:220px">
            <h3 style="font-size:15px; margin-bottom:4px">${escapeHtml(u.nombre || '—')} <span class="muted" style="font-weight:400">@${escapeHtml(u.usuario || '')}</span></h3>
            <div style="font-size:13px; color:var(--vw-grey-4); margin-top:4px">
              ${rolesTxt} · <span class="estado ${activoCls}" style="font-size:11px">${activoTxt}</span>
              ${u.debe_cambiar_clave ? ' · <span class="tag-badge lim">debe cambiar clave</span>' : ''}
            </div>
            <div style="font-size:12px; color:var(--vw-grey-3); margin-top:4px">
              📱 ${u.telefono_wa || '—'} · WhatsApp ${tieneWA}
            </div>
          </div>
          <div style="display:flex; gap:6px; flex-wrap:wrap">
            ${esSuperadmin ? `<button class="btn-secondary" style="font-size:12px; padding:8px 12px" onclick="abrirEditarUsuario('${u.id}')">Editar</button>` : ''}
            <button class="btn-secondary" style="font-size:12px; padding:8px 12px" onclick="resetClaveUsuario('${u.id}')">Reset clave</button>
            ${esSuperadmin ? `<button class="btn-primary" style="font-size:12px; padding:8px 12px" onclick="entrarComoUsuario('${u.id}')">Entrar como</button>` : ''}
            ${esSuperadmin ? `<button class="btn-secondary" style="font-size:12px; padding:8px 12px" onclick="toggleActivoUsuario('${u.id}', ${u.activo === false})">${u.activo === false ? 'Activar' : 'Desactivar'}</button>` : ''}

        </div>

      ` : ''}

function generarClaveProvisoria() {
  const chars = 'abcdefghijkmnpqrstuvwxyz23456789';
  let p = '';
  for (let i = 0; i < 8; i++) p += chars[Math.floor(Math.random() * chars.length)];
  return p;
}

async function guardarUsuario(id) {
  if (!_esSuperadmin()) { showToast('No autorizado'); return; }
  const usuario = (document.getElementById('uUsuario').value || '').trim().toLowerCase();
  const nombre = (document.getElementById('uNombre').value || '').trim();
  const email = (document.getElementById('uEmail').value || '').trim();
  const telefono_wa = (document.getElementById('uTelefono').value || '').trim();
  const callmebot_key = (document.getElementById('uCallmebot').value || '').trim() || null;
  const activo = document.getElementById('uActivo').checked;
  const roles = [];
  if (document.getElementById('uRolVendedor').checked) roles.push('vendedor');
  if (document.getElementById('uRolGerente').checked) roles.push('gerente');
  if (document.getElementById('uRolAdmin').checked) roles.push('admin');
  if (!usuario) { alert('Falta usuario'); return; }
  if (!nombre) { alert('Falta nombre'); return; }
  if (roles.length === 0) { alert('Asigná al menos un rol'); return; }

  const isNew = !id;
  const body = {
    usuario, nombre, email: email || null, telefono_wa: telefono_wa || null, callmebot_key,
    roles, rol: roles[0], activo
  };

  try {
    showLoading('Guardando...');
    if (isNew) {
      const clave = (document.getElementById('uClave').value || '').trim() || generarClaveProvisoria();
      body.clave = clave;
      body.debe_cambiar_clave = true;
      await sbFetch('tasador_usuarios', { method: 'POST', body: JSON.stringify(body) });
      hideLoading();
      closeModal();
      showToast('Usuario creado. Clave: ' + clave);
      alert(`Usuario creado.\n\nClave provisoria: ${clave}\n\nPasásela al usuario; al primer login va a tener que cambiarla.`);
    } else {
      await sbFetch(`tasador_usuarios?id=eq.${id}`, { method: 'PATCH', body: JSON.stringify(body) });
      hideLoading();
      closeModal();
      showToast('Usuario actualizado');
    }
    cargarUsuarios();
  } catch(e) {
    hideLoading();
    console.error(e);
    alert('Error al guardar: ' + (e.message || e));
  }
}

async function resetClaveUsuario(id) {
  if (!_puedeResetClaves()) { showToast('No autorizado'); return; }
  const u = usuariosList.find(x => x.id === id);
  if (!u) return;
  if (!confirm(`¿Resetear la clave de ${u.usuario}? Se va a generar una clave nueva y al loguearse va a tener que cambiarla.`)) return;
  const clave = generarClaveProvisoria();
  try {
    showLoading('Reseteando...');
    await sbFetch(`tasador_usuarios?id=eq.${id}`, {
      method: 'PATCH',
      body: JSON.stringify({ clave, debe_cambiar_clave: true })
    });
    hideLoading();
    mostrarClaveProvisoria(u.usuario, clave);
    cargarUsuarios();
  } catch(e) {
    hideLoading();
    console.error(e);
    alert('Error: ' + (e.message || e));
  }
}

function mostrarClaveProvisoria(usuario, clave) {
  // Modal custom (no alert nativo) para que la clave se pueda copiar facil
  const html = `
    <div id="claveProvOverlay" style="position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:10000; padding:20px">
      <div style="background:#fff; border-radius:12px; padding:24px; max-width:420px; width:100%; box-shadow:0 10px 40px rgba(0,0,0,0.3)">
        <h3 style="margin-bottom:8px; color:var(--vw-blue)">Clave reseteada para <strong>${escapeHtml(usuario)}</strong></h3>
        <p style="font-size:13px; color:var(--vw-grey-4); margin-bottom:14px">Pasásela al usuario. Al loguearse va a tener que cambiarla.</p>
        <div style="display:flex; gap:8px; align-items:stretch; margin-bottom:14px">
          <input id="claveProvInput" type="text" readonly value="${escapeHtml(clave)}"
            onclick="this.select()"
            style="flex:1; padding:12px; border:2px solid var(--vw-grey-2); border-radius:8px; font-family:var(--mono,monospace); font-size:16px; font-weight:700; letter-spacing:1px; background:var(--vw-grey-1); color:var(--vw-blue)">
          <button onclick="copiarClaveProv()" id="claveProvCopyBtn"
            style="background:var(--vw-blue); color:#fff; padding:0 16px; border:none; border-radius:8px; font-weight:600; cursor:pointer; white-space:nowrap">📋 Copiar</button>
        </div>
        <div style="display:flex; justify-content:flex-end">
          <button onclick="cerrarClaveProv()" class="btn-secondary">Cerrar</button>
        </div>
      </div>
    </div>
  `;
  const wrap = document.createElement('div');
  wrap.innerHTML = html;
  document.body.appendChild(wrap.firstElementChild);
  setTimeout(() => document.getElementById('claveProvInput').select(), 50);
}
async function copiarClaveProv() {
  const input = document.getElementById('claveProvInput');
  const btn = document.getElementById('claveProvCopyBtn');
  if (!input) return;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(input.value);
    } else {
      input.select();
      document.execCommand('copy');
    }
    if (btn) {
      const orig = btn.innerHTML;
      btn.innerHTML = '✓ Copiada';
      btn.style.background = 'var(--green, #16a34a)';
      setTimeout(() => { btn.innerHTML = orig; btn.style.background = 'var(--vw-blue)'; }, 1500);
    }
  } catch(e) {
    console.error(e);
    alert('No se pudo copiar automáticamente. Seleccioná y copiá a mano.');
  }
}
function cerrarClaveProv() {
  const o = document.getElementById('claveProvOverlay');
  if (o) o.remove();
}

async function entrarComoUsuario(id) {
  if (!_esSuperadmin()) { showToast('No autorizado'); return; }
  const u = usuariosList.find(x => x.id === id);
  if (!u) return;
  if (u.id === currentUser.id) { showToast('Ya sos vos'); return; }
  if (u.activo === false) { alert('Usuario inactivo. Activalo primero.'); return; }
  if (!confirm(`¿Entrar como ${u.nombre || u.usuario}? Vas a ver lo que ve el usuario.`)) return;

  // Guardamos el admin real (si es la primera impersonación)
  if (!realUser) realUser = currentUser;
  currentUser = { ...u };
  currentUser.rolesArr = (Array.isArray(u.roles) && u.roles.length > 0)
    ? u.roles
    : (u.rol ? [u.rol] : ['vendedor']);

  // Banner de impersonación
  document.getElementById('impersonateName').textContent = u.nombre || u.usuario;
  document.getElementById('impersonateBanner').classList.remove('hidden');

  closeModal();

  // Si tiene varios roles (ej: Daniel = vendedor + gerente), mostramos mode-select
  // así podés elegir desde qué rol probar. Si tiene uno solo, entra directo.
  const rolesValidos = currentUser.rolesArr.filter(r => ['vendedor', 'gerente', 'admin'].includes(r));
  if (rolesValidos.length > 1) {
    elegirModo();
  } else {
    entrarComo(rolesValidos[0] || 'vendedor');
  }
}

function volverAAdmin() {
  if (!realUser) return;
  currentUser = realUser;
  realUser = null;
  document.getElementById('impersonateBanner').classList.add('hidden');
  entrarComo('admin');
}

// ============ INIT ============
async function init() {
  const sess = cargarSesion();
  if (sess && sess.id) {
    showLoading('Restaurando sesión...');
    try {
      const data = await sbFetch(`tasador_usuarios?id=eq.${sess.id}&activo=eq.true`);
      if (data && data.length > 0) {
        currentUser = data[0];
        currentUser.rolesArr = (Array.isArray(currentUser.roles) && currentUser.roles.length > 0)
          ? currentUser.roles
          : (currentUser.rol ? [currentUser.rol] : ['vendedor']);
        document.getElementById('loginScreen').classList.add('hidden');
        await cargarStock();
        if (currentUser.rolesArr.includes('admin') && currentUser.rolesArr.length > 1 && !sess.mode) {
          hideLoading();
          elegirModo();
        } else {
          hideLoading();
          entrarComo(sess.mode || (currentUser.rolesArr.includes('admin') ? 'admin' : 'vendedor'));
        }
        return;
      }
    } catch(e) { console.error(e); }
    hideLoading();
    limpiarSesion();
  }
}
init();

<!-- ===== Banner de impersonacion cross-app (lee cookie tga_session compartida) ===== -->
<script>
(function tgaImpersonateBanner() {
  function getCk() {
    var m = document.cookie.match(/(?:^|;\s*)tga_session=([^;]+)/);
    if (!m) return null;
    try { return JSON.parse(decodeURIComponent(m[1])); } catch (e) { return null; }
  }
  function setCk(v) {
    var value = encodeURIComponent(JSON.stringify(v));
    var maxAge = 7 * 24 * 60 * 60;
    document.cookie = 'tga_session=' + value + '; path=/; domain=.titogonzalez.online; max-age=' + maxAge + '; Secure; SameSite=Lax';
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});
  }
  window.tgaVolverASesionOriginal = function() {
    var c = getCk();
    if (!c || !c._impersonatedBy) return;
    var orig = Object.assign({}, c._impersonatedBy);
    delete orig._impersonatedBy;
    setCk(orig);
    try { localStorage.removeItem('tasadorSession'); } catch (e) {}
    try { localStorage.removeItem('portal_tga_session'); } catch (e) {}
    try { sessionStorage.removeItem('vwfs_admin_user'); sessionStorage.removeItem('vwfs_admin_role'); } catch (e) {}
    location.reload();
  };
  function render() {
    var c = getCk();
    var banner = document.getElementById('tgaImpersonateBanner');
    if (!c || !c._impersonatedBy) {
      if (banner) { banner.remove(); document.body.style.paddingTop = ''; }
      return;
    }
    if (!banner) {
      banner = document.createElement('div');
      banner.id = 'tgaImpersonateBanner';
      banner.style.cssText = 'position:fixed; top:0; left:0; right:0; background:#9A3412; color:#fff; padding:8px 14px; font-size:13px; font-weight:600; z-index:99999; display:flex; justify-content:space-between; align-items:center; gap:12px; box-shadow:0 2px 6px rgba(0,0,0,0.2); flex-wrap:wrap; font-family:system-ui,sans-serif';
      document.body.appendChild(banner);
      document.body.style.paddingTop = '36px';
    }
    var cur = esc(c.usuario || '?');
    var curN = c.nombre ? ' (' + esc(c.nombre) + ')' : '';
    var origU = esc(c._impersonatedBy.usuario || '?');
    banner.innerHTML = '<span>👤 Estás viendo como <strong>' + cur + '</strong>' + curN + '</span>'
      + '<button onclick="tgaVolverASesionOriginal()" style="background:#fff; color:#9A3412; border:none; padding:5px 12px; border-radius:5px; cursor:pointer; font-weight:700; font-size:12px">← Volver a ' + origU + '</button>';
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', render);
  } else {
    render();
  }
})();
</script>
