    : '<span style="background:#dbeafe; color:#1e40af; padding:2px 7px; border-radius:8px; font-size:10px; font-weight:700">FÍSICO</span>';
}

// ---------- Analisis de margen (SOLO admin) ----------
// Definicion de margen de Fer: (venta - costo) / costo. Ej: costo 10M, venta 15M
// = 50%. Al lado se muestra el margen sobre la venta (33,3%), que es el contable.
// `arreglos` viene del analisis fisico del tasador y es informativo: se muestra
// como segunda linea, nunca pisa el numero principal (el costo de Oversoft).
function margenUsado(precio, costo) {
  if (!costo || costo <= 0 || !precio || precio <= 0) return null;
  return {
    pesos: precio - costo,
    sobreCosto: (precio - costo) / costo,
    sobreVenta: (precio - costo) / precio
  };
}

function colorMargen(m) {
  if (!m) return 'var(--vw-grey-4)';
  if (m.sobreCosto < 0) return 'var(--red)';
  if (m.sobreCosto < 0.10) return '#b45309';
  return 'var(--green)';
}

// Bloque de analisis del admin: la ganancia de hoy vs la ganancia con el precio
// pedido. Es LO UNICO que se analiza (pedido explicito de Fer: sin el resto).
function analisisUsadoHtml(c, precioPedido) {
  const u = getUsadoStock(c.usadoid);
  if (!usadosCostoOk) return '';
  if (!u) {
    return `<div style="background:#fee2e2; border-radius:8px; padding:10px 12px; font-size:13px; color:#991b1b; margin-top:10px">
      ⚠ La unidad ya no figura en el stock de usados (se vendió, se ocultó o quedó fuera de la ventana). No se puede calcular el margen actual.
    </div>`;
  }
  const costo = Number(u.costo_toma) || 0;
  const arreglos = Number(u.arreglos) || 0;
  const publicado = Number(u.precio_venta) || Number(c.precio_publicado) || 0;
  const pedido = Number(precioPedido) || Number(c.precio_pedido) || 0;

  if (!costo) {
    return `<div style="background:#fef3c7; border-radius:8px; padding:10px 12px; font-size:13px; color:#92400e; margin-top:10px">
      ⚠ Esta unidad <strong>no tiene costo de toma cargado en Oversoft</strong>, así que no se puede calcular la ganancia. Cargalo en el sistema y volvé a abrir.
    </div>`;
  }

  // Si una parte se cobra por transferencia, esa plata deja impuestos al entrar y al
  // salir: no la cobramos. El margen con el precio pedido se calcula sobre lo que entra
  // de verdad (pedido - costo de la transferencia); el publicado se compara sin tocar,
  // porque es el precio de vidriera y no tiene forma de pago asociada.
  const transferencia = Number(c.transferencia_monto) || 0;
  const costoTr = transferencia > 0 ? costoTransferencia(transferencia) : 0;
  const pedidoNeto = pedido - costoTr;
  const mAct = margenUsado(publicado, costo);
  const mPed = margenUsado(pedidoNeto, costo);
  const fila = (lbl, precio, m) => `
    <div style="display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:6px 0">
      <span style="font-size:13px; color:var(--vw-grey-4)">${lbl}</span>
      <span style="font-size:13px; text-align:right">
        <strong>${fmtMoney(precio)}</strong>
        ${m ? ` · <strong style="color:${colorMargen(m)}">${(m.sobreCosto*100).toFixed(1)}%</strong>
          <span style="color:var(--vw-grey-3); font-size:11px">(${fmtMoney(m.pesos)} · ${(m.sobreVenta*100).toFixed(1)}% s/venta)</span>` : ''}
      </span>
    </div>`;

  // Segunda lectura, solo si el tasador cargo arreglos: mismo margen pero
  // sumando el costo de los arreglos al costo de toma.
  let conArreglosHtml = '';
  if (arreglos > 0) {
    const costoTotal = costo + arreglos;
    const mPedArr = margenUsado(pedidoNeto, costoTotal);
    conArreglosHtml = `
      <div style="margin-top:8px; padding-top:8px; border-top:1px dashed var(--vw-grey-2)">
        <div style="font-size:11px; color:var(--vw-grey-3); margin-bottom:2px">
          Con arreglos del análisis físico (${fmtMoney(arreglos)}, dato del tasador) → costo ${fmtMoney(costoTotal)}
        </div>
        ${mPedArr ? `<div style="font-size:13px">Con el precio pedido quedaría en
          <strong style="color:${colorMargen(mPedArr)}">${(mPedArr.sobreCosto*100).toFixed(1)}%</strong>
          (${fmtMoney(mPedArr.pesos)})</div>` : ''}
      </div>`;
  }

  const caida = (mAct && mPed) ? (mAct.pesos - mPed.pesos) : null;

  return `
    <div style="background:#f0f9ff; border:1px solid #bae6fd; border-radius:8px; padding:12px; margin-top:10px">
      <div style="font-size:12px; font-weight:700; color:#0369a1; margin-bottom:6px">💰 GANANCIA</div>
      <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--vw-grey-4); padding-bottom:6px; border-bottom:1px solid #bae6fd">
        <span>Costo de toma (Oversoft)</span><strong>${fmtMoney(costo)}</strong>
      </div>
      ${fila('Precio publicado hoy', publicado, mAct)}
      ${fila(costoTr > 0 ? 'Con el precio pedido, ya neto' : 'Con el precio pedido', costoTr > 0 ? pedidoNeto : pedido, mPed)}
      ${costoTr > 0 ? `<div style="font-size:12px; color:#9a3412; padding:4px 0">
        💸 Pide <strong>${fmtMoney(transferencia)}</strong> por transferencia: se van
        <strong style="color:var(--red)">${fmtMoney(costoTr)}</strong> en impuestos
        <span class="muted">(${fmtPct(alicuotaTransferencia())})</span>, así que de ${fmtMoney(pedido)} entran ${fmtMoney(pedidoNeto)}.
      </div>` : ''}
      ${caida !== null ? `<div style="font-size:12px; color:var(--vw-grey-4); padding-top:6px; border-top:1px solid #bae6fd">
        Resigna <strong style="color:var(--red)">${fmtMoney(caida)}</strong> de ganancia</div>` : ''}
      ${conArreglosHtml}
    </div>`;
}

// ---------- Historial de la MISMA unidad ----------
// Pedido de Fer: "si antes pasé contraofertas por ese usado, que me figuren".
// A diferencia del 0km (que cruza por modelo), acá el cruce es por usadoid: es
// la misma unidad fisica, asi que lo que se autorizo antes es directamente
// comparable. Se listan todas las consultas ya respondidas de ese usado.
function historialUsadoHtml(c) {
  const previas = adminConsultasUsados
    .filter(x => Number(x.usadoid) === Number(c.usadoid) && x.id !== c.id)
    .filter(x => ['aceptada','rechazada','contraoferta'].includes(x.estado))
    .sort((a,b) => new Date(b.admin_respuesta_at || b.created_at) - new Date(a.admin_respuesta_at || a.created_at));
  if (previas.length === 0) return '';

  const ESTADO_LBL = { aceptada: 'Aceptada', rechazada: 'Mejor precio', contraoferta: 'Contraoferta' };
  const ESTADO_BG = { aceptada: '#dcfce7;color:#166534', rechazada: '#fee2e2;color:#991b1b', contraoferta: '#fef3c7;color:#92400e' };
  const u = getUsadoStock(c.usadoid);
  const costo = usadosCostoOk && u ? (Number(u.costo_toma) || 0) : 0;

  const filas = previas.map(p => {
    // El precio "autorizado": si la acepto, lo que pidio el vendedor; si no, el
    // precio que puso el admin (mejor precio o contraoferta).
    const precio = p.estado === 'aceptada' ? Number(p.precio_pedido) : Number(p.precio_max_admin);
    const m = costo && precio ? margenUsado(precio, costo) : null;
    return `
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--vw-grey-1); flex-wrap:wrap">
        <div style="font-size:12px; color:var(--vw-grey-4); min-width:120px">
          ${fmtFechaCorta(new Date(p.admin_respuesta_at || p.created_at))} ·
          ${escapeHtml(p.vendedor_nombre || p.vendedor_usuario || '—')}
          ${p.tipo_cliente ? `<span style="color:${p.tipo_cliente === 'reventa' ? '#5b21b6' : '#075985'}"> · ${p.tipo_cliente === 'reventa' ? '🏢 reventa' : '👤 particular'}</span>` : ''}
        </div>
        <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap">
          <span style="background:${ESTADO_BG[p.estado]}; padding:2px 8px; border-radius:10px; font-size:10px; font-weight:700">${ESTADO_LBL[p.estado]}</span>
          <strong style="font-size:13px">${precio ? fmtMoney(precio) : '—'}</strong>
          ${m ? `<span style="font-size:11px; color:${colorMargen(m)}">${(m.sobreCosto*100).toFixed(1)}%</span>` : ''}
          ${p.resultado_venta === 'vendida' ? '<span style="font-size:10px; color:#065f46">✓ vendida</span>' : ''}
          ${p.resultado_venta === 'no_vendida' ? '<span style="font-size:10px; color:#991b1b">✗ no vendida</span>' : ''}
        </div>
      </div>`;
  }).join('');

  return `
    <div style="background:var(--vw-grey-1); border-radius:8px; padding:12px; margin-top:10px">
      <div style="font-size:12px; font-weight:700; color:var(--vw-blue); margin-bottom:4px">
        🧾 YA PASARON POR ESTA UNIDAD (${previas.length})
      </div>
      <div style="font-size:11px; color:var(--vw-grey-3); margin-bottom:6px">
        Consultas anteriores del <strong>mismo usado</strong>${costo ? '. El % es el margen recalculado con el costo de hoy.' : '.'}
      </div>
      ${filas}
    </div>`;
}

  };

  const cards = orden.map(u => {

    ].join(' · ');
    return `
      <div onclick="${sinPrecio ? '' : `selectUsadoUnidad(${u.usadoid})`}"

               border-radius:10px; padding:12px; margin-bottom:8px; cursor:${sinPrecio ? 'not-allowed' : 'pointer'}; opacity:${sinPrecio ? 0.55 : 1}">
        <div style="display:flex; justify-content:space-between; gap:10px; align-items:flex-start; flex-wrap:wrap">

  return {
    body: `
      <h2>¿Sobre qué usado querés pedir precio?</h2>
      <p class="step-hint">Son los usados en venta hoy. Tocá la unidad.</p>
      ${cards}
      ${haySinPrecio ? '<p class="step-hint" style="margin-top:10px">Las unidades en gris todavía no tienen precio de venta cargado: no se puede pedir rebaja sobre un precio que no existe.</p>' : ''}
    `,
    footer: `
      <button class="btn-back" onclick="wizardBack()">Atrás</button>
      <button class="btn-next" id="btnNext" ${formUsado.usadoid ? '' : 'disabled'} onclick="nextStep()">Siguiente</button>

};

// El vendedor ve la rebaja que esta pidiendo, NUNCA la ganancia (no tiene el
// costo: la Edge no se lo manda).
function onUsadoPrecioInput(el) {
  const raw = el.value.replace(/[^\d]/g, '');
  el.value = raw ? '$' + parseInt(raw, 10).toLocaleString('es-AR') : '';
  formUsado.precioPedido = raw ? parseInt(raw, 10) : null;

  const words = document.getElementById('usadoPrecioWords');
  if (words) {
    const t = numToTextES(formUsado.precioPedido || 0);
    words.textContent = t ? `≈ ${t}` : '';
  }
  const hint = document.getElementById('usadoPrecioHint');
  const u = getUsadoStock(formUsado.usadoid);
  if (hint) {
    const pub = u ? Number(u.precio_venta) || 0 : 0;
    const ped = formUsado.precioPedido || 0;
    if (pub > 0 && ped > 0) {
      const dif = pub - ped;
      if (dif > 0) hint.innerHTML = `Pedís <strong>${fmtMoney(dif)}</strong> menos (${((dif/pub)*100).toFixed(1)}% de rebaja)`;
      else if (dif === 0) hint.textContent = 'Es el mismo precio publicado.';
      else hint.innerHTML = `<span style="color:var(--red)">Ese precio es ${fmtMoney(-dif)} MÁS caro que el publicado. ¿Está bien?</span>`;
    } else hint.textContent = '';
  }
  const btn = document.getElementById('btnNext');
  if (btn) btn.disabled = !formUsado.precioPedido;
}

// ----- Paso: pago por transferencia -----

// Igual que en 0km: el vendedor ve el monto y el costo en pesos, nunca la ganancia.
function onUsadoTransferenciaInput(el) {
  const raw = el.value.replace(/[^\d]/g, '');
  formUsado.transferenciaMonto = raw ? parseInt(raw, 10) : null;

  const hint = document.getElementById('usadoTransfHint');
  if (hint) {
    const monto = formUsado.transferenciaMonto || 0;

    } else {

async function submitConsultaUsado() {
  const u = getUsadoStock(formUsado.usadoid);
  if (!u) { alert('Se perdió la unidad elegida. Volvé atrás y elegila de nuevo.'); return; }
  if (!formUsado.precioPedido) { alert('Falta el precio pedido'); return; }
  if (formUsado.pagaTransferencia === 'si' && !formUsado.transferenciaMonto) {
    alert('Dijiste que una parte va por transferencia pero no cargaste el monto'); return;
  }
  if (!formUsado.tipoCliente) { alert('Falta decir si es venta a particular o a un reventa'); return; }
  if (currentMode === 'gerente' && !gerenteVendedorActivo) { alert('Elegí el vendedor'); return; }

  const esGerente = currentMode === 'gerente' && gerenteVendedorActivo;
  const vendedor = esGerente ? gerenteVendedorActivo : currentUser;

  showLoading('Enviando consulta...');
  try {
    const fila = {
      vendedor_id: vendedor.id,
      vendedor_usuario: vendedor.usuario,
      vendedor_nombre: vendedor.nombre || vendedor.usuario,
      cargada_por_id: esGerente ? currentUser.id : null,
      cargada_por_nombre: esGerente ? (currentUser.nombre || currentUser.usuario) : null,
      usadoid: u.usadoid,
      patente: u.patente,
      unidad: u.unidad,
      modelo: u.modelo,
      anio: u.anio,
      km: u.km || null,
      color: u.color,
      estado_unidad: u.estado,
      // Snapshot del precio publicado al momento de pedir: si despues se cambia
      // el precio, el pedido sigue siendo legible ("pidio X sobre Y").
      precio_publicado: u.precio_venta || null,
      precio_pedido: formUsado.precioPedido,
      // Parte que el cliente pide pagar por transferencia. La alicuota queda como
      // snapshot; el analisis del admin recalcula con la de hoy.
      transferencia_monto: formUsado.transferenciaMonto || null,
      transferencia_alicuota: formUsado.transferenciaMonto ? alicuotaTransferencia() : null,
      transferencia_costo: formUsado.transferenciaMonto ? Math.round(costoTransferencia(formUsado.transferenciaMonto)) : null,
      tipo_cliente: formUsado.tipoCliente,
      cliente_nombre: (formUsado.cliNombre || '').trim() || null,
      cliente_apellido: (formUsado.cliApellido || '').trim() || null,
      observaciones_vendedor: (formUsado.observaciones || '').trim() || null,
      estado: 'pendiente'
      // OJO: no se guarda costo ni margen. Ver comentario al inicio del bloque.
    };
    const res = await sbFetch('consultas_usados', {
      method: 'POST',
      headers: { 'Prefer': 'return=representation' },
      body: JSON.stringify(fila)
    });
    const nueva = Array.isArray(res) ? res[0] : res;
    if (nueva && nueva.id) notifyEvent('consulta_usado_nueva', nueva.id).catch(e => console.error(e));

    document.getElementById('vendedorWizard').classList.add('hidden');
    document.getElementById('vendedorList').classList.remove('hidden');
    await cargarMisConsultasUsados();
    hideLoading();
    showToast('Consulta enviada');
  } catch (e) {
    hideLoading();
    console.error(e);
    alert('Error al enviar: ' + (e.message || e));
  }
}

// ---------- Listas ----------
async function cargarMisConsultasUsados() {
  const cont = document.getElementById('misConsultasList');
  cont.innerHTML = '<div class="empty">Cargando...</div>';
  try {
    let filtro;
    if (currentMode === 'gerente' && gerenteTab === 'respondidas') filtro = 'estado=neq.pendiente&';
    else if (currentMode === 'gerente') filtro = `cargada_por_id=eq.${currentUser.id}&`;
    else filtro = `vendedor_id=eq.${currentUser.id}&`;
    const [filas] = await Promise.all([sbFetch(`consultas_usados?${filtro}order=created_at.desc`), cargarReaperturas()]);
    misConsultasUsados = filas || [];
    if (currentMode === 'gerente' && gerenteTab === 'respondidas') poblarFiltroVendedoresUsados();
    renderVendedorListUsados();
  } catch (e) {
    console.error(e);
    cont.innerHTML = '<div class="empty"><p>Error al cargar</p></div>';
  }
}

function poblarFiltroVendedoresUsados() {
  const sel = document.getElementById('gerenteVendedorFiltro');
  if (!sel) return;
  const map = new Map();
  for (const c of misConsultasUsados) {
    if (c.vendedor_id && !map.has(c.vendedor_id)) map.set(c.vendedor_id, c.vendedor_nombre || c.vendedor_usuario || '—');
  }
  const vendedores = Array.from(map.entries()).sort((a,b) => a[1].localeCompare(b[1]));
  const previo = sel.value;
  sel.innerHTML = '<option value="">Todos los vendedores</option>' +
    vendedores.map(([id, nombre]) => `<option value="${id}">${escapeHtml(nombre)}</option>`).join('');
  if (previo && vendedores.some(([id]) => id === previo)) sel.value = previo;
}

function renderVendedorListUsados() {
  const cont = document.getElementById('misConsultasList');
  const q = (document.getElementById('vSearch').value || '').toLowerCase().trim();
  let list = misConsultasUsados;
  if (currentMode === 'gerente' && gerenteTab === 'respondidas') {
    const f = (document.getElementById('gerenteVendedorFiltro').value || '').trim();
    if (f) list = list.filter(c => c.vendedor_id === f);
  }
  if (q) list = list.filter(c => JSON.stringify(c).toLowerCase().includes(q));
  if (list.length === 0) {
    cont.innerHTML = '<div class="empty"><div class="icon">🔑</div><p>Sin consultas de usados todavía. Tocá <strong>+ Nueva consulta</strong> arriba.</p></div>';
    return;
  }
  cont.innerHTML = list.map(c => renderConsultaUsadoCard(c, false)).join('');
}

function renderConsultaUsadoCard(c, esAdmin) {
  const cliente = `${c.cliente_nombre || ''} ${c.cliente_apellido || ''}`.trim() || 'sin cliente';
  const ventaBadge = c.resultado_venta === 'vendida'
    ? '<span style="background:#d1fae5; color:#065f46; padding:3px 8px; border-radius:12px; font-size:10px; font-weight:700; margin-left:6px">✓ VENDIDA</span>'
    : (c.resultado_venta === 'no_vendida'
      ? '<span style="background:#fee2e2; color:#991b1b; padding:3px 8px; border-radius:12px; font-size:10px; font-weight:700; margin-left:6px">✗ NO VENDIDA</span>'
      : '');
  const titulo = esAdmin
    ? escapeHtml(c.vendedor_nombre || c.vendedor_usuario || '')
    : escapeHtml(cliente);
  const vendedorLine = (!esAdmin && currentMode === 'gerente')
    ? `<div style="font-size:12px; color:var(--vw-blue); font-weight:600">Vendedor: ${escapeHtml(c.vendedor_nombre || c.vendedor_usuario || '—')}${c.cargada_por_nombre ? ` · cargada por ${escapeHtml(c.cargada_por_nombre)}` : ''}</div>`
    : '';
  const pub = Number(c.precio_publicado) || 0;
  const ped = Number(c.precio_pedido) || 0;
  const rebaja = pub > 0 && ped > 0 && pub > ped ? ` · −${(((pub-ped)/pub)*100).toFixed(1)}%` : '';
  return `
    <div class="card consulta-card" onclick="abrirDetalleUsado(${c.id})">
      <div class="top">
        <h3>#${c.id} — ${titulo}${badgeTipoClienteUsado(c.tipo_cliente)}</h3>
        <div><span class="estado ${c.estado}">${txtEstado(c.estado)}</span>${ventaBadge}</div>
      </div>
      <div class="body">
        ${vendedorLine}
        ${esAdmin ? `<div>${escapeHtml(cliente)}</div>` : ''}
        <div class="resumen-units"><span>${escapeHtml(c.unidad || c.modelo || '—')}${c.patente ? ' · ' + escapeHtml(c.patente) : ''} → ${fmtMoney(ped)}${rebaja}</span></div>
        <div class="meta" style="margin-top:6px">${fmtDate(c.created_at)}${c.estado !== 'pendiente' && c.precio_max_admin ? ' · Mejor precio: ' + fmtMoney(c.precio_max_admin) : ''}</div>
      </div>
    </div>`;
}

async function cargarConsultasAdminUsados() {
  const cont = document.getElementById('adminConsultasList');
  cont.innerHTML = '<div class="empty">Cargando...</div>';
  try {
    // El stock hace falta para el margen; si falla, la lista igual se muestra
    // (el detalle avisa que no puede calcular).
    await Promise.all([
      sbFetch('consultas_usados?order=created_at.desc').then(d => { adminConsultasUsados = d || []; }),
      cargarUsadosStock(true).catch(e => console.error('[usados] stock:', e)),
      cargarReaperturas()
    ]);

  } catch (e) {
    console.error(e);
    cont.innerHTML = '<div class="empty"><p>Error al cargar</p></div>';
  }
}

function renderAdminListUsados() {
  const cont = document.getElementById('adminConsultasList');
  const q = (document.getElementById('aSearch').value || '').toLowerCase().trim();
  let list = adminConsultasUsados;
  if (adminTab === 'pendiente') list = list.filter(c => c.estado === 'pendiente');
  else list = list.filter(c => c.estado !== 'pendiente');
  if (q) list = list.filter(c => JSON.stringify(c).toLowerCase().includes(q));
  if (list.length === 0) {
    cont.innerHTML = '<div class="empty"><div class="icon">📭</div><p>No hay consultas de usados en esta vista.</p></div>';
    return;
  }
  cont.innerHTML = list.map(c => renderConsultaUsadoCard(c, true)).join('');
}

// Hint en vivo del admin mientras tipea el precio: que margen le queda.
function onUsadoAdminPrecioInput(consultaId, el) {
  const raw = el.value.replace(/[^\d]/g, '');
  el.value = raw ? '$' + parseInt(raw, 10).toLocaleString('es-AR') : '';
  const words = document.getElementById('adminPrecioMaxWords');
  if (words) {
    const t = numToTextES(raw ? parseInt(raw, 10) : 0);
    words.textContent = t ? `≈ ${t}` : '';
  }
  const hint = document.getElementById('adminPrecioMaxHint');
  if (!hint) return;
  const c = adminConsultasUsados.find(x => x.id === consultaId);
  const u = c ? getUsadoStock(c.usadoid) : null;
  if (!raw || !u || !usadosCostoOk) { hint.textContent = ''; return; }
  const costo = Number(u.costo_toma) || 0;
  if (!costo) { hint.textContent = 'Sin costo de toma en Oversoft: no se puede calcular el margen.'; return; }
  const precio = parseInt(raw, 10);
  // El precio que se autoriza no es lo que entra si una parte viene por transferencia.
  const transferencia = Number(c.transferencia_monto) || 0;
  const costoTr = transferencia > 0 ? costoTransferencia(transferencia) : 0;
  const m = margenUsado(precio - costoTr, costo);
  if (!m) { hint.textContent = ''; return; }
  hint.innerHTML = costoTr > 0
    ? `Con ese precio entran ${fmtMoney(precio - costoTr)} (se van ${fmtMoney(costoTr)} por la transferencia): ` +
      `<strong style="color:${colorMargen(m)}">${(m.sobreCosto*100).toFixed(1)}%</strong> de margen (${fmtMoney(m.pesos)})`
    : `Con ese precio: <strong style="color:${colorMargen(m)}">${(m.sobreCosto*100).toFixed(1)}%</strong> de margen (${fmtMoney(m.pesos)})`;
}

// ---------- Acciones del admin ----------
async function responderUsado(consultaId, estado, extra) {
  showLoading('Guardando...');
  try {
    await sbFetch(`consultas_usados?id=eq.${consultaId}`, {
      method: 'PATCH',
      body: JSON.stringify(Object.assign({
        estado,
        admin_user_id: currentUser.id,
        admin_respuesta_at: new Date().toISOString()
      }, extra))
    });
    notifyEvent('consulta_usado_respondida', consultaId).catch(e => console.error(e));
    closeModal();
    await cargarConsultasAdminUsados();
    hideLoading();
    return true;
  } catch (e) {
    hideLoading();
    console.error(e);
    alert('Error: ' + (e.message || e));
    return false;
  }
}

async function aceptarUsado(consultaId) {
  if (!confirm('¿Aceptar el precio pedido?')) return;
  const obs = getAdminObs();
  if (await responderUsado(consultaId, 'aceptada', { precio_max_admin: null, observaciones_admin: obs || null })) {
    showToast('Precio aceptado');
  }
}

async function rechazarUsado(consultaId) {
  const precio = getAdminPrecioMax();
  if (!precio) { alert('Cargá el mejor precio máximo'); return; }
  if (!confirm(`¿Rechazar y ofrecer ${fmtMoney(precio)} como mejor precio?`)) return;
  const obs = getAdminObs();
  if (await responderUsado(consultaId, 'rechazada', { precio_max_admin: precio, observaciones_admin: obs || null })) {
    showToast('Respuesta enviada');
  }
}

async function contraofertarUsado(consultaId) {
  const obs = getAdminObs();
  const precio = getAdminPrecioMax();
  if (!obs && !precio) { alert('Cargá un precio intermedio o un comentario explicando la condición.'); return; }
  if (!confirm(`¿Enviar contraoferta${precio ? ' con precio ' + fmtMoney(precio) : ''}?`)) return;
  if (await responderUsado(consultaId, 'contraoferta', { precio_max_admin: precio || null, observaciones_admin: obs })) {
    showToast('Contraoferta enviada');
  }
}

async function marcarResultadoUsado(consultaId, resultado, motivo, preventa) {
  showLoading('Guardando...');
  try {
    await sbFetch(`consultas_usados?id=eq.${consultaId}`, {
      method: 'PATCH',
      body: JSON.stringify({
        resultado_venta: resultado,
        motivo_no_venta: motivo || null,
        ...(preventa ? { preventa } : {}),
        resultado_venta_at: new Date().toISOString()
      })
    });
    closeModal();
    await cargarMisConsultasUsados();
    hideLoading();
    showToast(resultado === 'vendida' ? 'Marcada como vendida' : 'Marcada como no vendida');
  } catch (e) { hideLoading(); console.error(e); alert('Error: ' + (e.message || e)); }
}

async function marcarVendidaUsado(consultaId) {
  const c = (misConsultasUsados || []).find(x => x.id === consultaId);
  if (!c) { alert('No se encontró la consulta. Recargá la pantalla.'); return; }
  const pv = await resolverPreventa(c, 'usado');
  if (pv === null) return;
  if (!confirm('¿Confirmar que este usado se vendió?')) return;
  return marcarResultadoUsado(consultaId, 'vendida', null, pv || null);
}

async function marcarNoVendidaUsado(consultaId) {
  const motivo = (document.getElementById('motivoNoVentaTxt').value || '').trim();
  if (!motivo) { alert('Cargá el motivo por el que no se vendió'); return; }
  return marcarResultadoUsado(consultaId, 'no_vendida', motivo);
}

        <label class="field-label">Usuario (único, sin espacios)</label>
        <input id="uUsuario" type="text" value="${escapeHtml(u.usuario || '')}" ${isNew ? '' : 'disabled'}>
      </div>
      <div class="field">
        <label class="field-label">Nombre y apellido</label>
        <input id="uNombre" type="text" value="${escapeHtml(u.nombre || '')}">
      </div>
      <div class="field">
        <label class="field-label">Email</label>
        <input id="uEmail" type="text" value="${escapeHtml(u.email || '')}">
      </div>
      <div class="field-row">
        <div class="field">
          <label class="field-label">WhatsApp (E.164, ej 5491156559854)</label>
          <input id="uTelefono" type="text" value="${escapeHtml(u.telefono_wa || '')}">
        </div>
        <div class="field">
          <label class="field-label">CallMeBot key (opcional)</label>
          <input id="uCallmebot" type="text" value="${escapeHtml(u.callmebot_key || '')}">
        </div>
      </div>
      <div class="field">
        <label class="field-label">Roles</label>
        <div style="display:flex; gap:14px; flex-wrap:wrap; padding:10px 0">
          <label style="display:flex; align-items:center; gap:6px; cursor:pointer">
            <input type="checkbox" id="uRolVendedor" ${roles.includes('vendedor') ? 'checked' : ''}> Vendedor
          </label>
          <label style="display:flex; align-items:center; gap:6px; cursor:pointer">
            <input type="checkbox" id="uRolGerente" ${roles.includes('gerente') ? 'checked' : ''}> Gerente
          </label>
          <label style="display:flex; align-items:center; gap:6px; cursor:pointer">
            <input type="checkbox" id="uRolAdmin" ${roles.includes('admin') ? 'checked' : ''}> Administrador
          </label>
        </div>
      </div>
      <div class="field">
        <label style="display:flex; align-items:center; gap:6px; cursor:pointer">
          <input type="checkbox" id="uActivo" ${u.activo !== false ? 'checked' : ''}> Activo
        </label>
      </div>
      ${isNew ? `
        <div class="field">
          <label class="field-label">Clave inicial (la genero o la pongo manual)</label>
          <input id="uClave" type="text" value="${generarClaveProvisoria()}" placeholder="Clave inicial">
          <div class="field-hint">El usuario tendrá que cambiarla en su primer login.</div>
        </div>
      ` : ''}
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn-success" onclick="guardarUsuario('${id || ''}')">Guardar</button>
    </div>
  `;
  document.getElementById('modalOverlay').classList.remove('hidden');
}

function generarClaveProvisoria() {
  const chars = 'abcdefghijkmnpqrstuvwxyz23456789';
  let p = '';
  for (let i = 0; i < 8; i++) p += chars[Math.floor(Math.random() * chars.length)];
  return p;
}

async function guardarUsuario(id) {
  if (!_esSuperadmin()) { showToast('No autorizado'); return; }
  const usuario = (document.getElementById('uUsuario').value || '').trim().toLowerCase();
  const nombre = (document.getElementById('uNombre').value || '').trim();
  const email = (document.getElementById('uEmail').value || '').trim();
  const telefono_wa = (document.getElementById('uTelefono').value || '').trim();
  const callmebot_key = (document.getElementById('uCallmebot').value || '').trim() || null;
  const activo = document.getElementById('uActivo').checked;
  const roles = [];
  if (document.getElementById('uRolVendedor').checked) roles.push('vendedor');
  if (document.getElementById('uRolGerente').checked) roles.push('gerente');
  if (document.getElementById('uRolAdmin').checked) roles.push('admin');
  if (!usuario) { alert('Falta usuario'); return; }
  if (!nombre) { alert('Falta nombre'); return; }
  if (roles.length === 0) { alert('Asigná al menos un rol'); return; }

  const isNew = !id;
  const body = {
    usuario, nombre, email: email || null, telefono_wa: telefono_wa || null, callmebot_key,
    roles, rol: roles[0], activo
  };

  try {
    showLoading('Guardando...');
    if (isNew) {
      const clave = (document.getElementById('uClave').value || '').trim() || generarClaveProvisoria();
      body.clave = clave;
      body.debe_cambiar_clave = true;
      await sbFetch('tasador_usuarios', { method: 'POST', body: JSON.stringify(body) });
      hideLoading();
      closeModal();
      showToast('Usuario creado. Clave: ' + clave);
      alert(`Usuario creado.\n\nClave provisoria: ${clave}\n\nPasásela al usuario; al primer login va a tener que cambiarla.`);
    } else {
      await sbFetch(`tasador_usuarios?id=eq.${id}`, { method: 'PATCH', body: JSON.stringify(body) });
      hideLoading();
      closeModal();
      showToast('Usuario actualizado');
    }
    cargarUsuarios();
  } catch(e) {
    hideLoading();
    console.error(e);
    alert('Error al guardar: ' + (e.message || e));
  }
}

async function resetClaveUsuario(id) {
  if (!_puedeResetClaves()) { showToast('No autorizado'); return; }
  const u = usuariosList.find(x => x.id === id);
  if (!u) return;
  if (!confirm(`¿Resetear la clave de ${u.usuario}? Se va a generar una clave nueva y al loguearse va a tener que cambiarla.`)) return;
  const clave = generarClaveProvisoria();
  try {
    showLoading('Reseteando...');
    await sbFetch(`tasador_usuarios?id=eq.${id}`, {
      method: 'PATCH',
      body: JSON.stringify({ clave, debe_cambiar_clave: true })
    });
    hideLoading();
    mostrarClaveProvisoria(u.usuario, clave);
    cargarUsuarios();
  } catch(e) {
    hideLoading();
    console.error(e);
    alert('Error: ' + (e.message || e));
  }
}

function mostrarClaveProvisoria(usuario, clave) {
  // Modal custom (no alert nativo) para que la clave se pueda copiar facil
  const html = `
    <div id="claveProvOverlay" style="position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:10000; padding:20px">
      <div style="background:#fff; border-radius:12px; padding:24px; max-width:420px; width:100%; box-shadow:0 10px 40px rgba(0,0,0,0.3)">
        <h3 style="margin-bottom:8px; color:var(--vw-blue)">Clave reseteada para <strong>${escapeHtml(usuario)}</strong></h3>
        <p style="font-size:13px; color:var(--vw-grey-4); margin-bottom:14px">Pasásela al usuario. Al loguearse va a tener que cambiarla.</p>
        <div style="display:flex; gap:8px; align-items:stretch; margin-bottom:14px">
          <input id="claveProvInput" type="text" readonly value="${escapeHtml(clave)}"
            onclick="this.select()"
            style="flex:1; padding:12px; border:2px solid var(--vw-grey-2); border-radius:8px; font-family:var(--mono,monospace); font-size:16px; font-weight:700; letter-spacing:1px; background:var(--vw-grey-1); color:var(--vw-blue)">
          <button onclick="copiarClaveProv()" id="claveProvCopyBtn"
            style="background:var(--vw-blue); color:#fff; padding:0 16px; border:none; border-radius:8px; font-weight:600; cursor:pointer; white-space:nowrap">📋 Copiar</button>
        </div>
        <div style="display:flex; justify-content:flex-end">
          <button onclick="cerrarClaveProv()" class="btn-secondary">Cerrar</button>
        </div>
      </div>
    </div>
  `;
  const wrap = document.createElement('div');
  wrap.innerHTML = html;
  document.body.appendChild(wrap.firstElementChild);
  setTimeout(() => document.getElementById('claveProvInput').select(), 50);
}
async function copiarClaveProv() {
  const input = document.getElementById('claveProvInput');
  const btn = document.getElementById('claveProvCopyBtn');
  if (!input) return;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(input.value);
    } else {
      input.select();
      document.execCommand('copy');
    }
    if (btn) {
      const orig = btn.innerHTML;
      btn.innerHTML = '✓ Copiada';
      btn.style.background = 'var(--green, #16a34a)';
      setTimeout(() => { btn.innerHTML = orig; btn.style.background = 'var(--vw-blue)'; }, 1500);
    }
  } catch(e) {
    console.error(e);
    alert('No se pudo copiar automáticamente. Seleccioná y copiá a mano.');
  }
}
function cerrarClaveProv() {
  const o = document.getElementById('claveProvOverlay');
  if (o) o.remove();
}

async function toggleActivoUsuario(id, activarNuevo) {
  if (!_esSuperadmin()) { showToast('No autorizado'); return; }
  const u = usuariosList.find(x => x.id === id);
  if (!u) return;
  if (!confirm(`¿${activarNuevo ? 'Activar' : 'Desactivar'} a ${u.usuario}?`)) return;
  try {
    showLoading('Guardando...');
    await sbFetch(`tasador_usuarios?id=eq.${id}`, {
      method: 'PATCH',
      body: JSON.stringify({ activo: activarNuevo })
    });
    hideLoading();
    cargarUsuarios();
  } catch(e) {
    hideLoading();
    console.error(e);
    alert('Error: ' + (e.message || e));
  }
}

async function entrarComoUsuario(id) {
  if (!_esSuperadmin()) { showToast('No autorizado'); return; }
  const u = usuariosList.find(x => x.id === id);
  if (!u) return;
  if (u.id === currentUser.id) { showToast('Ya sos vos'); return; }
  if (u.activo === false) { alert('Usuario inactivo. Activalo primero.'); return; }
  if (!confirm(`¿Entrar como ${u.nombre || u.usuario}? Vas a ver lo que ve el usuario.`)) return;

  // Guardamos el admin real (si es la primera impersonación)
  if (!realUser) realUser = currentUser;
  currentUser = { ...u };
  currentUser.rolesArr = (Array.isArray(u.roles) && u.roles.length > 0)
    ? u.roles
    : (u.rol ? [u.rol] : ['vendedor']);

  // Banner de impersonación
  document.getElementById('impersonateName').textContent = u.nombre || u.usuario;
  document.getElementById('impersonateBanner').classList.remove('hidden');

  closeModal();

  // Si tiene varios roles (ej: Daniel = vendedor + gerente), mostramos mode-select
  // así podés elegir desde qué rol probar. Si tiene uno solo, entra directo.
  const rolesValidos = currentUser.rolesArr.filter(r => ['vendedor', 'gerente', 'admin'].includes(r));
  if (rolesValidos.length > 1) {
    elegirModo();
  } else {
    entrarComo(rolesValidos[0] || 'vendedor');
  }
}

function volverAAdmin() {
  if (!realUser) return;
  currentUser = realUser;
  realUser = null;
  document.getElementById('impersonateBanner').classList.add('hidden');
  entrarComo('admin');
}

// ============ INIT ============
async function init() {
  const sess = cargarSesion();
  if (sess && sess.id) {
    showLoading('Restaurando sesión...');
    try {
      const data = await sbFetch(`tasador_usuarios?id=eq.${sess.id}&activo=eq.true&select=id,nombre,usuario,rol,activo,email,roles,telefono_wa,debe_cambiar_clave,notificaciones_wa`);
      if (data && data.length > 0) {
        currentUser = data[0];
        currentUser.rolesArr = (Array.isArray(currentUser.roles) && currentUser.roles.length > 0)
          ? currentUser.roles
          : (currentUser.rol ? [currentUser.rol] : ['vendedor']);
        // Sesion firmada guardada en el login. Solo si es del MISMO usuario: si
        // quedo de una impersonacion, no vale para este.
        const sigOk = sess.session_sig && sess.usuario === currentUser.usuario &&
                      Number(sess.session_exp || 0) * 1000 > Date.now();
        if (sigOk) {
          currentUser.session_exp = sess.session_exp;
          currentUser.session_sig = sess.session_sig;
        } else {
          // Sin sesion firmada no hay forma de probar quien sos ante las Edge
          // (`tasador_usuarios` ya no tiene la clave): entrarias con media app
          // en blanco y sin margenes. Mejor pedir el login de nuevo.
          hideLoading();
          limpiarSesion();
          document.getElementById('loginScreen').classList.remove('hidden');
          return;
        }
        document.getElementById('loginScreen').classList.add('hidden');
        await cargarStock();
        if (currentUser.rolesArr.includes('admin') && currentUser.rolesArr.length > 1 && !sess.mode) {
          hideLoading();
          elegirModo();
        } else {
          hideLoading();
          entrarComo(sess.mode || (currentUser.rolesArr.includes('admin') ? 'admin' : 'vendedor'));
        }
        return;
      }
    } catch(e) { console.error(e); }
    hideLoading();
    limpiarSesion();
  }
}
init();
</script>

<!-- ===== Banner de impersonacion cross-app (lee cookie tga_session compartida) ===== -->
<script>
(function tgaImpersonateBanner() {
  function getCk() {
    var m = document.cookie.match(/(?:^|;\s*)tga_session=([^;]+)/);
    if (!m) return null;
    try { return JSON.parse(decodeURIComponent(m[1])); } catch (e) { return null; }
  }
  function setCk(v) {
    var value = encodeURIComponent(JSON.stringify(v));
    var maxAge = 7 * 24 * 60 * 60;
    document.cookie = 'tga_session=' + value + '; path=/; domain=.titogonzalez.online; max-age=' + maxAge + '; Secure; SameSite=Lax';
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});
  }
  window.tgaVolverASesionOriginal = function() {
    var c = getCk();
    if (!c || !c._impersonatedBy) return;
    var orig = Object.assign({}, c._impersonatedBy);
    delete orig._impersonatedBy;
    setCk(orig);
    try { localStorage.removeItem('tasadorSession'); } catch (e) {}
    try { localStorage.removeItem('portal_tga_session'); } catch (e) {}
    try { sessionStorage.removeItem('vwfs_admin_user'); sessionStorage.removeItem('vwfs_admin_role'); } catch (e) {}
    location.reload();
  };
  function render() {
    var c = getCk();
    var banner = document.getElementById('tgaImpersonateBanner');
    if (!c || !c._impersonatedBy) {
      if (banner) { banner.remove(); document.body.style.paddingTop = ''; }
      return;
    }
    if (!banner) {
      banner = document.createElement('div');
      banner.id = 'tgaImpersonateBanner';
      banner.style.cssText = 'position:fixed; top:0; left:0; right:0; background:#9A3412; color:#fff; padding:8px 14px; font-size:13px; font-weight:600; z-index:99999; display:flex; justify-content:space-between; align-items:center; gap:12px; box-shadow:0 2px 6px rgba(0,0,0,0.2); flex-wrap:wrap; font-family:system-ui,sans-serif';
      document.body.appendChild(banner);
      document.body.style.paddingTop = '36px';
    }
    var cur = esc(c.usuario || '?');
    var curN = c.nombre ? ' (' + esc(c.nombre) + ')' : '';
    var origU = esc(c._impersonatedBy.usuario || '?');
    banner.innerHTML = '<span>👤 Estás viendo como <strong>' + cur + '</strong>' + curN + '</span>'
      + '<button onclick="tgaVolverASesionOriginal()" style="background:#fff; color:#9A3412; border:none; padding:5px 12px; border-radius:5px; cursor:pointer; font-weight:700; font-size:12px">← Volver a ' + origU + '</button>';
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', render);
  } else {
    render();
  }
})();
</script>
