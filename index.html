// ============ Análisis ============
function calcularAnalisisUnidad(u) {
  if (!u || !u.modelo || u.precioPedido == null || isNaN(u.precioPedido)) return null;
  // "Sin disponibilidad": el modelo puede no tener NINGUNA unidad en stockData (hoy 20
  // de los 48 del catalogo). El analisis se hace igual contra el precio publicado del
  // catalogo — mismo snapshot del Motor Baratito que usa todo el resto — asi el
  // vendedor ve cuanto descuento extra esta pidiendo aunque el auto no exista todavia.
  if (u.sinDisponibilidad) {
    const ref = refPrecioModelo(u.modelo);
    if (!ref || !ref.precio_lista) return null;
    if (ref.oferta == null) {
      return { oferta_vigente_min: null, gcia_vigente_min: null, precio_lista: ref.precio_lista,
        dto_extra_pedido: null, gcia_resultante: null, chasisSnapshot: [] };
    }
    const dto = (ref.oferta - u.precioPedido) / ref.precio_lista;
    return { oferta_vigente_min: ref.oferta, gcia_vigente_min: ref.gcia, precio_lista: ref.precio_lista,
      dto_extra_pedido: dto, gcia_resultante: (ref.gcia || 0) - dto, chasisSnapshot: [] };
  }
  // Para unidades en reparto no hay chasis seleccionados, pero el analisis se calcula igual:
  // tomamos cualquier registro de stockData con el mismo modelo (libre o vendido — los modelos
  // en reparto tipicamente tienen chasis pasados con su oferta_vigente y gcia_actual). Y para
  // el precio de lista usamos como override el de la tab "bt" del espejo, que cubre TODOS los
  // modelos del catalogo (esten o no en stock).
  let chasisData;
  if (u.esReparto) {
    chasisData = stockData.filter(r => r.modelo === u.modelo);
  } else {
    if (!u.chasisSeleccionados || u.chasisSeleccionados.length === 0) return null;
    chasisData = u.chasisSeleccionados.map(s => stockData.find(r => r.serie === s)).filter(Boolean);
  }
  if (chasisData.length === 0) {
    // Sin registros en stockData. Para reparto, devolvemos al menos el precio_lista de bt.
    if (u.esReparto) {
      const pl = getPrecioListaModelo(u.modelo);
      if (isNaN(pl) || pl <= 0) return null;
      return { oferta_vigente_min: null, gcia_vigente_min: null, precio_lista: pl,
        dto_extra_pedido: null, gcia_resultante: null, chasisSnapshot: [] };
    }
    return null;
  }
  let oferta_vigente_min = Infinity, gcia_vigente_min = null, precio_lista = null;
  chasisData.forEach(c => {
    if (!isNaN(c.oferta_vigente) && c.oferta_vigente < oferta_vigente_min) {
      oferta_vigente_min = c.oferta_vigente;
      gcia_vigente_min = c.gcia_vigente;
    }
    if (precio_lista == null || c.precio_lista > precio_lista) precio_lista = c.precio_lista;
  });
  // Reparto: override del precio_lista con el de bt si lo tenemos (mas actualizado y cubre catalogo entero).
  if (u.esReparto) {
    const pl = getPrecioListaModelo(u.modelo);
    if (!isNaN(pl) && pl > 0) precio_lista = pl;
  }
  if (!isFinite(oferta_vigente_min) || !precio_lista) {
    if (u.esReparto && precio_lista) {
      return { oferta_vigente_min: null, gcia_vigente_min: null, precio_lista,
        dto_extra_pedido: null, gcia_resultante: null, chasisSnapshot: [] };
    }
    return null;
  }
  const dto_extra_pedido = (oferta_vigente_min - u.precioPedido) / precio_lista;
  const gcia_resultante = (gcia_vigente_min || 0) - dto_extra_pedido;
  return {
    oferta_vigente_min, gcia_vigente_min, precio_lista,
    dto_extra_pedido, gcia_resultante,
    chasisSnapshot: u.esReparto ? [] : chasisData.map(c => ({
      serie: c.serie, color: c.color,
      oferta_vigente: c.oferta_vigente, gcia_vigente: c.gcia_vigente,
      fuente_oferta: c.fuente_oferta,
      fecha_factura: c.fecha_factura_str || null,
      enReparto: !!c.enReparto,
      estadoReparto: c.estadoReparto || null
    }))
  };
}

// Analisis EN VIVO para el admin a partir de un item ya guardado. La gcia guardada en el item
// la calculo el VENDEDOR, y a los vendedores la Edge les blinda la ganancia (vuelve 0), por eso
// gcia_vigente_min quedo en 0 y gcia_resultante = -dto_extra. Para el admin recalculamos contra
// stockData actual (que para el admin SI trae la ganancia real). Devuelve null si no hay datos.
function analisisAdminVivo(it) {
  if (!it || it.precio_pedido == null) return null;
  const series = (it.chasis || []).map(ch => ch.serie).filter(Boolean);
  const base = { modelo: it.modelo, precioPedido: Number(it.precio_pedido) };
  // 1) por los chasis pedidos (si siguen en stock).
  let a = calcularAnalisisUnidad({ ...base, esReparto: false, chasisSeleccionados: series });
  // 2) fallback: cualquier chasis del modelo (la gcia es por-modelo) + precio_lista de bt.
  if (!a || a.gcia_vigente_min == null) {
    a = calcularAnalisisUnidad({ ...base, esReparto: true, chasisSeleccionados: [] });
  }
  // 3) fallback: el modelo no tiene NINGUNA unidad en stockData (caso tipico de
  // "sin disponibilidad"). Vamos al catalogo, que trae el precio Baratito y la
  // ganancia del modelo del mismo snapshot del Motor.
  if (!a || a.gcia_vigente_min == null) {
    a = calcularAnalisisUnidad({ ...base, sinDisponibilidad: true });
  }
  if (!a || a.gcia_vigente_min == null) return null;
  return a;
}

// Referencia de precio y ganancia de HOY para un item guardado, SIN depender de que
// el vendedor haya pedido un precio (en "sin disponibilidad" puede no haberlo). Es lo
// que pre-llena el input del admin y lo que se usa para calcular el margen mientras
// tipea. Orden: chasis pedidos -> cualquier chasis del modelo -> catalogo (precio
// Baratito del modelo) -> el snapshot guardado en la consulta.
function refAdminUnidad(it) {
  if (!it) return null;
  if (it.precio_pedido != null) {
    const a = analisisAdminVivo(it);
    if (a && a.precio_lista > 0 && a.gcia_vigente_min != null) {
      return { oferta: a.oferta_vigente_min, precio_lista: a.precio_lista, gcia: a.gcia_vigente_min };
    }
  }
  const r = refPrecioModelo(resolveModeloCanonico(it.modelo) || it.modelo);
  if (r && r.precio_lista > 0 && r.oferta) {
    return { oferta: r.oferta, precio_lista: r.precio_lista, gcia: r.gcia || 0 };
  }
  if (it.precio_lista > 0) {
    return { oferta: it.oferta_vigente_min, precio_lista: it.precio_lista, gcia: it.gcia_vigente_min || 0 };
  }
  return null;
}

// ============ SUBMIT ============
async function submitConsulta() {
  const f = formData;
  const sinDisp = f.origen === 'sin_disponibilidad';
  const errs = [];
  f.unidades.forEach((u, i) => {
    if (!u.modelo) errs.push(`Unidad ${i+1}: falta modelo`);
    if (sinDisp) {
      // Sin disponibilidad: el color es obligatorio (es lo que se va a preguntar al
      // zonal) y el precio NO (puede ser solo "¿se consigue?").
      if (!(u.colorPedido || '').trim()) errs.push(`Unidad ${i+1}: falta el color a consultar`);
    } else {
      if (!u.esReparto && u.chasisSeleccionados.length === 0) errs.push(`Unidad ${i+1}: falta color`);
      if (!u.precioPedido) errs.push(`Unidad ${i+1}: falta precio`);
    }
  });
  if (errs.length) { alert('Faltan datos:\n\n• ' + errs.join('\n• ')); return; }

  // En modo gerente, debe haber un vendedor elegido
  if (currentMode === 'gerente' && !gerenteVendedorActivo) {
    alert('Falta elegir el vendedor para esta consulta.');
    return;
  }
  showLoading('Enviando...');
  try {
    // Si gerente, la consulta queda asignada al vendedor elegido y se registra quién la cargó
    const vend = currentMode === 'gerente' && gerenteVendedorActivo
      ? gerenteVendedorActivo
      : { id: currentUser.id, usuario: currentUser.usuario, nombre: currentUser.nombre || currentUser.usuario };

    // Decision de diseño: cuando el vendedor pide N unidades, creamos N consultas
    // separadas (cada una con 1 item). El admin las responde individualmente, cada
    // respuesta dispara su propio WA. Los datos del cliente, ubicacion, financiacion,
    // observaciones, etc., se duplican en cada cabecera (es OK, son pocos bytes y
    // permite que cada consulta sea totalmente autocontenida).
    const N = f.unidades.length;
    const consultaIds = [];
    for (let i = 0; i < N; i++) {
      const u = f.unidades[i];
      const a = calcularAnalisisUnidad({ ...u, sinDisponibilidad: sinDisp });
      // % financiacion calculado sobre el precio_pedido de ESTA unidad (antes era
      // siempre el de la unidad 1 — ahora cada consulta es independiente).
      let finPct = null;
      if (f.financia === 'si' && f.finMonto && u.precioPedido) {
        const base = u.precioPedido - FYF;
        if (base > 0) finPct = f.finMonto / base;
      }
      const cabecera = {
        vendedor_id: vend.id,
        vendedor_usuario: vend.usuario,
        vendedor_nombre: vend.nombre,
        cargada_por_id: currentMode === 'gerente' ? currentUser.id : null,
        cargada_por_nombre: currentMode === 'gerente' ? (currentUser.nombre || currentUser.usuario) : null,
        tipo_cliente: f.tipoCliente,
        provincia: f.provincia,
        localidad: f.localidad,
        cliente_nombre: f.cliNombre || null,
        cliente_apellido: f.cliApellido || null,
        fuente_dato: f.fuenteDato || null,
        fuente_dato_otro: f.fuenteDato === 'otro' ? f.fuenteDatoOtro : null,
        tiene_usado: f.tipoCliente === 'particular' ? f.tieneUsado : null,
        reventa_nombre: f.reventaNombre || null,
        financia: f.financia === 'si',
        financia_entidad: f.financia === 'si' ? (f.tipoCliente === 'reventa' ? 'vwfs' : f.finEntidad) : null,
        financia_entidad_otro: f.finEntidad === 'otros' ? f.finEntidadOtro : null,
        financia_monto: f.financia === 'si' ? f.finMonto : null,
        financia_pct: finPct,
        vs_otro_concesionario: f.vsOtro,
        concesionario_nombre: f.vsOtro === 'si' ? f.conceNombre : null,
        concesionario_precio: f.vsOtro === 'si' ? f.concePrecio : null,
        observaciones_vendedor: (f.observaciones || '').trim() || null,
        // De que bolsa salio el auto. Define que ve el admin y como se responde:
        // stock/reparto -> precio; sin_disponibilidad -> primero "¿se consigue?".
        origen: f.origen || 'stock',
        estado: 'pendiente'
      };
      const inserted = await sbFetch('consultas_0km', { method: 'POST', body: JSON.stringify(cabecera) });
      const consultaId = inserted[0].id;
      consultaIds.push(consultaId);

      // calcularAnalisisUnidad ya funciona igual para stock y reparto: para reparto toma
      // los datos del analisis de cualquier registro de stockData con el mismo modelo y
      // el precio_lista de la tab "bt".
      const item = {
        consulta_id: consultaId,
        orden: 1,
        modelo: u.modelo,
        version: u.modelo,
        chasis: a ? a.chasisSnapshot : [],
        precio_lista: a ? a.precio_lista : null,
        oferta_vigente_min: a ? a.oferta_vigente_min : null,
        gcia_vigente_min: a ? a.gcia_vigente_min : null,
        // En "sin disponibilidad" puede venir sin precio (consulta de disponibilidad pura).
        precio_pedido: u.precioPedido || null,
        // Color pedido a mano. Solo se llena en "sin disponibilidad": en los otros
        // origenes el color va dentro del snapshot de `chasis`.
        color_pedido: sinDisp ? (u.colorPedido || '').trim() : null,
        dto_extra_pedido: a ? a.dto_extra_pedido : null,
        gcia_resultante: a ? a.gcia_resultante : null,
        // es_reparto = el auto pedido no esta fisicamente: o el modelo entero venia
        // solo por reparto (fallback CSV), o todos los chasis elegidos son de reparto.
        es_reparto: !!u.esReparto ||
          !!(a && a.chasisSnapshot.length > 0 && a.chasisSnapshot.every(ch => ch.enReparto))
      };
      await sbFetch('consultas_0km_items', { method: 'POST', body: JSON.stringify([item]) });
    }

    // Una notificacion WA por consulta (asi cada vehiculo le llega aparte al admin/gerentes).
    consultaIds.forEach(id => notifyAdminNuevaConsulta(id).catch(e => console.error(e)));

    hideLoading();
    showToast(N === 1 ? 'Consulta enviada' : `${N} consultas enviadas`);
    document.getElementById('vendedorWizard').classList.add('hidden');
    document.getElementById('vendedorList').classList.remove('hidden');
    cargarMisConsultas();
  } catch(e) {
    hideLoading();
    console.error(e);
    alert('Error al enviar: ' + (e.message || e));
  }
}

// Dispara la Edge Function notify-whatsapp-consulta. Fire-and-forget.
async function notifyEvent(evento, consultaId) {
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/notify-whatsapp-consulta`, {
      method: 'POST',

        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ consulta_id: consultaId, evento })
    });

    console.log(`[notify] evento=${evento} enviados=${data.enviados || 0} errores=${(data.errores || []).length}`, data);
  } catch(e) {

// ============ MIS CONSULTAS (vendedor / gerente) ============
async function cargarMisConsultas() {
  const cont = document.getElementById('misConsultasList');
  cont.innerHTML = '<div class="empty">Cargando...</div>';
  try {
    // Filtro segun rol y tab activo:
    // - Vendedor: sus propias consultas (vendedor_id = el).
    // - Gerente / "Mis cargas": consultas que el cargo (cargada_por_id = el).
    // - Gerente / "Respondidas": todas las consultas respondidas (estado != pendiente),
    //   sin filtrar x el — el dropdown de la UI filtra por vendedor despues.
    let filtro;
    if (currentMode === 'gerente' && gerenteTab === 'respondidas') {
      filtro = `estado=not.in.(pendiente,en_gestion)&`;
    } else if (currentMode === 'gerente') {
      filtro = `cargada_por_id=eq.${currentUser.id}&`;
    } else {
      filtro = `vendedor_id=eq.${currentUser.id}&`;
    }
    const data = await sbFetch(`consultas_0km?${filtro}order=created_at.desc`);
    const ids = (data || []).map(c => c.id);
    let items = [];
    if (ids.length > 0) items = await sbFetch(`consultas_0km_items?consulta_id=in.(${ids.join(',')})&order=orden.asc`);
    myConsultas = (data || []).map(c => ({ ...c, items: items.filter(i => i.consulta_id === c.id) }));
    // Si estamos en tab "respondidas", poblar el dropdown de vendedores con
    // los que aparecen en los resultados (asi solo lista vendedores con consultas respondidas).
    if (currentMode === 'gerente' && gerenteTab === 'respondidas') {
      poblarFiltroVendedores();
    }
    renderVendedorList();
  } catch(e) {
    console.error(e);
    cont.innerHTML = '<div class="empty"><p>Error al cargar</p></div>';
  }
}
function poblarFiltroVendedores() {
  const sel = document.getElementById('gerenteVendedorFiltro');
  if (!sel) return;
  // Recolectar vendedores unicos de myConsultas
  const map = new Map();
  for (const c of myConsultas) {
    if (c.vendedor_id && !map.has(c.vendedor_id)) {
      map.set(c.vendedor_id, c.vendedor_nombre || c.vendedor_usuario || '—');
    }
  }
  const vendedores = Array.from(map.entries()).sort((a,b) => a[1].localeCompare(b[1]));
  const previo = sel.value;
  sel.innerHTML = '<option value="">Todos los vendedores</option>' +
    vendedores.map(([id, nombre]) => `<option value="${id}">${escapeHtml(nombre)}</option>`).join('');
  if (previo && vendedores.some(([id]) => id === previo)) sel.value = previo;
}
function setGerenteTab(tab) {
  gerenteTab = tab;
  document.getElementById('tabGerenteMisCargas').classList.toggle('active', tab === 'misCargas');
  document.getElementById('tabGerenteRespondidas').classList.toggle('active', tab === 'respondidas');
  // Mostrar/ocultar elementos especificos del tab
  const dropdown = document.getElementById('gerenteVendedorFiltro');
  const btnNueva = document.getElementById('btnNuevaConsulta');
  if (dropdown) dropdown.classList.toggle('hidden', tab !== 'respondidas');
  if (btnNueva) btnNueva.classList.toggle('hidden', tab === 'respondidas');
  if (seccion === 'usados') cargarMisConsultasUsados(); else cargarMisConsultas();
}
function renderVendedorList() {
  // La misma caja de busqueda sirve a las dos secciones (el oninput del HTML
  // llama siempre a esta): si estamos en usados, delega.
  if (seccion === 'usados') return renderVendedorListUsados();
  const cont = document.getElementById('misConsultasList');
  const q = (document.getElementById('vSearch').value || '').toLowerCase().trim();
  let list = myConsultas;

  if (currentMode === 'gerente' && gerenteTab === 'respondidas') {

    if (filtroVendId) list = list.filter(c => c.vendedor_id === filtroVendId);
  }

    cont.innerHTML = empty;

  }
  cont.innerHTML = list.map(c => renderConsultaCard(c)).join('');
}
// Badge de origen para las cards. Los tres orígenes se leen de un vistazo:
// stock no lleva badge (es lo normal), reparto ámbar, sin disponibilidad violeta.
function badgeOrigen(c, it) {
  const est = (txt, bg, fg) => ` <span style="background:${bg}; color:${fg}; padding:1px 5px; border-radius:6px; font-size:9px; font-weight:700; margin-left:4px">${txt}</span>`;
  if (c && c.origen === 'sin_disponibilidad') return est('SIN DISPONIBILIDAD', '#e0e7ff', '#3730a3');
  if ((c && c.origen === 'reparto') || (it && it.es_reparto)) return est('REPARTO', '#fbbf24', '#78350f');
  return '';
}
// Texto del estado para mostrar (los crudos de la DB no se leen bien).
function txtEstado(e) {
  if (e === 'en_gestion') return 'en gestión';
  return e || '';
}
function renderConsultaCard(c) {
  const cliente = c.tipo_cliente === 'particular' ? `${c.cliente_nombre || ''} ${c.cliente_apellido || ''}`.trim() : (c.reventa_nombre || '—');
  const unidadesStr = (c.items || []).map(it => {
    const col = it.color_pedido ? ` <span class="muted">${escapeHtml(it.color_pedido)}</span>` : '';
    return escapeHtml(it.modelo) + col + badgeOrigen(c, it);
  }).join(' · ');
  const vendedorLine = currentMode === 'gerente'
    ? `<div style="font-size:12px; color:var(--vw-blue); font-weight:600">Vendedor: ${escapeHtml(c.vendedor_nombre || c.vendedor_usuario || '—')}${c.cargada_por_nombre ? ` · cargada por ${escapeHtml(c.cargada_por_nombre)}` : ''}</div>`
    : '';
  const ventaBadge = c.resultado_venta === 'vendida'
    ? '<span style="background:#d1fae5; color:#065f46; padding:3px 8px; border-radius:12px; font-size:10px; font-weight:700; margin-left:6px">✓ VENDIDA</span>'
    : (c.resultado_venta === 'no_vendida'
      ? '<span style="background:#fee2e2; color:#991b1b; padding:3px 8px; border-radius:12px; font-size:10px; font-weight:700; margin-left:6px">✗ NO VENDIDA</span>'
      : '');
  return `
    <div class="card consulta-card" onclick="abrirDetalle(${c.id})">
      <div class="top">
        <h3>#${c.id} — ${escapeHtml(cliente)}</h3>
        <div><span class="estado ${c.estado}">${txtEstado(c.estado)}</span>${ventaBadge}</div>
      </div>
      <div class="body">
        ${vendedorLine}
        <div>${c.tipo_cliente === 'particular' ? 'Particular' : 'Reventa'} · ${escapeHtml(c.provincia || '')} / ${escapeHtml(c.localidad || '')}</div>
        <div class="resumen-units"><span>${unidadesStr || '—'}</span></div>
        <div class="meta" style="margin-top:6px">${fmtDate(c.created_at)}${c.estado === 'rechazada' && c.precio_max_admin ? ' · Mejor precio: ' + fmtMoney(c.precio_max_admin) : ''}</div>
      </div>
    </div>
  `;
}

      : (c.resultado_venta === 'no_vendida'
        ? '<span style="background:#fee2e2; color:#991b1b; padding:3px 8px; border-radius:12px; font-size:10px; font-weight:700; margin-left:6px">✗ NO VENDIDA</span>'

      <div class="top">
        <h3 style="display:flex; align-items:center">${checkbox}#${c.id} — ${escapeHtml((c.vendedor_nombre || c.vendedor_usuario || ''))}</h3>

      </div>
      <div class="body">

        <div class="resumen-units">${(c.items || []).map(it => {
          const tag = badgeOrigen(c, it);

          const precio = it.precio_pedido ? ` → ${fmtMoney(it.precio_pedido)}` : ' → <em>¿se consigue?</em>';
          return `<span>${escapeHtml(it.modelo)}${col}${tag}${precio}</span>`;

        <div class="meta" style="margin-top:6px">${fmtDate(c.created_at)}</div>

  }).join('');

// ============ DETALLE / MODAL ============
// Historial de consultas de disponibilidad YA respondidas para el mismo modelo.
// Pedido de Fer: "si le respondo que no hay en VW y otro me pregunta de ese modelo,
// que me aparezca lo contestado, para recordar que tal día ya pregunté y me dijeron
// que no hay". Evita volver a molestar al zonal por lo mismo.
//
// Cruza por MODELO (canónico) sobre todas las consultas sin_disponibilidad, en
// cualquier estado — una que quedó "en gestión" o sin responder también importa: es
// una pregunta ya hecha. Las del MISMO COLOR van primero y resaltadas, porque son la
// respuesta literal a lo que están preguntando de nuevo.
function historialDisponibilidad(c, it) {
  if (!c || c.origen !== 'sin_disponibilidad') return '';
  const canonCur = resolveModeloCanonico(it.modelo) || it.modelo;
  const colorCur = _normColor(it.color_pedido || '');
  const previas = [];
  (adminConsultas || []).forEach(oc => {
    if (oc.id === c.id) return;
    if (oc.origen !== 'sin_disponibilidad') return;
    (oc.items || []).forEach(oit => {
      if ((resolveModeloCanonico(oit.modelo) || oit.modelo) !== canonCur) return;
      previas.push({
        id: oc.id,
        color: oit.color_pedido || '',
        mismoColor: !!colorCur && _normColor(oit.color_pedido || '') === colorCur,
        estado: oc.estado,
        disponibilidad: oc.disponibilidad,
        precio: oc.precio_max_admin,
        obs: (oc.observaciones_admin || '').trim(),
        vendedor: oc.vendedor_nombre || oc.vendedor_usuario || '',
        fecha: oc.admin_respuesta_at || oc.created_at,
        respondida: !!oc.admin_respuesta_at
      });
    });
  });
  if (previas.length === 0) return '';
  // Mismo color primero; dentro de cada grupo, lo más reciente arriba.
  previas.sort((a, b) => (b.mismoColor ? 1 : 0) - (a.mismoColor ? 1 : 0) || new Date(b.fecha) - new Date(a.fecha));
  const nMismo = previas.filter(p => p.mismoColor).length;

  const veredicto = (p) => {
    if (p.disponibilidad === 'se_consigue') return { txt: 'SE CONSIGUE', bg: '#dcfce7', fg: '#166534' };
    if (p.disponibilidad === 'no_se_consigue') return { txt: 'NO SE CONSIGUE', bg: '#fee2e2', fg: '#991b1b' };
    if (p.estado === 'en_gestion') return { txt: 'EN GESTIÓN', bg: '#ede9fe', fg: '#5b21b6' };
    if (p.estado === 'pendiente') return { txt: 'SIN RESPONDER', bg: '#fed7aa', fg: '#9a3412' };
    // Respondida antes de que existiera la columna `disponibilidad`.
    if (p.estado === 'aceptada') return { txt: 'SE CONSIGUE', bg: '#dcfce7', fg: '#166534' };
    if (p.estado === 'rechazada') return { txt: 'NO SE CONSIGUE', bg: '#fee2e2', fg: '#991b1b' };
    return { txt: (p.estado || '—').toUpperCase(), bg: '#e5e7eb', fg: '#374151' };
  };

  const MAX = 6;
  const filas = previas.slice(0, MAX).map(p => {
    const v = veredicto(p);
    const marco = p.mismoColor ? 'background:#fffbeb; border-left:3px solid var(--orange); padding-left:7px' : '';
    return `
      <div style="padding:7px 6px; border-bottom:1px dashed var(--vw-grey-2); font-size:12px; ${marco}">
        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap">
          <span class="muted" style="font-size:11px; white-space:nowrap">${p.respondida ? fmtDate(p.fecha) : 'pedida ' + fmtDate(p.fecha)}</span>
          <strong>${escapeHtml(p.color || 'sin color')}</strong>
          ${p.mismoColor ? '<span style="color:var(--orange); font-weight:700; font-size:10px">MISMO COLOR</span>' : ''}
          <span style="background:${v.bg}; color:${v.fg}; padding:1px 7px; border-radius:6px; font-size:10px; font-weight:700">${v.txt}</span>
          ${p.precio ? `<span class="muted">${fmtMoney(p.precio)}</span>` : ''}
          <span class="muted" style="font-size:11px; margin-left:auto">#${p.id} · ${escapeHtml(p.vendedor)}</span>
        </div>
        ${p.obs ? `<div class="muted" style="margin-top:3px; font-style:italic">"${escapeHtml(p.obs)}"</div>` : ''}
      </div>`;
  }).join('');

  const resumenMismo = nMismo
    ? `<span style="color:var(--orange); font-weight:600">${nMismo} ${nMismo === 1 ? 'fue' : 'fueron'} por este mismo color</span>`
    : '<span class="muted">ninguna por este color exacto</span>';

  return `
    <div style="margin-top:12px; padding-top:10px; border-top:1px solid var(--vw-grey-2)">
      <div style="font-size:13px; margin-bottom:6px">
        <strong>📋 Ya consultamos este modelo:</strong> ${previas.length} ${previas.length === 1 ? 'vez' : 'veces'} — ${resumenMismo}
      </div>
      ${filas}
      ${previas.length > MAX ? `<div class="muted" style="font-size:11px; padding-top:6px">y ${previas.length - MAX} más, más viejas.</div>` : ''}
    </div>`;
}

// Bloque "¿Qué hay de lo que piden?" — la respuesta a la pregunta de Fer: me piden un
// auto o un color que no está, ¿qué tengo de eso? Se muestra en las consultas SIN
// DISPONIBILIDAD (y en cualquier item que traiga un color pedido a mano). Cruza el
// modelo+color pedido contra stock, reparto e histórico, y arranca por el veredicto
// para no tener que leer nada más en el 90% de los casos.
function bloqueQueHay(c, it) {
  if (!c || c.origen !== 'sin_disponibilidad') return '';
  const modelo = it.modelo;
  const color = it.color_pedido || '';
  const q = queHayDe(modelo, color);
  const nExacto = q.colorExacto.stock.length;
  const nExactoRep = q.colorExacto.reparto.length;

  // Veredicto de arriba: verde si el auto exacto está, ámbar si está en reparto,
  // violeta si no hay nada de ese color, rojo si no hay nada del modelo entero.
  let veredicto;
  if (nExacto > 0) {
    veredicto = { bg: '#dcfce7', bd: '#86efac', fg: '#166534',
      txt: `✓ Ese auto SÍ está: ${nExacto} ${nExacto === 1 ? 'unidad' : 'unidades'} en stock`,
      sub: 'El vendedor lo cargó como "sin disponibilidad" pero la unidad existe — se puede vender ya.' };
  } else if (nExactoRep > 0) {
    veredicto = { bg: '#fef3c7', bd: '#fcd34d', fg: '#78350f',
      txt: `🚚 Ese auto está EN EL REPARTO: ${nExactoRep} ${nExactoRep === 1 ? 'unidad' : 'unidades'}`,
      sub: 'No hay que pedirle nada al zonal: VW ya nos lo asignó, solo hay que comprarlo.' };
  } else if (q.totalStock === 0 && q.totalReparto === 0) {
    veredicto = { bg: '#fee2e2', bd: '#fca5a5', fg: '#991b1b',
      txt: '✗ De este modelo no tenemos NADA',
      sub: 'Ni una unidad en stock ni en el reparto, en ningún color.' };
  } else {
    veredicto = { bg: '#e0e7ff', bd: '#a5b4fc', fg: '#3730a3',
      txt: `✗ Ese color no está — pero del modelo hay ${q.totalStock} en stock y ${q.totalReparto} en reparto`,
      sub: 'Mirá abajo los colores que sí tenemos, por si le sirve al cliente.' };
  }

  const chips = (arr, vacio) => arr.length
    ? arr.map(x => `<span style="display:inline-block; background:#fff; border:1px solid var(--vw-grey-2); border-radius:12px; padding:3px 10px; margin:3px 5px 3px 0; font-size:12px">${escapeHtml(x.color)}: <strong>${x.n}</strong></span>`).join('')
    : `<span class="muted" style="font-size:12px">${vacio}</span>`;

  // Histórico: ¿VW nos manda este modelo en este color alguna vez? Es lo que decide si
  // vale la pena pedírselo al zonal o si directamente no lo producen para nosotros.
  const h = q.historico;
  const histTxt = !color
    ? ''
    : (h
      ? `Tuvimos <strong>${h.n}</strong> ${h.n === 1 ? 'unidad' : 'unidades'} de <strong>${escapeHtml(modelo)}</strong> en <strong>${escapeHtml(color)}</strong>${h.ultima ? `, la última en <strong>${escapeHtml(new Date(h.ultima + 'T00:00:00').toLocaleDateString('es-AR', { month: 'long', year: 'numeric' }))}</strong>` : ''}. VW nos lo manda.`
      : `<strong>Nunca</strong> tuvimos este modelo en ${escapeHtml(color)} (últimos 18 meses de Oversoft + todo el reparto). Puede que VW no lo produzca en ese color.`);

  return `
    <div style="margin-top:12px; padding-top:10px; border-top:1px solid var(--vw-grey-2)">
      <div style="font-size:13px; margin-bottom:8px"><strong>🔎 Piden:</strong> ${escapeHtml(modelo)}${color ? ` · <strong>${escapeHtml(color)}</strong>` : ''}</div>
      <div style="background:${veredicto.bg}; border:1px solid ${veredicto.bd}; color:${veredicto.fg}; border-radius:8px; padding:10px 12px; margin-bottom:10px">
        <div style="font-weight:700; font-size:13px">${veredicto.txt}</div>
        <div style="font-size:12px; margin-top:3px; opacity:.85">${veredicto.sub}</div>
      </div>
      <div style="font-size:12px; margin-bottom:4px"><strong>📦 De este modelo hay en stock (${q.totalStock}):</strong></div>
      <div style="margin-bottom:8px">${chips(q.otrosColoresStock.concat(q.colorExacto.stock.length ? [{ color: color, n: nExacto }] : []), 'ninguna unidad en stock.')}</div>
      <div style="font-size:12px; margin-bottom:4px"><strong>🚚 En reparto (${q.totalReparto}):</strong></div>
      <div style="margin-bottom:8px">${chips(q.otrosColoresReparto.concat(nExactoRep ? [{ color: color, n: nExactoRep }] : []), 'ninguna unidad en reparto.')}</div>
      ${histTxt ? `<div style="font-size:12px; background:var(--vw-grey-1); border-radius:6px; padding:8px 10px">📅 ${histTxt}</div>` : ''}
    </div>`;
}

function abrirDetalle(consultaId, editMode = false) {
  const list = currentMode === 'admin' ? adminConsultas : myConsultas;
  const c = list.find(x => x.id === consultaId);
  if (!c) return;
  const overlay = document.getElementById('modalOverlay');
  const cont = document.getElementById('modalContent');
  const cliente = c.tipo_cliente === 'particular' ? `${c.cliente_nombre || ''} ${c.cliente_apellido || ''}`.trim() : (c.reventa_nombre || '');
  const showGcia = currentMode === 'admin'; // gcia y % financiación SOLO admin (fngonzalez)
  const itemsHtml = (c.items || []).map((it, i) => {
    // Para items de reparto creados antes del fix, los campos del analisis vienen en null
    // y el modelo guardado puede ser el alias (sin "VW " ni "MY##"). Recalculamos en vivo
    // usando stockData / bt actuales y normalizamos el modelo al canonico para que
    // todos los lookups posteriores (competencia, stock del modelo, ventasMes) matcheen.
    if (it.es_reparto) {
      const canon = resolveModeloCanonico(it.modelo) || it.modelo;
      if (it.oferta_vigente_min == null) {
        const pseudoU = { modelo: canon, esReparto: true, chasisSeleccionados: [], precioPedido: it.precio_pedido };
        const a = calcularAnalisisUnidad(pseudoU);
        if (a) {
          it = { ...it, modelo: canon,
            oferta_vigente_min: a.oferta_vigente_min,
            gcia_vigente_min: a.gcia_vigente_min,
            precio_lista: it.precio_lista || a.precio_lista,
            dto_extra_pedido: a.dto_extra_pedido,
            gcia_resultante: a.gcia_resultante };
        } else {
          it = { ...it, modelo: canon };
        }
      } else if (canon !== it.modelo) {
        it = { ...it, modelo: canon };
      }
    }
    // Admin: la gcia que importa es la de HOY. La guardada la calculo el vendedor con la ganancia
    // blindada (0), asi que recalculamos el analisis en vivo desde stockData. Mantiene el precio
    // pedido; oferta/dto/gcia pasan a reflejar el stock y la ganancia reales del momento.
    if (showGcia && it.precio_pedido != null) {
      const aLive = analisisAdminVivo(it);
      if (aLive) {
        it = { ...it,
          oferta_vigente_min: aLive.oferta_vigente_min,
          gcia_vigente_min: aLive.gcia_vigente_min,
          precio_lista: aLive.precio_lista || it.precio_lista,
          dto_extra_pedido: aLive.dto_extra_pedido,
          gcia_resultante: aLive.gcia_resultante };
      }
    }
    const chasis = (it.chasis || []).map(ch =>
      `<div style="font-size:12px; padding:4px 0; border-bottom:1px dashed var(--vw-grey-2)">
        <strong>${escapeHtml(ch.color || '—')}</strong> · <span class="muted">${escapeHtml(ch.serie || '')}</span>
        ${ch.enReparto ? ' <span class="tag-badge" style="background:#c7d2fe; color:#312e81">EN REPARTO</span>' : ''}
        ${ch.fecha_factura ? `· <span class="muted">Fact ${escapeHtml(ch.fecha_factura)}</span>` : ''}
        · ${fmtMoney(ch.oferta_vigente)}${ch.fuente_oferta === 'stock_limitado' ? ' <span class="tag-badge lim">LIM</span>' : ''}
      </div>`
    ).join('');
    // Stock actual del mismo modelo (solo admin), ordenado de mas viejo a mas nuevo,
    // con los chasis pedidos resaltados.
    let stockHtml = '';
    if (showGcia) {
      const seriesPedidas = new Set((it.chasis || []).map(ch => ch.serie));
      const stockMismoModelo = (stockData || [])
        .filter(r => r.libre && r.modelo === it.modelo)
        .sort((a, b) => {
          if (a.fecha_factura && b.fecha_factura) return a.fecha_factura - b.fecha_factura;
          if (a.fecha_factura) return -1;
          if (b.fecha_factura) return 1;
          return 0;
        });
      const filas = stockMismoModelo.map(r => {
        const pedido = seriesPedidas.has(r.serie);
        const style = pedido ? 'background:#fff3cd; border-left:3px solid var(--orange); padding-left:6px' : '';
        return `<div style="font-size:12px; padding:4px 6px; border-bottom:1px dashed var(--vw-grey-2); ${style}">
          ${pedido ? '<strong>► </strong>' : ''}<strong>${escapeHtml(r.color || '—')}</strong>
          · <span class="muted">${escapeHtml(r.serie)}</span>
          ${r.fecha_factura_str ? `· <span class="muted">${escapeHtml(r.fecha_factura_str)}</span>` : ''}
          ${r.enReparto ? ' <span class="tag-badge" style="background:#c7d2fe; color:#312e81">EN REPARTO</span>' : ''}
          ${r.aRecibir ? ' <span class="tag-badge" style="background:#fbbf24; color:#78350f">A RECIBIR</span>' : ''}
          ${pedido ? ' <span style="color:var(--orange); font-weight:700; font-size:11px">PEDIDO</span>' : ''}
        </div>`;
      }).join('') || '<div class="muted" style="font-size:12px; padding:6px 0">Sin stock libre actual.</div>';
      stockHtml = `
        <div style="margin-top:12px; padding-top:10px; border-top:1px solid var(--vw-grey-2)">
          <div style="font-size:13px; margin-bottom:6px">
            <strong>📦 Stock actual del modelo:</strong> ${stockMismoModelo.filter(r => !r.enReparto).length} chasis libre${stockMismoModelo.filter(r => !r.enReparto).length === 1 ? '' : 's'}${stockMismoModelo.some(r => r.enReparto) ? ` + ${stockMismoModelo.filter(r => r.enReparto).length} en reparto` : ''}
            <span class="muted" style="font-size:11px">(de más viejo a más nuevo)</span>
          </div>
          ${filas}
        </div>
      `;
    }
    // Reparto VW (para reponer) — solo admin, abajo del stock. Muestra si VW ya
    // asigno unidades de este modelo que todavia no entraron a Oversoft: cuantas
    // y desglose por color, separando "disponibles para pedir" de "ya pedidas".
    let repartoStockHtml = '';
    if (showGcia) {
      const ncCur = (((stockData || []).find(s => s.modelo === it.modelo)) || {}).nombreCorto || (resolveModeloCanonico(it.modelo) || null);
      let rep = repartoStockData[it.modelo];
      if (!rep) rep = Object.values(repartoStockData).find(x => (ncCur && x.nombreCorto === ncCur) || x.modelo === (resolveModeloCanonico(it.modelo) || it.modelo));
      const chip = (obj) => Object.keys(obj.colores).sort().map(c =>
        `<span style="display:inline-block; background:#fff; border:1px solid var(--vw-grey-2); border-radius:12px; padding:2px 8px; margin:2px 4px 2px 0; font-size:12px">${escapeHtml(c)}: <strong>${obj.colores[c]}</strong></span>`
      ).join('');
      if (rep && rep.total > 0) {
        const disp = rep.disponibles || { total: 0, colores: {} };
        const ped = rep.pedidas || { total: 0, colores: {} };
        repartoStockHtml = `
          <div style="margin-top:12px; padding-top:10px; border-top:1px solid var(--vw-grey-2)">
            <div style="font-size:13px; margin-bottom:6px">
              <strong>🚚 En reparto (para reponer):</strong> ${rep.total} ${rep.total === 1 ? 'unidad' : 'unidades'}
              <span class="muted" style="font-size:11px">(asignadas por VW, todavía no en Oversoft)</span>
            </div>
            ${disp.total ? `<div style="font-size:12px; padding:3px 0"><strong style="color:var(--green)">Disponibles para pedir (${disp.total}):</strong><br>${chip(disp)}</div>` : ''}
            ${ped.total ? `<div style="font-size:12px; padding:3px 0"><span class="muted">Ya pedidas / en camino (${ped.total}):</span><br>${chip(ped)}</div>` : ''}
          </div>`;
      } else {
        repartoStockHtml = `
          <div style="margin-top:12px; padding-top:10px; border-top:1px solid var(--vw-grey-2)">
            <div style="font-size:13px"><strong>🚚 En reparto:</strong> <span class="muted">sin unidades de este modelo para reponer.</span></div>
          </div>`;
      }
    }
    // Comparativa vs competencia (tu0km y espasaonline) — solo admin, solo si el modelo aparece en el sheet.
    let competenciaHtml = '';
    if (showGcia && competenciaMap[it.modelo]) {
      const comp = competenciaMap[it.modelo];
      const ped = it.precio_pedido;
      const filaComp = (label, precio) => {
        if (!precio || isNaN(precio)) return '';
        const diff = (ped - precio) / precio;
        const isHigher = diff > 0;
        const color = isHigher ? 'var(--red)' : 'var(--green)';
        const pctTxt = (Math.abs(diff) * 100).toFixed(2) + '%';
        const txt = isHigher ? `${pctTxt} más caro` : `${pctTxt} más barato`;
        const dolarDiff = ped - precio;
        const dolarTxt = (dolarDiff >= 0 ? '+' : '−') + fmtMoney(Math.abs(dolarDiff)).replace('$', '$');
        return `
          <div style="display:grid; grid-template-columns:1fr auto auto; gap:10px; padding:6px 6px; border-bottom:1px dashed var(--vw-grey-2); font-size:12px; align-items:center">
            <span><strong>${escapeHtml(label)}</strong> <span class="muted">${fmtMoney(precio)}</span></span>
            <span class="muted" style="font-size:11px">(${dolarTxt})</span>
            <span style="color:${color}; font-weight:600; text-align:right; white-space:nowrap">${txt}</span>
          </div>
        `;
      };
      const filasComp = [filaComp('ElCeroKm', comp.tu0km), filaComp('EspasaOnline', comp.espasa)].filter(Boolean).join('');
      if (filasComp) {
        competenciaHtml = `
          <div style="margin-top:12px; padding-top:10px; border-top:1px solid var(--vw-grey-2)">
            <div style="font-size:13px; margin-bottom:6px">
              <strong>📊 Vs competencia</strong>
              <span class="muted" style="font-size:11px">(comparado con precio pedido ${fmtMoney(ped)})</span>
            </div>
            ${filasComp}
          </div>
        `;
      }
    }
    // Vendidos en el ultimo mes — solo admin, solo si el modelo aparece en la pestaña "bt".
    let ventasMesHtml = '';
    if (showGcia) {
      const v = ventasBtMap[it.modelo];
      if (v != null && !isNaN(v)) {
        ventasMesHtml = `
          <div style="margin-top:8px; padding:6px 8px; background:#e7f1ff; border-left:3px solid var(--vw-blue); border-radius:4px; font-size:12px">
            <strong>📈 Vendidos último mes:</strong> ${v} ${v === 1 ? 'unidad' : 'unidades'} de <strong>${escapeHtml(it.modelo)}</strong>
          </div>`;
      }
    }
    // Rotación del modelo (los comparativos del Baratito) — solo admin. Los datos
    // vienen de la Edge (rotacionData, mismo snapshot del Motor que los precios):
    // vendidos últimos 4 meses COMPLETOS, meses de stock (stock/(vend4/4)) y días
    // en venderse (promedio real últimos 12 meses). Mismos criterios y colores que
    // el panel Baratito de precios.
    let rotacionHtml = '';
    if (showGcia) {
      const ncRot = (((stockData || []).find(s => s.modelo === it.modelo)) || {}).nombreCorto;
      const rot = ncRot ? rotacionData[ncRot] : null;
      if (rot) {
        const MES_ABR = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
        const mesesKeys = [];
        const _hoy = new Date();
        for (let k = 4; k >= 1; k--) {
          const x = new Date(_hoy.getFullYear(), _hoy.getMonth() - k, 1);
          mesesKeys.push(x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0'));
        }
        const vpm = rot.ventasPorMes || {};
        const vend4 = mesesKeys.reduce((a, mk) => a + (Number(vpm[mk]) || 0), 0);
        const celdasMeses = mesesKeys.map(mk =>
          `<div style="text-align:center"><div class="muted" style="font-size:10px">${MES_ABR[parseInt(mk.slice(5), 10) - 1]}</div><div style="font-weight:700">${Number(vpm[mk]) || 0}</div></div>`
        ).join('');
        // meses de stock: mismo criterio que Baratito (ritmo = vend4/4; ∞ si hay stock y 0 ventas)
        const ritmo = vend4 / 4;
        const stockM = Number(rot.stock) || 0;
        let mesesTxt, mesesColor;
        if (ritmo <= 0) { mesesTxt = stockM > 0 ? '∞' : '0 m'; mesesColor = stockM > 0 ? 'var(--red)' : 'var(--vw-grey-3)'; }
        else {
          const mm = stockM / ritmo;
          mesesTxt = mm.toFixed(1).replace('.', ',') + ' m';
          mesesColor = mm > 6 ? 'var(--red)' : (mm >= 3 ? '#d97706' : 'var(--green)');
        }
        // días en venderse (prom 12m + lentos), colores como Baratito: ≤30 verde / ≤60 ámbar / >60 rojo
        const dv = rot.diasVenta || null;
        let diasTxt = '—', diasColor = 'var(--vw-grey-3)', diasSub = 'sin ventas medidas';
        if (dv && dv.diasProm != null) {
          const dd = Math.round(dv.diasProm);
          diasTxt = dd + ' d';
          diasColor = dd > 60 ? 'var(--red)' : (dd > 30 ? '#d97706' : 'var(--green)');
          diasSub = 'prom. sobre ' + (dv.n || 0) + ' venta' + ((dv.n || 0) === 1 ? '' : 's') + ' (12 m)'
            + (dv.lentoN ? ` · ${dv.lentoN} lenta${dv.lentoN === 1 ? '' : 's'} (máx ${Math.round(dv.lentoMax || 0)} d)` : '');
        }
        const caja = (titulo, cuerpo) =>
          `<div style="background:#fff; border:1px solid var(--vw-grey-2); border-radius:6px; padding:8px"><div class="muted" style="font-size:11px; margin-bottom:4px">${titulo}</div>${cuerpo}</div>`;
        rotacionHtml = `
          <div style="margin-top:12px; padding-top:10px; border-top:1px solid var(--vw-grey-2)">
            <div style="font-size:13px; margin-bottom:6px">
              <strong>🔄 Rotación del modelo</strong>
              <span class="muted" style="font-size:11px">(mismos números que el Baratito)</span>
            </div>
            <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:8px; font-size:12px">
              ${caja('Vendidos · últ. 4 meses completos',
                `<div style="display:grid; grid-template-columns:repeat(4,1fr); gap:4px">${celdasMeses}</div>
                 <div style="margin-top:4px; text-align:center"><strong>${vend4}</strong> <span class="muted">total</span></div>`)}
              ${caja('Meses de stock',
                `<div style="font-size:18px; font-weight:700; color:${mesesColor}">${mesesTxt}</div>
                 <div class="muted" style="font-size:11px">${stockM} en stock · ritmo ${ritmo.toFixed(1).replace('.', ',')}/mes</div>`)}
              ${caja('Días en venderse',
                `<div style="font-size:18px; font-weight:700; color:${diasColor}">${diasTxt}</div>
                 <div class="muted" style="font-size:11px">${diasSub}</div>`)}
            </div>
          </div>`;
      }
    }
    const repartoBadge = it.es_reparto
      ? ' <span style="background:#fbbf24; color:#78350f; padding:2px 7px; border-radius:8px; font-size:10px; font-weight:700; margin-left:6px">REPARTO</span>'
      : '';
    // Solo para items viejos de reparto (sin chasis). Los nuevos si traen chasis:
    // la unidad de reparto se elige con serie y color, igual que una de stock.
    const noChasisMsg = (it.es_reparto && !(it.chasis || []).length)
      ? `<div class="muted" style="font-size:12px; padding:6px 0">Sin chasis en stock libre — la unidad viene en reparto.</div>`
      : '';
    // El analisis se calcula igual para reparto y stock (oferta_vigente y gcia salen de cualquier
    // chasis del modelo en stockData, precio_lista override de bt para reparto).
    // Consulta de disponibilidad pura: el vendedor no pidió precio, así que no hay dto
    // ni gcia resultante que mostrar. En vez de cuatro guiones, damos la referencia con
    // la que el admin va a decidir: el precio Baratito del modelo y su ganancia de hoy.
    const refIt = (c.origen === 'sin_disponibilidad' && it.precio_pedido == null) ? refAdminUnidad(it) : null;
    const analisisHtml = refIt
      ? `<div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:10px; font-size:13px">
          <div><span class="muted">Precio pedido:</span> <strong>Solo consulta de disponibilidad</strong></div>
          <div><span class="muted">Precio Baratito hoy:</span> <strong>${fmtMoney(refIt.oferta)}</strong></div>
          <div><span class="muted">Precio de lista:</span> <strong>${fmtMoney(refIt.precio_lista)}</strong></div>
          ${showGcia ? `<div><span class="muted">Gcia a ese precio:</span> <strong style="color:${(refIt.gcia||0) >= 0 ? 'var(--green)' : 'var(--red)'}">${fmtPct(refIt.gcia)}</strong></div>` : ''}
        </div>`
      : `<div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:10px; font-size:13px">
          <div><span class="muted">Precio pedido:</span> <strong>${fmtMoney(it.precio_pedido)}</strong></div>
          <div><span class="muted">Oferta vigente:</span> <strong>${fmtMoney(it.oferta_vigente_min)}</strong></div>
          <div><span class="muted">Dto extra pedido:</span> <strong>${fmtPct(it.dto_extra_pedido)}</strong></div>
          ${showGcia ? `<div><span class="muted">Gcia resultante:</span> <strong style="color:${(it.gcia_resultante||0) >= 0 ? 'var(--green)' : 'var(--red)'}">${fmtPct(it.gcia_resultante)}</strong></div>` : ''}
        </div>`;
    // Últimos precios autorizados de ESTE modelo (solo admin). Referencia para decidir:
    // recorre todas las consultas ya resueltas del mismo modelo y toma el precio que se
    // autorizó en cada una — aceptada → precio_pedido; rechazada/contraoferta → precio_max_admin.
    // El margen se recalcula EN VIVO al precio autorizado con la ganancia real de hoy
    // (analisisAdminVivo), porque la gcia guardada en el item la calculó el vendedor con la
    // ganancia blindada (0) y no sirve. Ordenados por fecha de respuesta, los 3 más recientes.
    let historialHtml = '';
    if (showGcia) {
      const canonCur = resolveModeloCanonico(it.modelo) || it.modelo;
      const autorizados = [];
      (adminConsultas || []).forEach(oc => {
        if (oc.id === c.id) return; // no incluir la consulta abierta
        if (!['aceptada', 'rechazada', 'contraoferta'].includes(oc.estado)) return;
        (oc.items || []).forEach(oit => {
          const canonH = resolveModeloCanonico(oit.modelo) || oit.modelo;
          if (canonH !== canonCur) return;
          const precioAut = oc.estado === 'aceptada' ? oit.precio_pedido : oc.precio_max_admin;
          if (!precioAut) return;
          autorizados.push({ precio: precioAut, fecha: oc.admin_respuesta_at || oc.created_at, estado: oc.estado });
        });
      });
      autorizados.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
      const ultimos3 = autorizados.slice(0, 3);
      if (ultimos3.length) {
        const ESTADO_LBL = { aceptada: 'Aceptada', rechazada: 'Mejor precio', contraoferta: 'Contraoferta' };
        const ESTADO_BG = { aceptada: '#dcfce7;color:#166534', rechazada: '#fee2e2;color:#991b1b', contraoferta: '#fef3c7;color:#92400e' };
        const filas = ultimos3.map(h => {
          const aut = analisisAdminVivo({ modelo: it.modelo, precio_pedido: h.precio, chasis: [] });
          const margen = aut ? aut.gcia_resultante : null;
          const mColor = margen == null ? 'var(--vw-grey-3)' : (margen >= 0 ? 'var(--green)' : 'var(--red)');
          return `<div style="display:grid; grid-template-columns:auto 1fr auto; gap:10px; padding:6px 6px; border-bottom:1px dashed var(--vw-grey-2); font-size:12px; align-items:center">
              <span class="muted" style="font-size:11px; white-space:nowrap">${fmtDate(h.fecha)}</span>
              <span><strong>${fmtMoney(h.precio)}</strong> <span style="background:${ESTADO_BG[h.estado] || '#e5e7eb;color:#374151'}; padding:1px 6px; border-radius:6px; font-size:10px; font-weight:700">${ESTADO_LBL[h.estado] || h.estado}</span></span>
              <span style="color:${mColor}; font-weight:700; text-align:right; white-space:nowrap">${margen == null ? '—' : fmtPct(margen)}</span>
            </div>`;
        }).join('');
        historialHtml = `
          <div style="margin-top:12px; padding-top:10px; border-top:1px solid var(--vw-grey-2)">
            <div style="font-size:13px; margin-bottom:6px">
              <strong>🧾 Últimos precios autorizados</strong>
              <span class="muted" style="font-size:11px">(margen recalculado con la ganancia de hoy)</span>
            </div>
            ${filas}
          </div>`;
      }
    }
    return `
      <div class="card" style="background:var(--vw-grey-1)">
        <h3 style="font-size:14px; margin-bottom:8px">Unidad ${i + 1}: ${escapeHtml(it.modelo)}${repartoBadge}</h3>
        ${chasis}
        ${noChasisMsg}
        ${ventasMesHtml}
        ${analisisHtml}
        ${historialHtml}
        ${competenciaHtml}
        ${rotacionHtml}
        ${showGcia ? bloqueQueHay(c, it) : ''}
        ${showGcia ? historialDisponibilidad(c, it) : ''}
        ${stockHtml}
        ${repartoStockHtml}
      </div>
    `;
  }).join('');

  let financiaTxt = 'No financia';
  if (c.financia) {
    const ent = c.financia_entidad === 'otros' ? (c.financia_entidad_otro || 'otros') : (c.financia_entidad || '');
    financiaTxt = `Sí · ${ent.toUpperCase()} · ${fmtMoney(c.financia_monto)}` + (showGcia && c.financia_pct ? ` (${(c.financia_pct*100).toFixed(1)}%)` : '');
  }
  let vsOtroTxt = c.vs_otro_concesionario === 'si' ? `Sí — ${escapeHtml(c.concesionario_nombre)}: ${fmtMoney(c.concesionario_precio)}`
    : (c.vs_otro_concesionario === 'no_quiere_pasar' ? 'No quiere pasar el concesionario' : 'No');
  let fuenteTxt = c.fuente_dato === 'otro' ? (c.fuente_dato_otro || 'otro') : (c.fuente_dato || '—');

  const isAdmin = currentMode === 'admin';
  const isPending = c.estado === 'pendiente' || c.estado === 'en_gestion';
  const showEditForm = isAdmin && (isPending || editMode);
  // Sin disponibilidad: la respuesta no es "acepto el precio" sino "se consigue o no".
  const esSinDisp = c.origen === 'sin_disponibilidad';
  const btnEliminar = (isAdmin && _esSuperadmin())
    ? `<button onclick="eliminarConsulta(${c.id})" style="background:#991B1B; color:#fff; padding:10px 14px; border-radius:8px; border:none; font-weight:600; cursor:pointer">🗑 Eliminar</button>`
    : '';
  let footerHtml = `${btnEliminar}<button class="btn-secondary" onclick="closeModal()">Cerrar</button>`;
  if (showEditForm) {
    let defaultVal = '';
    let defaultObs = '';
    if (editMode) {
      defaultVal = c.precio_max_admin ? '$' + Math.round(c.precio_max_admin).toLocaleString('es-AR') : '';
      defaultObs = c.observaciones_admin || '';
    } else {
      // Pre-llenar con la oferta vigente actual de la primera unidad para que solo
      // tenga que ajustarla (en vez de tipear desde cero). Si por algun motivo no hay
      // oferta vigente (reparto sin registros en stockData), caemos al precio pedido.
      const first = (c.items && c.items[0]) || null;
      // Base: el precio Baratito del modelo (igual que en stock/reparto, donde se
      // pre-llena con la oferta vigente del chasis). En "sin disponibilidad" no hay
      // chasis, asi que sale del catalogo via refAdminUnidad.
      const refFirst = first ? refAdminUnidad(first) : null;
      const defaultPrecio = (refFirst && refFirst.oferta)
        || (first ? (first.oferta_vigente_min || first.precio_pedido) : null);
      defaultVal = defaultPrecio ? '$' + Math.round(defaultPrecio).toLocaleString('es-AR') : '';
    }
    const cancelBtn = editMode
      ? `<button class="btn-secondary" onclick="abrirDetalle(${c.id}, false)">Cancelar</button>`
      : `<button class="btn-secondary" onclick="closeModal()">Cancelar</button>`;
    const editBanner = editMode
      ? `<div style="background:#fff3cd; border:1px solid #f59e0b; border-radius:8px; padding:8px 12px; font-size:13px; color:#7c2d12">✏️ Editando respuesta — al guardar se reenviará el WhatsApp al vendedor.</div>`
      : '';
    footerHtml = `
      <div style="display:flex; flex-direction:column; gap:10px; width:100%">
        ${editBanner}
        <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start">
          <div style="flex:1; min-width:240px">
            <label style="display:block; font-size:12px; color:var(--vw-grey-4); margin-bottom:4px">${esSinDisp ? 'Precio autorizado si se consigue (opcional, con FyF)' : 'Mejor precio máximo (con FyF)'}</label>
            <input id="adminPrecioMax" type="text" inputmode="numeric" placeholder="$0"
              value="${defaultVal}"
              oninput="onAdminPrecioMaxInput(${c.id}, this)"
              style="width:100%; padding:14px; border:2px solid var(--vw-grey-2); border-radius:8px; font-size:20px; font-weight:600; letter-spacing:0.5px">
            <div id="adminPrecioMaxWords" style="font-size:13px; color:var(--vw-grey-4); margin-top:6px; min-height:18px; font-style:italic"></div>
            <div id="adminPrecioMaxHint" class="field-hint"></div>
          </div>
          <div style="flex:2; min-width:240px">
            <!-- Comentario COLAPSADO por defecto (pedido de Fer 3-jul: en el celu el
                 textarea fijo achicaba el área scrolleable del detalle). Si se está
                 editando una respuesta que YA tiene comentario, arranca abierto.
                 El textarea queda siempre en el DOM (display:none) porque
                 aceptar/rechazar/contraofertar leen #adminObs.value. -->
            <button id="adminObsToggle" type="button" onclick="toggleAdminObs()"
              style="display:${(defaultObs || '').trim() ? 'none' : 'inline-block'}; background:none; border:1px dashed var(--vw-grey-2); border-radius:8px; padding:8px 12px; font-size:13px; color:var(--vw-grey-4); cursor:pointer">💬 Comentario (opcional)</button>
            <div id="adminObsWrap" style="display:${(defaultObs || '').trim() ? 'block' : 'none'}">
              <label style="display:block; font-size:12px; color:var(--vw-grey-4); margin-bottom:4px">Comentario (opcional)
                <a onclick="toggleAdminObs()" style="cursor:pointer; margin-left:6px; font-size:11px; color:var(--vw-blue)">ocultar</a>
              </label>
              <textarea id="adminObs" rows="3" placeholder="Ej: Acepto el precio pero con la unidad gris más vieja del stock"
                style="width:100%; padding:10px; border:2px solid var(--vw-grey-2); border-radius:8px; font-size:14px; font-family:inherit; resize:vertical">${escapeHtml(defaultObs)}</textarea>
            </div>
          </div>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:space-between; align-items:center">
          ${_esSuperadmin() ? `<button onclick="eliminarConsulta(${c.id})" style="background:#991B1B; color:#fff; padding:10px 14px; border-radius:8px; border:none; font-weight:600; cursor:pointer">🗑 Eliminar</button>` : '<div></div>'}
          <div style="display:flex; gap:8px; flex-wrap:wrap">
            ${cancelBtn}
            ${esSinDisp ? `
              ${c.estado === 'en_gestion' ? '' : `<button onclick="marcarEnGestion(${c.id})" style="background:#ede9fe; color:#5b21b6; padding:10px 16px; border-radius:8px; border:1px solid #c4b5fd; font-weight:600; cursor:pointer">⏳ En gestión con el zonal</button>`}
              <button class="btn-danger" onclick="responderDisponibilidad(${c.id}, false)">✗ No se consigue</button>
              <button class="btn-success" onclick="responderDisponibilidad(${c.id}, true)">✓ Se consigue</button>
            ` : `
              <button class="btn-danger" onclick="rechazarMejora(${c.id})">No acepto</button>
              <button onclick="contraofertarMejora(${c.id})" style="background:#3730a3; color:#fff; padding:10px 18px; border-radius:8px; border:none; font-weight:600; cursor:pointer">Contraofertar</button>
              <button class="btn-success" onclick="aceptarMejora(${c.id})">Aceptar mejora</button>
            `}
          </div>
        </div>
      </div>
    `;
  }

  cont.innerHTML = `
    <div class="modal-header">
      <h2>#${c.id} — ${escapeHtml(cliente)}</h2>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="detalle-section">
        <h4>Vendedor</h4>
        <div class="kv"><span class="k">Nombre</span><span class="v">${escapeHtml(c.vendedor_nombre || c.vendedor_usuario || '')}</span></div>
        ${c.cargada_por_nombre ? `<div class="kv"><span class="k">Cargada por</span><span class="v">${escapeHtml(c.cargada_por_nombre)}</span></div>` : ''}
        <div class="kv"><span class="k">Fecha</span><span class="v">${fmtDate(c.created_at)}</span></div>
        <div class="kv"><span class="k">Estado</span><span class="v"><span class="estado ${c.estado}">${txtEstado(c.estado)}</span></span></div>
        <div class="kv"><span class="k">Origen</span><span class="v">${ORIGEN_LABEL[c.origen] || ORIGEN_LABEL.stock}</span></div>
      </div>
      <div class="detalle-section">
        <h4>Cliente</h4>
        <div class="kv">
          <span class="k">Tipo</span><span class="v">${c.tipo_cliente === 'particular' ? 'Particular' : 'Reventa'}</span>
          ${c.tipo_cliente === 'particular' ? `
            <span class="k">Nombre</span><span class="v">${escapeHtml((c.cliente_nombre||'') + ' ' + (c.cliente_apellido||''))}</span>
            <span class="k">Fuente dato</span><span class="v">${escapeHtml(fuenteTxt)}</span>
            <span class="k">Tiene usado</span><span class="v">${c.tiene_usado ? 'Sí' : 'No'}</span>
          ` : `
            <span class="k">Reventa</span><span class="v">${escapeHtml(c.reventa_nombre || '')}</span>
          `}
          <span class="k">Provincia</span><span class="v">${escapeHtml(c.provincia || '')}</span>
          <span class="k">Localidad</span><span class="v">${escapeHtml(c.localidad || '')}</span>
          <span class="k">Financiación</span><span class="v">${financiaTxt}</span>
          <span class="k">VS otro presupuesto</span><span class="v">${vsOtroTxt}</span>
        </div>
      </div>
      <div class="detalle-section">
        <h4>Unidades</h4>
        ${itemsHtml || '<div class="muted">—</div>'}
      </div>
      ${(c.observaciones_vendedor || '').trim() ? `
        <div class="detalle-section">
          <h4>Observaciones del vendedor</h4>
          <div style="white-space:pre-wrap; padding:4px 0">${escapeHtml(c.observaciones_vendedor)}</div>
        </div>
      ` : ''}
      ${(!isPending && !editMode && (isAdmin || c.precio_max_admin || c.observaciones_admin)) ? `
        <div class="detalle-section">
          <h4>Respuesta</h4>
          <div class="kv">
            <span class="k">Estado</span><span class="v"><span class="estado ${c.estado}">${txtEstado(c.estado)}</span></span>
            ${c.disponibilidad ? `<span class="k">¿Se consigue?</span><span class="v"><strong style="color:${c.disponibilidad === 'se_consigue' ? 'var(--green)' : 'var(--red)'}">${c.disponibilidad === 'se_consigue' ? 'Sí, se consigue' : 'No se consigue'}</strong></span>` : ''}
            ${c.precio_max_admin ? `<span class="k">${c.origen === 'sin_disponibilidad' ? 'Precio autorizado' : 'Mejor precio máx'}</span><span class="v">${fmtMoney(c.precio_max_admin)}</span>` : ''}
            ${c.admin_respuesta_at ? `<span class="k">Respondido</span><span class="v">${fmtDate(c.admin_respuesta_at)}</span>` : ''}
          </div>
          ${(c.observaciones_admin || '').trim() ? `
            <div style="margin-top:10px">
              <div style="font-size:12px; color:var(--vw-grey-4); margin-bottom:4px">Comentario del administrador</div>
              <div style="white-space:pre-wrap; padding:8px; background:var(--vw-grey-1); border-radius:6px">${escapeHtml(c.observaciones_admin)}</div>
            </div>
          ` : ''}
          ${isAdmin ? `
            <div style="margin-top:12px; display:flex; justify-content:flex-end">
              <button onclick="abrirDetalle(${c.id}, true)" class="btn-secondary" style="font-size:13px; padding:8px 14px">✏️ Editar respuesta</button>
            </div>
          ` : ''}
        </div>
      ` : ''}
      ${renderResultadoVentaSection(c)}
    </div>
    <div class="modal-footer">${footerHtml}</div>
  `;
  overlay.classList.remove('hidden');
  // Si admin tiene una pendiente con precio pre-llenado, calcular el hint inicial.
  // Tambien aplica al modo edicion (admin reabriendo una resuelta para modificarla).
  if (showEditForm) {
    setTimeout(() => {
      const el = document.getElementById('adminPrecioMax');
      if (el && el.value) onAdminPrecioMaxInput(c.id, el);
    }, 0);
  }
}
function closeModal() { document.getElementById('modalOverlay').classList.add('hidden'); }

// Muestra/oculta el textarea de comentario del admin (colapsado por defecto para
// ganar espacio vertical en el celular). El contenido nunca se pierde: solo se
// togglea el display; #adminObs sigue en el DOM y las acciones leen su value.
function toggleAdminObs() {
  const wrap = document.getElementById('adminObsWrap');
  const btn = document.getElementById('adminObsToggle');
  if (!wrap || !btn) return;
  const abrir = wrap.style.display === 'none';
  wrap.style.display = abrir ? 'block' : 'none';
  btn.style.display = abrir ? 'none' : 'inline-block';
  if (abrir) { const ta = document.getElementById('adminObs'); if (ta) ta.focus(); }
}

function onAdminPrecioMaxInput(consultaId, el) {
  const raw = el.value.replace(/[^\d]/g, '');
  el.value = raw ? '$' + parseInt(raw, 10).toLocaleString('es-AR') : '';
  const wordsDiv = document.getElementById('adminPrecioMaxWords');
  if (wordsDiv) {
    const t = numToTextES(raw ? parseInt(raw, 10) : 0);
    wordsDiv.textContent = t ? `≈ ${t}` : '';
  }
  const hint = document.getElementById('adminPrecioMaxHint');
  const c = adminConsultas.find(x => x.id === consultaId);
  if (!c || !c.items || c.items.length === 0) { hint.textContent = ''; return; }
  if (!raw) { hint.textContent = ''; return; }
  const precio = parseInt(raw, 10);
  const it = c.items[0];
  // Gcia/oferta de HOY (no la guardada por el vendedor con ganancia blindada). En
  // "sin disponibilidad" el modelo puede no tener ninguna unidad: refAdminUnidad cae
  // al catalogo (precio Baratito del modelo) para que igual haya margen.
  const ref = refAdminUnidad(it);
  if (!ref || !ref.precio_lista || ref.precio_lista <= 0) { hint.textContent = ''; return; }
  const oferta_vigente = ref.oferta;
  const precio_lista = ref.precio_lista;
  const gcia_vigente = ref.gcia;
  const dto = (oferta_vigente - precio) / precio_lista;
  const gcia = (gcia_vigente || 0) - dto;
  hint.innerHTML = `Con ${fmtMoney(precio)}: dto extra ${fmtPct(dto)} · <strong style="color:${gcia>=0?'var(--green)':'var(--red)'}">gcia ${fmtPct(gcia)}</strong>`;
}

// ---------- Resultado de venta (lo marca el vendedor) ----------
function renderResultadoVentaSection(c) {
  const esVendedor = currentMode === 'vendedor' || currentMode === 'gerente';
  const yaCargado = !!c.resultado_venta;
  // No mostrar nada cuando todavia esta pendiente y nadie cargo resultado.
  // Si ya hay resultado cargado, mostrarlo siempre (vendedor y admin).
  if (!yaCargado && !esVendedor) return '';
  if (!yaCargado && c.estado === 'pendiente') return ''; // todavia no respondida, no tiene sentido cargar venta

  if (yaCargado) {
    const esVendida = c.resultado_venta === 'vendida';
    const badge = esVendida
      ? `<span style="background:#d1fae5; color:#065f46; padding:4px 10px; border-radius:20px; font-size:12px; font-weight:600">✓ VENDIDA</span>`
      : `<span style="background:#fee2e2; color:#991b1b; padding:4px 10px; border-radius:20px; font-size:12px; font-weight:600">✗ NO VENDIDA</span>`;
    return `
      <div class="detalle-section">
        <h4>Resultado de venta</h4>
        <div class="kv">
          <span class="k">Resultado</span><span class="v">${badge}</span>
          ${c.resultado_venta_at ? `<span class="k">Cargado</span><span class="v">${fmtDate(c.resultado_venta_at)}</span>` : ''}
        </div>
        ${(c.motivo_no_venta || '').trim() ? `
          <div style="margin-top:10px">
            <div style="font-size:12px; color:var(--vw-grey-4); margin-bottom:4px">Motivo</div>
            <div style="white-space:pre-wrap; padding:8px; background:var(--vw-grey-1); border-radius:6px">${escapeHtml(c.motivo_no_venta)}</div>
          </div>
        ` : ''}
      </div>
    `;
  }
  // Vendedor con consulta respondida y sin resultado todavia: mostrar botones
  return `
    <div class="detalle-section">
      <h4>Resultado de venta</h4>
      <p style="font-size:13px; color:var(--vw-grey-4); margin-bottom:10px">¿Cómo terminó esta consulta con el cliente?</p>
      <div id="resultadoVentaActions" style="display:flex; gap:8px; flex-wrap:wrap">
        <button onclick="marcarVendida(${c.id})" style="background:#16a34a; color:#fff; padding:10px 18px; border-radius:8px; border:none; font-weight:600; cursor:pointer">✓ Sí, se vendió</button>
        <button onclick="mostrarMotivoNoVenta(${c.id})" style="background:#dc2626; color:#fff; padding:10px 18px; border-radius:8px; border:none; font-weight:600; cursor:pointer">✗ No se vendió</button>
      </div>
      <div id="resultadoVentaMotivo" class="hidden" style="margin-top:12px">
        <label style="display:block; font-size:12px; color:var(--vw-grey-4); margin-bottom:4px">Motivo (obligatorio)</label>
        <textarea id="motivoNoVentaTxt" rows="3" placeholder="Ej: el cliente decidió comprar otra marca, no le alcanzaba el descuento, se cayó la financiación..."
          style="width:100%; padding:10px; border:2px solid var(--vw-grey-2); border-radius:8px; font-size:14px; font-family:inherit; resize:vertical"></textarea>
        <div style="display:flex; gap:8px; margin-top:8px; justify-content:flex-end">
          <button onclick="ocultarMotivoNoVenta()" class="btn-secondary">Cancelar</button>
          <button onclick="marcarNoVendida(${c.id})" style="background:#dc2626; color:#fff; padding:10px 18px; border-radius:8px; border:none; font-weight:600; cursor:pointer">Guardar motivo</button>
        </div>
      </div>
    </div>
  `;
}

// ============================================================================
// ============ CONSULTAS DE USADOS ===========================================
// ============================================================================
// Mismo circuito que las de 0km (el vendedor pide mejor precio, el admin acepta
// / rechaza / contraoferta) pero sobre una unidad usada concreta del stock.
//
// Diferencias de fondo con el 0km, todas pedidas por Fer (19/08/2026):
//  - SIN el analisis de atras (competencia, rotacion, stock del modelo, reparto,
//    ventas del mes). Un usado es una unidad unica: no hay "otros chasis" ni
//    ritmo de venta del modelo. Lo unico que se analiza es LA GANANCIA NUEVA.
//  - El costo es el de OVERSOFT (`usados.preciodetoma`), lo que se tomo real.
//    No se cae al precio del tasador. Si Oversoft no lo tiene, se dice.
//  - Historial POR UNIDAD (usadoid), no por modelo: "si antes pase contraofertas
//    por ese usado, que me figuren".
//
// COSTO BLINDADO: el costo y el margen NUNCA se guardan en `consultas_usados`
// ni viajan al browser del vendedor. La tabla no tiene columna de costo a
// proposito (RLS esta deshabilitado y el vendedor lee la tabla con la anon key:
// cualquier columna que guardemos ahi la puede ver). El margen se calcula en
// vivo, en la pantalla del admin, contra el costo que devuelve la Edge Function
// `usados-disponibles` solo a los usuarios autorizados.

const USADOS_EDGE_URL = SUPABASE_URL + '/functions/v1/usados-disponibles';

// ---------- Seccion activa (0km / usados) ----------
function setSeccion(s) {
  seccion = s;
  document.getElementById('tabSec0km').classList.toggle('active', s === '0km');
  document.getElementById('tabSecUsados').classList.toggle('active', s === 'usados');
  // Salir del wizard si estaba abierto (el flujo del otro tipo no aplica)
  const wiz = document.getElementById('vendedorWizard');
  const lst = document.getElementById('vendedorList');
  if (wiz && !wiz.classList.contains('hidden')) {
    wiz.classList.add('hidden');
    if (lst) lst.classList.remove('hidden');
  }
  const search0 = document.getElementById('vSearch');
  if (search0) search0.value = '';
  const searchA = document.getElementById('aSearch');
  if (searchA) searchA.value = '';
  if (currentMode === 'admin') {
    // La seleccion multiple (borrado masivo) es solo del 0km: si estaba activa,
    // apagarla al cambiar de seccion para no dejar la barra roja colgada.
    if (_selMultipleActivo) toggleSelMultiple();
    else _selMultipleIds.clear();
    // El boton de seleccion multiple no aplica en usados
    const btnSel = document.getElementById('btnSelMultiple');
    if (btnSel) btnSel.classList.toggle('hidden', s === 'usados' || !_esSuperadmin());
    if (s === 'usados') cargarConsultasAdminUsados(); else cargarConsultasAdmin();
  } else {
    if (s === 'usados') cargarMisConsultasUsados(); else cargarMisConsultas();
  }
}

// El boton "+ Nueva consulta" abre el wizard que corresponda a la seccion.
function nuevaConsultaDispatch() {
  return seccion === 'usados' ? showNuevaConsultaUsado() : showNuevaConsulta();
}

// ---------- Stock de usados ----------
// Manda las credenciales del logueado: la Edge devuelve el costo de toma SOLO
// si es uno de los usuarios autorizados (mismo patron que stock-disponible).
async function cargarUsadosStock(forzar = false) {
  if (usadosStockCargado && !forzar) return;
  const creds = (currentUser && currentUser.usuario && currentUser.clave)
    ? { usuario: currentUser.usuario, clave: currentUser.clave } : {};
  const res = await fetch(USADOS_EDGE_URL, {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(creds)
  });
  if (!res.ok) throw new Error('usados-disponibles ' + res.status);
  const data = await res.json();
  if (!data || data.ok === false) throw new Error(data && data.error ? data.error : 'respuesta inválida');
  usadosStock = data.usados || [];
  usadosCostoOk = !!data.costoIncluido;
  usadosStockCargado = true;
}

function getUsadoStock(usadoid) {
  return usadosStock.find(u => Number(u.usadoid) === Number(usadoid)) || null;
}

// Texto corto de la unidad para titulos y listas.
function tituloUsadoStock(u) {
  if (!u) return '—';
  return u.patente ? `${u.unidad} (${u.patente})` : u.unidad;
}

function badgeEstadoUsado(estado) {
  return estado === 'a_recibir'
    ? '<span style="background:#fef3c7; color:#92400e; padding:2px 7px; border-radius:8px; font-size:10px; font-weight:700">A RECIBIR</span>'
    : '<span style="background:#dbeafe; color:#1e40af; padding:2px 7px; border-radius:8px; font-size:10px; font-weight:700">FÍSICO</span>';
}

// ---------- Analisis de margen (SOLO admin) ----------
// Definicion de margen de Fer: (venta - costo) / costo. Ej: costo 10M, venta 15M
// = 50%. Al lado se muestra el margen sobre la venta (33,3%), que es el contable.
// `arreglos` viene del analisis fisico del tasador y es informativo: se muestra
// como segunda linea, nunca pisa el numero principal (el costo de Oversoft).
function margenUsado(precio, costo) {
  if (!costo || costo <= 0 || !precio || precio <= 0) return null;
  return {
    pesos: precio - costo,
    sobreCosto: (precio - costo) / costo,
    sobreVenta: (precio - costo) / precio
  };
}

function colorMargen(m) {
  if (!m) return 'var(--vw-grey-4)';
  if (m.sobreCosto < 0) return 'var(--red)';
  if (m.sobreCosto < 0.10) return '#b45309';
  return 'var(--green)';
}

// Bloque de analisis del admin: la ganancia de hoy vs la ganancia con el precio
// pedido. Es LO UNICO que se analiza (pedido explicito de Fer: sin el resto).
function analisisUsadoHtml(c, precioPedido) {
  const u = getUsadoStock(c.usadoid);
  if (!usadosCostoOk) return '';
  if (!u) {
    return `<div style="background:#fee2e2; border-radius:8px; padding:10px 12px; font-size:13px; color:#991b1b; margin-top:10px">
      ⚠ La unidad ya no figura en el stock de usados (se vendió, se ocultó o quedó fuera de la ventana). No se puede calcular el margen actual.
    </div>`;
  }
  const costo = Number(u.costo_toma) || 0;
  const arreglos = Number(u.arreglos) || 0;
  const publicado = Number(u.precio_venta) || Number(c.precio_publicado) || 0;
  const pedido = Number(precioPedido) || Number(c.precio_pedido) || 0;

  if (!costo) {
    return `<div style="background:#fef3c7; border-radius:8px; padding:10px 12px; font-size:13px; color:#92400e; margin-top:10px">
      ⚠ Esta unidad <strong>no tiene costo de toma cargado en Oversoft</strong>, así que no se puede calcular la ganancia. Cargalo en el sistema y volvé a abrir.
    </div>`;
  }

  const mAct = margenUsado(publicado, costo);
  const mPed = margenUsado(pedido, costo);
  const fila = (lbl, precio, m) => `
    <div style="display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:6px 0">
      <span style="font-size:13px; color:var(--vw-grey-4)">${lbl}</span>
      <span style="font-size:13px; text-align:right">
        <strong>${fmtMoney(precio)}</strong>
        ${m ? ` · <strong style="color:${colorMargen(m)}">${(m.sobreCosto*100).toFixed(1)}%</strong>
          <span style="color:var(--vw-grey-3); font-size:11px">(${fmtMoney(m.pesos)} · ${(m.sobreVenta*100).toFixed(1)}% s/venta)</span>` : ''}
      </span>
    </div>`;

  // Segunda lectura, solo si el tasador cargo arreglos: mismo margen pero
  // sumando el costo de los arreglos al costo de toma.
  let conArreglosHtml = '';
  if (arreglos > 0) {
    const costoTotal = costo + arreglos;
    const mPedArr = margenUsado(pedido, costoTotal);
    conArreglosHtml = `
      <div style="margin-top:8px; padding-top:8px; border-top:1px dashed var(--vw-grey-2)">
        <div style="font-size:11px; color:var(--vw-grey-3); margin-bottom:2px">
          Con arreglos del análisis físico (${fmtMoney(arreglos)}, dato del tasador) → costo ${fmtMoney(costoTotal)}
        </div>
        ${mPedArr ? `<div style="font-size:13px">Con el precio pedido quedaría en
          <strong style="color:${colorMargen(mPedArr)}">${(mPedArr.sobreCosto*100).toFixed(1)}%</strong>
          (${fmtMoney(mPedArr.pesos)})</div>` : ''}
      </div>`;
  }

  const caida = (mAct && mPed) ? (mAct.pesos - mPed.pesos) : null;

  return `
    <div style="background:#f0f9ff; border:1px solid #bae6fd; border-radius:8px; padding:12px; margin-top:10px">
      <div style="font-size:12px; font-weight:700; color:#0369a1; margin-bottom:6px">💰 GANANCIA</div>
      <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--vw-grey-4); padding-bottom:6px; border-bottom:1px solid #bae6fd">
        <span>Costo de toma (Oversoft)</span><strong>${fmtMoney(costo)}</strong>
      </div>
      ${fila('Precio publicado hoy', publicado, mAct)}
      ${fila('Con el precio pedido', pedido, mPed)}
      ${caida !== null ? `<div style="font-size:12px; color:var(--vw-grey-4); padding-top:6px; border-top:1px solid #bae6fd">
        Resigna <strong style="color:var(--red)">${fmtMoney(caida)}</strong> de ganancia</div>` : ''}
      ${conArreglosHtml}
    </div>`;
}

// ---------- Historial de la MISMA unidad ----------
// Pedido de Fer: "si antes pasé contraofertas por ese usado, que me figuren".
// A diferencia del 0km (que cruza por modelo), acá el cruce es por usadoid: es
// la misma unidad fisica, asi que lo que se autorizo antes es directamente
// comparable. Se listan todas las consultas ya respondidas de ese usado.
function historialUsadoHtml(c) {
  const previas = adminConsultasUsados
    .filter(x => Number(x.usadoid) === Number(c.usadoid) && x.id !== c.id)
    .filter(x => ['aceptada','rechazada','contraoferta'].includes(x.estado))
    .sort((a,b) => new Date(b.admin_respuesta_at || b.created_at) - new Date(a.admin_respuesta_at || a.created_at));
  if (previas.length === 0) return '';

  const ESTADO_LBL = { aceptada: 'Aceptada', rechazada: 'Mejor precio', contraoferta: 'Contraoferta' };
  const ESTADO_BG = { aceptada: '#dcfce7;color:#166534', rechazada: '#fee2e2;color:#991b1b', contraoferta: '#fef3c7;color:#92400e' };
  const u = getUsadoStock(c.usadoid);
  const costo = usadosCostoOk && u ? (Number(u.costo_toma) || 0) : 0;

  const filas = previas.map(p => {
    // El precio "autorizado": si la acepto, lo que pidio el vendedor; si no, el
    // precio que puso el admin (mejor precio o contraoferta).
    const precio = p.estado === 'aceptada' ? Number(p.precio_pedido) : Number(p.precio_max_admin);
    const m = costo && precio ? margenUsado(precio, costo) : null;
    return `
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--vw-grey-1); flex-wrap:wrap">
        <div style="font-size:12px; color:var(--vw-grey-4); min-width:120px">
          ${fmtFechaCorta(new Date(p.admin_respuesta_at || p.created_at))} ·
          ${escapeHtml(p.vendedor_nombre || p.vendedor_usuario || '—')}
        </div>
        <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap">
          <span style="background:${ESTADO_BG[p.estado]}; padding:2px 8px; border-radius:10px; font-size:10px; font-weight:700">${ESTADO_LBL[p.estado]}</span>
          <strong style="font-size:13px">${precio ? fmtMoney(precio) : '—'}</strong>
          ${m ? `<span style="font-size:11px; color:${colorMargen(m)}">${(m.sobreCosto*100).toFixed(1)}%</span>` : ''}
          ${p.resultado_venta === 'vendida' ? '<span style="font-size:10px; color:#065f46">✓ vendida</span>' : ''}
          ${p.resultado_venta === 'no_vendida' ? '<span style="font-size:10px; color:#991b1b">✗ no vendida</span>' : ''}
        </div>
      </div>`;
  }).join('');

  return `
    <div style="background:var(--vw-grey-1); border-radius:8px; padding:12px; margin-top:10px">
      <div style="font-size:12px; font-weight:700; color:var(--vw-blue); margin-bottom:4px">
        🧾 YA PASARON POR ESTA UNIDAD (${previas.length})
      </div>
      <div style="font-size:11px; color:var(--vw-grey-3); margin-bottom:6px">
        Consultas anteriores del <strong>mismo usado</strong>${costo ? '. El % es el margen recalculado con el costo de hoy.' : '.'}
      </div>
      ${filas}
    </div>`;
}

// ---------- Wizard del vendedor ----------

  };
