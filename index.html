function selectOrigen(o) {
  if (!ORIGENES.includes(o)) return;
  // Cambiar de origen invalida los modelos/colores ya elegidos: el listado es otro.
  if (formData.origen && formData.origen !== o) {
    formData.unidades.forEach(u => { u.modelo = null; u.chasisSeleccionados = []; u.colorPedido = null; u.esReparto = false; u.precioPedido = null; });
    formData.pvVendida = null;
  }
  formData.origen = o;
  formData.subtipo = null; // cada origen tiene su propia segunda pregunta
  renderStep();
  setTimeout(() => nextStep(), 150);
}

// ----- Qué tipo de unidad del reparto (solo si el origen es "reparto") -----
// Antes de desplegar las 24 unidades, el vendedor acota: o busca un modelo que no
// tenemos en absoluto, o busca otro color de un modelo que sí está en el salón. Son
// dos conversaciones distintas con el cliente y conviene no mezclarlas.
STEP_RENDERERS['reparto-tipo'] = () => {
  const sinStock = getModelosDisponibles('reparto', 'sin_stock');
  const otroColor = getModelosDisponibles('reparto', 'otro_color');
  const uSin = sinStock.reduce((a, m) => a + m.cantRepartoNuevo, 0);
  const uOtro = otroColor.reduce((a, m) => a + m.cantRepartoNuevo, 0);
  const sel = (t) => formData.subtipo === t ? 'selected' : '';
  const plural = (n, s, p) => `${n} ${n === 1 ? s : p}`;
  return {
    body: `
      <h2>¿Qué estás buscando en el reparto?</h2>
      <p class="step-hint">Las dos listas son de unidades que VW ya nos asignó y todavía no tenemos.</p>
      <div class="opt-list">
        <div class="opt ${sel('sin_stock')}" onclick="selectSubtipo('sin_stock')">
          <span class="opt-icon">🚫</span>
          <div>
            <div><strong>Un modelo que no tenemos en stock</strong></div>
            <div class="muted" style="font-size:12px; margin-top:2px">${sinStock.length === 0
              ? 'Ahora mismo no hay ninguno: de todos los modelos del reparto tenemos al menos una unidad.'
              : `${plural(uSin, 'unidad', 'unidades')} en ${plural(sinStock.length, 'modelo', 'modelos')} de los que no hay ni una en el salón: ${sinStock.map(m => escapeHtml(m.modelo.replace(/^VW /, ''))).join(' · ')}.`}</div>
          </div>
        </div>
        <div class="opt ${sel('otro_color')}" onclick="selectSubtipo('otro_color')">
          <span class="opt-icon">🎨</span>
          <div>
            <div><strong>Otro color de un modelo que sí tenemos</strong></div>
            <div class="muted" style="font-size:12px; margin-top:2px">${otroColor.length === 0
              ? 'Ahora mismo no hay ninguno: el reparto no trae colores distintos a los del salón.'
              : `${plural(uOtro, 'unidad', 'unidades')} en ${plural(otroColor.length, 'modelo', 'modelos')}, en colores que hoy no están en stock.`}</div>
          </div>
        </div>
      </div>
    `,
    footer: `<button class="btn-back" onclick="wizardBack()">Atrás</button>`
  };
};

// Sirve para las dos segundas preguntas (reparto y sin disponibilidad).
function selectSubtipo(t) {
  // Cambiar de subtipo invalida lo elegido: el listado que sigue es otro.
  if (formData.subtipo && formData.subtipo !== t) {
    formData.unidades.forEach(u => { u.modelo = null; u.chasisSeleccionados = []; u.colorPedido = null; u.precioPedido = null; u.esReparto = false; });
  }
  formData.subtipo = t;
  renderStep();
  setTimeout(() => nextStep(), 150);
}

// ----- Qué tipo de unidad sin disponibilidad (solo si el origen es "sin disponibilidad") -----
// Misma idea que en reparto: antes de desplegar los 46 modelos, el vendedor acota. O
// busca un auto que no tenemos en absoluto, o busca un color que le falta a un modelo
// que sí está. Son dos pedidos distintos al zonal.
STEP_RENDERERS['sd-tipo'] = () => {
  const ninguno = getModelosDisponibles('sin_disponibilidad', 'sin_ninguno');
  const otroColor = getModelosDisponibles('sin_disponibilidad', 'otro_color');
  const colores = otroColor.reduce((a, m) => a + (m.cantColoresSD || 0), 0);
  const sel = (t) => formData.subtipo === t ? 'selected' : '';
  const plural = (n, s, p) => `${n} ${n === 1 ? s : p}`;
  return {
    body: `
      <h2>¿Qué estás buscando?</h2>
      <p class="step-hint">Las dos listas son de autos que no están disponibles: hay que preguntarle a gerencia si se consiguen.</p>
      <div class="opt-list">
        <div class="opt ${sel('sin_ninguno')}" onclick="selectSubtipo('sin_ninguno')">
          <span class="opt-icon">🚫</span>
          <div>
            <div><strong>Un modelo que no tenemos</strong></div>
            <div class="muted" style="font-size:12px; margin-top:2px">${ninguno.length === 0
              ? 'Ahora mismo no hay ninguno: de todos los modelos tenemos al menos una unidad, en stock o en el reparto.'
              : `${plural(ninguno.length, 'modelo', 'modelos')} de los que no hay ni una unidad, ni en el salón ni en el reparto.`}</div>
          </div>
        </div>
        <div class="opt ${sel('otro_color')}" onclick="selectSubtipo('otro_color')">
          <span class="opt-icon">🎨</span>
          <div>
            <div><strong>Un color que no tenemos, de un modelo que sí</strong></div>
            <div class="muted" style="font-size:12px; margin-top:2px">${otroColor.length === 0
              ? 'Ahora mismo no hay ninguno: de los modelos que tenemos, están todos sus colores.'
              : `${plural(otroColor.length, 'modelo', 'modelos')} con unidades en stock o en el reparto, pero a los que les faltan ${plural(colores, 'color', 'colores')} en total.`}</div>
          </div>
        </div>
      </div>
    `,
    footer: `<button class="btn-back" onclick="wizardBack()">Atrás</button>`
  };
};

// ----- Color pedido (solo origen "sin disponibilidad") -----
// Lista SOLO los colores que no están ni en stock ni en el reparto — pedir uno que ya
// está no tiene sentido. Y no se inventa ninguno: la lista sale de lo que VW nos
// facturó o nos ofreció en un reparto (Oversoft + compras_vw + reparto_vw +
// portal_reparto, 3 años). Lo que sí está disponible se resume en un renglón, para
// que el vendedor pueda ofrecer una alternativa inmediata sin salir de acá.
STEP_RENDERERS['color-sd'] = () => {
  const allOk = formData.unidades.every(u => (u.colorPedido || '').trim());
  return {
    body: `
      <h2>¿Qué color querés consultar?</h2>
      <p class="step-hint">Estos son los colores del modelo que <strong>no tenemos</strong> ni en el salón ni en el reparto. Salen de lo que VW nos facturó u ofreció alguna vez — no hay colores inventados.</p>
      ${formData.unidades.map((u, idx) => {
        const opciones = coloresSinDisponibilidad(u.modelo);
        const enStock = chasisStockPorModelo(u.modelo);
        const enRep = stockData.filter(r => r.libre && r.enReparto && r.modelo === u.modelo);
        const listaDisp = [];
        if (enStock.length) listaDisp.push(`en stock: ${[...new Set(enStock.map(c => c.color))].map(escapeHtml).join(', ')}`);
        if (enRep.length) listaDisp.push(`en reparto: ${[...new Set(enRep.map(c => c.color))].map(escapeHtml).join(', ')}`);
        const avisoDisp = listaDisp.length
          ? `<div style="font-size:12px; background:#ecfdf5; border:1px solid #a7f3d0; color:#065f46; border-radius:8px; padding:6px 10px; margin-top:8px">
               ✔ De este modelo ya podés vender ${listaDisp.join(' · ')}</div>`
          : `<div style="font-size:12px; background:#fef3c7; border:1px solid #fcd34d; color:#78350f; border-radius:8px; padding:6px 10px; margin-top:8px">
               ⚠ De este modelo <strong>no tenemos ninguna unidad</strong>, en ningún color.</div>`;
        const filas = opciones.map(c => {
          const checked = _normColor(u.colorPedido || '') === _normColor(c.color);
          const ultima = c.ultima
            ? new Date(c.ultima + 'T00:00:00').toLocaleDateString('es-AR', { month: 'short', year: 'numeric' })
            : null;
          // "Facturado" = lo tuvimos de verdad. "Ofrecido" = VW nos lo asignó en un
          // reparto aunque no lo hayamos comprado. Los dos prueban que existe.
          const sub = (c.nFact > 0)
            ? `nos facturaron ${c.nFact}${ultima ? ' · última ' + ultima : ''}`
            : `VW nos lo ofreció en el reparto${c.nRep > 1 ? ' (' + c.nRep + ' veces)' : ''}`;
          return `
            <label class="item ${checked ? 'selected' : ''}">
              <input type="radio" name="colorSd${idx}" ${checked ? 'checked' : ''}
                onchange="setColorPedido(${idx}, ${JSON.stringify(c.color).replace(/"/g, '&quot;')})">
              <div class="info">
                <div class="title">${escapeHtml(c.color)}</div>
                <div class="sub">${sub}</div>
              </div>
            </label>`;
        }).join('');
        const otroSel = (u.colorPedido || '').trim() &&
          !opciones.some(c => _normColor(c.color) === _normColor(u.colorPedido));
        return `
          <div class="resumen-card" style="margin-bottom:14px">
            <h5>Unidad ${idx + 1}: ${escapeHtml(u.modelo || '—')}</h5>
            ${avisoDisp}
            <div class="scroll-list" style="max-height:340px; margin-top:10px">
              ${filas || '<div class="empty" style="padding:10px"><p>De este modelo no tenemos histórico de colores. Escribí abajo el que pide el cliente.</p></div>'}
            </div>
            <div class="field" style="margin-top:10px">
              <label class="field-label" style="font-size:12px">Otro color — solo si el cliente pide uno que no está en la lista</label>
              <input id="colorOtro${idx}" type="text" placeholder="Ej: Azul Egeo"
                value="${otroSel ? escapeHtml(u.colorPedido) : ''}"
                oninput="setColorPedidoLibre(${idx}, this.value)">
            </div>
          </div>`;
      }).join('')}
    `,
    footer: `
      <button class="btn-back" onclick="wizardBack()">Atrás</button>
      <button class="btn-next" id="btnNext" ${allOk ? '' : 'disabled'} onclick="nextStep()">Siguiente</button>
    `
  };
};

function setColorPedido(idx, color) {
  formData.unidades[idx].colorPedido = color;
  const inp = document.getElementById('colorOtro' + idx);
  if (inp) inp.value = '';
  const btn = document.getElementById('btnNext');
  if (btn) btn.disabled = !formData.unidades.every(u => (u.colorPedido || '').trim());
}
function setColorPedidoLibre(idx, txt) {
  formData.unidades[idx].colorPedido = (txt || '').trim();
  if ((txt || '').trim()) {
    document.querySelectorAll(`input[name="colorSd${idx}"]`).forEach(r => { r.checked = false; });
    document.querySelectorAll(`input[name="colorSd${idx}"]`).forEach(r => {
      const lbl = r.closest('label'); if (lbl) lbl.classList.remove('selected');
    });
  }
  const btn = document.getElementById('btnNext');
  if (btn) btn.disabled = !formData.unidades.every(u => (u.colorPedido || '').trim());
}

// ----- Cantidad de unidades -----
STEP_RENDERERS['cantidad-unidades'] = () => ({
  body: `
    <h2>¿Cuántas unidades vas a consultar?</h2>
    <p class="step-hint">Hasta 3 modelos distintos en una misma consulta.</p>
    <div class="opt-list">
      <div class="opt ${formData.unidades.length === 1 ? 'selected' : ''}" onclick="selectCantidad(1)">1 unidad</div>
      <div class="opt ${formData.unidades.length === 2 ? 'selected' : ''}" onclick="selectCantidad(2)">2 unidades</div>
      <div class="opt ${formData.unidades.length === 3 ? 'selected' : ''}" onclick="selectCantidad(3)">3 unidades</div>
      <div class="opt ${formData.unidades.length === 4 ? 'selected' : ''}" onclick="selectCantidad(4)">4 unidades</div>
    </div>
  `,
  footer: `<button class="btn-back" onclick="wizardBack()">Atrás</button>`
});

// ----- Modelos en paralelo (1 select por unidad) -----
// El listado depende del origen elegido en el primer paso.
STEP_RENDERERS['modelos'] = () => {
  const origen = formData.origen || 'stock';
  const modelos = getModelosDisponibles(origen, formData.subtipo);
  const hint = origen === 'stock'
    ? `${modelos.length} modelos con unidades en stock. Entre paréntesis, los chasis libres (incluye los "a recibir").`
    : (origen === 'reparto'
      ? (formData.subtipo === 'sin_stock'
        ? `${modelos.length} modelos del reparto de los que no hay ninguna unidad en el salón. Entre paréntesis, cuántas trae el reparto.`
        : `${modelos.length} modelos que sí tenemos, con colores del reparto que hoy no están en stock. Entre paréntesis, cuántas unidades.`)
      : (formData.subtipo === 'sin_ninguno'
        ? `${modelos.length} modelos de los que no tenemos ninguna unidad, ni en el salón ni en el reparto.`
        : `${modelos.length} modelos que sí tenemos, pero que no están en todos los colores. Entre paréntesis, cuántos colores faltan.`));
  const allOk = formData.unidades.every(u => u.modelo);
  const etiqueta = (m) => {
    if (origen === 'stock') return `${m.cantLibres}`;
    if (origen === 'reparto') return m.esReparto ? 'reparto' : `${m.cantRepartoNuevo} en reparto`;
    // sin disponibilidad: o no tenemos nada del modelo, o solo faltan colores.
    if (m.sinNadaDelModelo) return 'no tenemos ninguna';
    return `${m.cantColoresSD} ${m.cantColoresSD === 1 ? 'color' : 'colores'} que no tenemos`;
  };
  return {
    body: `
      <h2>${formData.unidades.length === 1 ? '¿Qué modelo querés consultar?' : 'Modelo de cada unidad'}</h2>
      <p class="step-hint">${hint}</p>
      ${modelos.length === 0 ? '<div class="empty"><div class="icon">📭</div><p>No hay modelos para este origen. Volvé atrás y elegí otro.</p></div>' : ''}
      ${formData.unidades.map((u, idx) => `
        <div class="field" style="margin-bottom:14px">
          <label class="field-label">Unidad ${idx + 1}</label>
          <select onchange="setUnidadModelo(${idx}, this.value)">
            <option value="">— Elegir modelo —</option>
            ${modelos.map(m => {
              const selected = u.modelo === m.modelo ? 'selected' : '';
              return `<option value="${escapeHtml(m.modelo)}" ${selected}>${escapeHtml(m.modelo)} (${etiqueta(m)})</option>`;
            }).join('')}
          </select>
        </div>
      `).join('')}
    `,
    footer: `
      <button class="btn-back" onclick="wizardBack()">Atrás</button>
      <button class="btn-next" id="btnNext" ${allOk ? '' : 'disabled'} onclick="nextStep()">Siguiente</button>
    `
  };
};

// ----- Colores en paralelo -----
// Origen "stock": solo chasis físicos / a recibir.
// Origen "reparto": solo unidades de reparto cuyo color NO está en stock, con el aviso
// de qué colores sí tenemos (para que el vendedor sepa qué le está ofreciendo al cliente).
STEP_RENDERERS['colores'] = () => {
  const origen = formData.origen || 'stock';
  const listaDe = (modelo) => origen === 'reparto' ? chasisRepartoNuevoPorModelo(modelo) : chasisStockPorModelo(modelo);
  // Las unidades de reparto sin chasis (fallback CSV) no eligen color → no las validamos.
  const allOk = formData.unidades.every(u => u.esReparto || u.chasisSeleccionados.length > 0);
  const hint = origen === 'reparto'
    ? 'Estas unidades <strong>no están en el concesionario</strong>: VW ya nos las asignó con ese color y las podemos comprar. Solo salen las que no tenemos en stock.'
    : 'Hasta 3 chasis por unidad. Tocá para seleccionar. Los marcados <strong>A RECIBIR</strong> ya se los compramos a VW y están en camino; si además dicen <strong>NO LLEGÓ</strong>, están demorados y abajo figura lo que contestó VW.';
  return {
    body: `
      <h2>Elegí los colores</h2>
      <p class="step-hint">${hint}</p>
      ${formData.unidades.map((u, idx) => {
        if (u.esReparto) {
          return `
            <div class="resumen-card" style="margin-bottom:14px; opacity:.75">
              <h5>Unidad ${idx+1}: ${escapeHtml(u.modelo || '—')} <span class="badge" style="background:#fbbf24; color:#78350f; margin-left:6px">REPARTO</span></h5>
              <p class="muted" style="margin-top:6px; font-size:13px">Sin chasis libres en stock. La unidad llega en reparto.</p>
            </div>
          `;
        }
        const chasis = listaDe(u.modelo);
        // En origen reparto avisamos qué colores SÍ están en el salón, así el vendedor
        // puede ofrecer una alternativa inmediata en vez de esperar el reparto.
        const yaEnStock = origen === 'reparto' ? chasisStockPorModelo(u.modelo) : [];
        const avisoStock = yaEnStock.length
          ? `<div style="font-size:12px; background:#ecfdf5; border:1px solid #a7f3d0; color:#065f46; border-radius:8px; padding:6px 10px; margin-top:8px">
               ✔ De este modelo ya tenemos en stock: ${[...new Set(yaEnStock.map(c => c.color))].map(escapeHtml).join(' · ')}</div>`
          : `<div style="font-size:12px; background:#fef3c7; border:1px solid #fcd34d; color:#78350f; border-radius:8px; padding:6px 10px; margin-top:8px">
               ⚠ De este modelo <strong>no tenemos ninguna unidad en stock</strong>.</div>`;
        return `
          <div class="resumen-card" style="margin-bottom:14px">
            <h5>Unidad ${idx+1}: ${escapeHtml(u.modelo || '—')}</h5>
            ${origen === 'reparto' ? avisoStock : ''}
            <div class="scroll-list" style="max-height:240px; margin-top:10px">
              ${chasis.length === 0 ? '<div class="empty"><p>Sin unidades para este origen</p></div>' : chasis.map(c => {
                const checked = u.chasisSeleccionados.includes(c.serie);
                const disabled = !checked && u.chasisSeleccionados.length >= 3;
                const fechaTxt = fmtFechaCorta(c.fecha_factura);
                return `
                  <label class="item ${checked ? 'selected' : ''}" style="${disabled ? 'opacity:.4; cursor:not-allowed' : ''}">
                    <input type="checkbox" ${checked ? 'checked' : ''} ${disabled ? 'disabled' : ''} onchange="toggleChasisParalelo(${idx}, '${escapeHtml(c.serie)}')">
                    <div class="info">
                      <div class="title">${escapeHtml(c.color || '—')}${badgeChasis(c)}</div>
                      <div class="sub">${escapeHtml(c.serie)}${c.enReparto ? ' · ' + txtEstadoReparto(c) + ' · color que no hay en stock' : (fechaTxt ? (c.aRecibir ? ' · Pedido ' : ' · Fact ') + fechaTxt : '')}</div>
                      ${c.demora ? `<div class="sub" style="color:${demoraGrave(c.demora) ? '#991b1b' : '#92400e'}; font-weight:600">🚚 ${escapeHtml(textoDemora(c.demora))}</div>` : ''}
                      ${c.bloqueo ? `<div class="sub" style="color:#991b1b; font-weight:700">🚫 ${escapeHtml(textoBloqueo(c.bloqueo))}</div>` : ''}
                    </div>
                    <div class="right">
                      ${fmtMoney(c.oferta_vigente)}
                      ${c.fuente_oferta === 'stock_limitado' || c.fuente_oferta === 'unidad' ? '<div><span class="badge">' + (c.fuente_oferta === 'unidad' ? 'ESP' : 'LIM') + '</span></div>' : ''}
                    </div>
                  </label>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }).join('')}
    `,
    footer: `
      <button class="btn-back" onclick="wizardBack()">Atrás</button>
      <button class="btn-next" id="btnNext" ${allOk ? '' : 'disabled'} onclick="nextStep()">Siguiente</button>
    `
  };
};

// ----- Precios en paralelo (con análisis live por unidad) -----
STEP_RENDERERS['precios'] = () => {
  const sinDisp = formData.origen === 'sin_disponibilidad';
  // Pre-cargamos precio_pedido con la oferta vigente del modelo como referencia
  // (el vendedor lo ajusta segun lo que pidio el cliente). Vale tanto para stock como
  // para reparto, donde la oferta sale de cualquier registro de stockData del modelo.
  // En "sin disponibilidad" NO se pre-carga: el precio es opcional (puede estar
  // consultando solo si el auto se consigue) y un valor puesto solo se pediría de gusto.
  if (!sinDisp) {
    formData.unidades.forEach(u => {
      if (u.precioPedido != null || !u.modelo) return;
      let registros;
      if (u.esReparto) {
        registros = stockData.filter(r => r.modelo === u.modelo);
      } else if (u.chasisSeleccionados && u.chasisSeleccionados.length > 0) {
        registros = u.chasisSeleccionados.map(s => stockData.find(r => r.serie === s)).filter(Boolean);
      } else {
        registros = stockData.filter(r => r.libre && r.modelo === u.modelo);
      }
      let min = Infinity;
      registros.forEach(c => {
        if (!isNaN(c.oferta_vigente) && c.oferta_vigente < min) min = c.oferta_vigente;
      });
      if (isFinite(min) && min > 0) u.precioPedido = Math.round(min);
    });
  }
  // Sin disponibilidad: el precio no es obligatorio (la consulta puede ser solo "¿se consigue?").
  const allOk = sinDisp || formData.unidades.every(u => u.precioPedido && u.precioPedido > 0);
  return {
    body: `
      <h2>${sinDisp ? '¿Querés pedir un precio?' : 'Precio pedido'}</h2>
      <p class="step-hint">${sinDisp
        ? 'Este auto no lo tenemos, así que lo primero que se responde es <strong>si se consigue</strong>. Si además el cliente ya te pasó un número, cargalo; si no, dejalo vacío y va como consulta de disponibilidad.'
        : 'Para cada unidad, ingresá el precio que pidió el cliente. <strong>Con flete y formulario incluido</strong>.'}</p>
      ${formData.unidades.map((u, idx) => {
        const colores = u.chasisSeleccionados.map(s => {
          const c = stockData.find(r => r.serie === s);
          return c ? c.color : s;
        }).join(' / ');
        const headerExtra = sinDisp
          ? ' <span class="badge" style="background:#e0e7ff; color:#3730a3; margin-left:6px">SIN DISPONIBILIDAD</span>'
          : (u.esReparto ? ' <span class="badge" style="background:#fbbf24; color:#78350f; margin-left:6px">REPARTO</span>' : '');
        const ref = sinDisp ? refPrecioModelo(u.modelo) : null;
        const sub = sinDisp
          ? `<p class="muted">Color pedido: <strong>${escapeHtml(u.colorPedido || '—')}</strong></p>
             ${ref && ref.oferta ? `<p class="muted" style="margin-top:4px">Precio de referencia (el publicado hoy): <strong>${fmtMoney(ref.oferta)}</strong></p>` : ''}`
          : (u.esReparto
            ? `<p class="muted">Sin chasis en stock — viene en reparto.</p>`
            : `<p class="muted">Colores: ${escapeHtml(colores) || '—'}</p>`);
        return `
          <div class="resumen-card" style="margin-bottom:14px">
            <h5>Unidad ${idx+1}: ${escapeHtml(u.modelo || '—')}${headerExtra}</h5>
            ${sub}

async function cargarPreventasVendidas() {
  try {
    const objetivo = (currentMode === 'gerente' && gerenteVendedorActivo) ? gerenteVendedorActivo.usuario : null;
    const res = await fetch(STOCK_EDGE_URL, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(credsEdge({
        misPreventas: true,
        ...(objetivo ? { comoVendedor: objetivo } : {})
      }))
    });
    const data = await res.json();
    preventasVendidas = (data && data.preventasVendidas) || [];
    preventasAviso = (data && data.preventasAviso) || null;
  } catch (e) {
    console.error('[preventasVendidas]', e);
    preventasVendidas = [];
    preventasAviso = 'No se pudo consultar el sistema. Probá de nuevo en un momento.';
  }
  preventasVendidasCargadas = true;
  if (currentStep === 'pv-vendida') renderStep();
}

function selectPvVendida(numero) {
  const pv = (preventasVendidas || []).find(x => x.preventa === numero);
  if (!pv) return;
  if (!pv.modelo) {
    alert('No pude identificar el modelo de esa unidad en el catálogo, así que no puedo analizar el precio. Avisale a gerencia.');
    return;
  }
  if (pv.consulta_id && !confirm(`Esa preventa ya tiene la consulta #${pv.consulta_id}. ¿Cargar otra igual?`)) return;
  formData.pvVendida = pv;
  // Una sola unidad, con el precio YA cerrado: el resto del wizard (analisis,
  // transferencia, resumen) trabaja igual que siempre sobre formData.unidades.
  formData.unidades = [{
    modelo: pv.modelo,
    chasisSeleccionados: [],
    colorPedido: pv.color || null,
    precioPedido: pv.precio_con_fyf,
    esReparto: false,
    transferenciaMonto: null
  }];
  formData.pagaTransferencia = 'si';
  nextStep();
}

      : (u.esReparto
        ? `<p class="muted" style="margin:6px 0">Sin chasis — viene en reparto.</p>`
        : `<p>Colores: ${escapeHtml(colores)}</p>`);
    const badgeSd = sinDisp
      ? ' <span class="badge" style="background:#e0e7ff; color:#3730a3; margin-left:6px">SIN DISPONIBILIDAD</span>'
      : '';
    const filaPrecio = u.precioPedido
      ? `<div class="precio-row"><span>Precio pedido:</span><strong>${fmtMoney(u.precioPedido)}</strong></div>`
      : `<div class="precio-row"><span>Precio:</span><strong>Solo consulta de disponibilidad</strong></div>`;
    return `
      <div class="resumen-card">
        <h5>Unidad ${idx+1}: ${escapeHtml(u.modelo)}${sinDisp ? badgeSd : repartoBadge}</h5>
        ${coloresRow}
        ${filaPrecio}
        ${(a && a.dto_extra_pedido != null) ? `<div class="precio-row"><span>Dto extra pedido:</span><strong>${fmtPct(a.dto_extra_pedido)}</strong></div>` : ''}
        ${u.transferenciaMonto > 0 ? `
          <div class="precio-row"><span>Por transferencia:</span><strong>${fmtMoney(u.transferenciaMonto)}</strong></div>
          <div class="precio-row"><span>Costo de cobrarlo así:</span><strong style="color:var(--red)">${fmtMoney(costoTransferencia(u.transferenciaMonto))}</strong></div>
        ` : ''}
      </div>
    `;
  }).join('');

  let financiaTxt = 'No financia';
  if (f.financia === 'si') {
    let ent = f.tipoCliente === 'reventa' ? 'VWFS' : (f.finEntidad === 'otros' ? f.finEntidadOtro : (f.finEntidad || '').toUpperCase());
    financiaTxt = `Sí · ${ent} · ${fmtMoney(f.finMonto)}`;
  }
  let vsOtroTxt = f.vsOtro === 'si' ? `${f.conceNombre}: ${fmtMoney(f.concePrecio)}` :
    (f.vsOtro === 'no_quiere_pasar' ? 'No quiere pasar el concesionario' : 'No');

  return {
    body: `
      <h2>Revisá la consulta</h2>
      <p class="step-hint">Si está OK, tocá "Enviar". Si hay algo para cambiar, volvé con "Atrás".</p>
      <div class="detalle-section">
        <h4>Cliente</h4>
        <div class="kv">
          <span class="k">Tipo</span><span class="v">${f.tipoCliente === 'particular' ? 'Particular' : 'Reventa'}</span>
          <span class="k">Nombre</span><span class="v">${escapeHtml(cliente)}</span>
          <span class="k">Provincia/Loc.</span><span class="v">${escapeHtml(f.provincia)} / ${escapeHtml(f.localidad)}</span>
          ${f.tipoCliente === 'particular' ? `
            <span class="k">Fuente</span><span class="v">${escapeHtml(f.fuenteDato === 'otro' ? f.fuenteDatoOtro : (f.fuenteDato || '—'))}</span>
            <span class="k">Tiene usado</span><span class="v">${f.tieneUsado === true ? 'Sí' : (f.tieneUsado === false ? 'No' : '—')}</span>
          ` : ''}
          <span class="k">Financiación</span><span class="v">${financiaTxt}</span>
          <span class="k">VS otro</span><span class="v">${vsOtroTxt}</span>
        </div>
      </div>
      <div class="detalle-section">
        <h4>Unidades</h4>
        ${unidadesHtml}
      </div>
      ${(f.observaciones || '').trim() ? `
        <div class="detalle-section">
          <h4>Observaciones / pedido adicional</h4>
          <div style="white-space:pre-wrap; padding:8px 0">${escapeHtml(f.observaciones)}</div>
        </div>
      ` : ''}
    `,
    footer: `
      <button class="btn-back" onclick="wizardBack()">Atrás</button>
      <button class="btn-submit" onclick="submitConsulta()">Enviar consulta</button>
    `
  };
};

function selectGerenteVendedor(id, usuario, nombre) {

}
function selectCantidad(n) {
  while (formData.unidades.length > n) formData.unidades.pop();
  while (formData.unidades.length < n) formData.unidades.push({ modelo: null, chasisSeleccionados: [], colorPedido: null, precioPedido: null, esReparto: false, transferenciaMonto: null });
  nextStep();
}
function setUnidadModelo(idx, modelo) {
  const u = formData.unidades[idx];
  const modeloAnterior = u.modelo;
  u.modelo = modelo || null;
  u.chasisSeleccionados = [];
  if (modelo !== modeloAnterior) u.colorPedido = null;
  // Si el modelo elegido esta solo en reparto (sin chasis libres), marcamos la unidad.
  // En ese caso el paso "colores" se saltea. Usamos el set canonico porque el modelo
  // viene del selector con el nombre canonico (resuelto contra stockData/bt).
  const modelosReparto = getModelosEnReparto();
  u.esReparto = !!(modelo && modelosReparto.has(modelo) && getChasisLibresPorModelo(modelo).length === 0);
  // Si cambio el modelo, limpiamos el precio para que se pre-cargue con la oferta del nuevo
  // modelo cuando se llegue al paso de precios.
  if (modelo !== modeloAnterior) u.precioPedido = null;
  // Habilitar el botón Siguiente sin re-render full
  const btn = document.getElementById('btnNext');
  if (btn) btn.disabled = !formData.unidades.every(uu => uu.modelo);
}
function toggleChasisParalelo(idx, serie) {
  const u = formData.unidades[idx];
  const i = u.chasisSeleccionados.indexOf(serie);
  if (i >= 0) u.chasisSeleccionados.splice(i, 1);

}

// ============ Análisis ============
// Analisis "puro" de la unidad: oferta vigente, dto extra sobre el precio de lista y
// ganancia resultante, SIN contar como se paga. El costo de cobrar por transferencia
// se aplica arriba, en calcularAnalisisUnidad().
function _analisisUnidadBase(u) {
  if (!u || !u.modelo || u.precioPedido == null || isNaN(u.precioPedido)) return null;
  // "Sin disponibilidad": el modelo puede no tener NINGUNA unidad en stockData (hoy 20
  // de los 48 del catalogo). El analisis se hace igual contra el precio publicado del
  // catalogo — mismo snapshot del Motor Baratito que usa todo el resto — asi el
  // vendedor ve cuanto descuento extra esta pidiendo aunque el auto no exista todavia.
  if (u.sinDisponibilidad) {
    const ref = refPrecioModelo(u.modelo);
    if (!ref || !ref.precio_lista) return null;
    if (ref.oferta == null) {
      return { oferta_vigente_min: null, gcia_vigente_min: null, precio_lista: ref.precio_lista,
        dto_extra_pedido: null, gcia_resultante: null, chasisSnapshot: [] };
    }
    const dto = (ref.oferta - u.precioPedido) / ref.precio_lista;
    return { oferta_vigente_min: ref.oferta, gcia_vigente_min: ref.gcia, precio_lista: ref.precio_lista,
      dto_extra_pedido: dto, gcia_resultante: (ref.gcia || 0) - dto, chasisSnapshot: [] };
  }
  // Para unidades en reparto no hay chasis seleccionados, pero el analisis se calcula igual:
  // tomamos cualquier registro de stockData con el mismo modelo (libre o vendido — los modelos
  // en reparto tipicamente tienen chasis pasados con su oferta_vigente y gcia_actual). Y para
  // el precio de lista usamos como override el del catalogo de la Edge, que cubre TODOS los
  // modelos con precio publicado (esten o no en stock).
  let chasisData;
  if (u.esReparto) {
    chasisData = stockData.filter(r => r.modelo === u.modelo);
  } else {
    if (!u.chasisSeleccionados || u.chasisSeleccionados.length === 0) return null;
    chasisData = u.chasisSeleccionados.map(s => stockData.find(r => r.serie === s)).filter(Boolean);
  }
  if (chasisData.length === 0) {
    // Sin registros en stockData. Para reparto, devolvemos al menos el precio_lista del catalogo.
    if (u.esReparto) {
      const pl = getPrecioListaModelo(u.modelo);
      if (isNaN(pl) || pl <= 0) return null;
      return { oferta_vigente_min: null, gcia_vigente_min: null, precio_lista: pl,
        dto_extra_pedido: null, gcia_resultante: null, chasisSnapshot: [] };
    }
    return null;
  }
  let oferta_vigente_min = Infinity, gcia_vigente_min = null, precio_lista = null;
  chasisData.forEach(c => {
    if (!isNaN(c.oferta_vigente) && c.oferta_vigente < oferta_vigente_min) {
      oferta_vigente_min = c.oferta_vigente;
      gcia_vigente_min = c.gcia_vigente;
    }
    if (precio_lista == null || c.precio_lista > precio_lista) precio_lista = c.precio_lista;
  });
  // Reparto: override del precio_lista con el del catalogo si lo tenemos (cubre el catalogo entero).
  if (u.esReparto) {
    const pl = getPrecioListaModelo(u.modelo);
    if (!isNaN(pl) && pl > 0) precio_lista = pl;
  }
  if (!isFinite(oferta_vigente_min) || !precio_lista) {
    if (u.esReparto && precio_lista) {
      return { oferta_vigente_min: null, gcia_vigente_min: null, precio_lista,
        dto_extra_pedido: null, gcia_resultante: null, chasisSnapshot: [] };
    }
    return null;
  }
  const dto_extra_pedido = (oferta_vigente_min - u.precioPedido) / precio_lista;
  const gcia_resultante = (gcia_vigente_min || 0) - dto_extra_pedido;
  return {
    oferta_vigente_min, gcia_vigente_min, precio_lista,
    dto_extra_pedido, gcia_resultante,
    chasisSnapshot: u.esReparto ? [] : chasisData.map(c => ({
      serie: c.serie, color: c.color,
      oferta_vigente: c.oferta_vigente, gcia_vigente: c.gcia_vigente,
      fuente_oferta: c.fuente_oferta,
      fecha_factura: c.fecha_factura_str || null,
      enReparto: !!c.enReparto,
      estadoReparto: c.estadoReparto || null
    }))
  };
}

/**
 * Analisis de la unidad con el costo de la forma de pago adentro.
 *
 * Si una parte se cobra por transferencia bancaria, esa plata entra y sale de nuestra
 * cuenta y deja en el camino la alicuota del mes (0,6 + 0,6 + SIRCREB). Es plata que no
 * cobramos: equivale a haber vendido mas barato. Por eso NO se toca `dto_extra_pedido`
 * (que sigue siendo el descuento de precio puro, comparable contra consultas viejas) y
 * se agrega el costo como un descuento aparte:
 *
 *   dto_transferencia = costo / precio_lista
 *   dto_extra_total   = dto_extra_pedido + dto_transferencia
 *   gcia_resultante   = gcia_vigente_min - dto_extra_total   <-- la que decide
 *
 * `precio_efectivo` es lo mismo visto en pesos: lo que realmente entra despues de los
 * impuestos. Con oferta 31.000.000, pedido 30.000.000 y 10.000.000 por transferencia al
 * 1,5%, el costo es 150.000 y es como vender a 29.850.000.
 */
function calcularAnalisisUnidad(u) {
  const a = _analisisUnidadBase(u);
  if (!a) return null;
  const monto = Number(u && u.transferenciaMonto) || 0;
  a.transferencia_monto = monto > 0 ? monto : null;
  a.transferencia_alicuota = monto > 0 ? alicuotaTransferencia() : null;
  a.transferencia_costo = monto > 0 ? costoTransferencia(monto) : 0;
  a.dto_transferencia = null;
  a.dto_extra_total = a.dto_extra_pedido;
  a.precio_efectivo = Number(u.precioPedido) || null;
  if (monto > 0 && a.precio_lista > 0) {
    a.dto_transferencia = a.transferencia_costo / a.precio_lista;
    a.precio_efectivo = (Number(u.precioPedido) || 0) - a.transferencia_costo;
    if (a.dto_extra_pedido != null) {
      a.dto_extra_total = a.dto_extra_pedido + a.dto_transferencia;
      a.gcia_resultante = (a.gcia_vigente_min || 0) - a.dto_extra_total;
    }
  }
  return a;
}

// Analisis EN VIVO para el admin a partir de un item ya guardado. La gcia guardada en el item
// la calculo el VENDEDOR, y a los vendedores la Edge les blinda la ganancia (vuelve 0), por eso
// gcia_vigente_min quedo en 0 y gcia_resultante = -dto_extra. Para el admin recalculamos contra
// stockData actual (que para el admin SI trae la ganancia real). Devuelve null si no hay datos.
function analisisAdminVivo(it) {
  if (!it || it.precio_pedido == null) return null;
  const series = (it.chasis || []).map(ch => ch.serie).filter(Boolean);
  // El monto por transferencia viaja en el item: el analisis del admin tiene que
  // salir ya neto del costo de cobrarlo asi. La alicuota que se aplica es la de HOY
  // (no la guardada al cargar la consulta): si el SIRCREB cambio, manda el nuevo.
  const base = { modelo: it.modelo, precioPedido: Number(it.precio_pedido),
    transferenciaMonto: Number(it.transferencia_monto) || 0 };
  // 1) por los chasis pedidos (si siguen en stock).
  let a = calcularAnalisisUnidad({ ...base, esReparto: false, chasisSeleccionados: series });
  // 2) fallback: cualquier chasis del modelo (la gcia es por-modelo) + precio_lista del catalogo.
  if (!a || a.gcia_vigente_min == null) {
    a = calcularAnalisisUnidad({ ...base, esReparto: true, chasisSeleccionados: [] });
  }
  // 3) fallback: el modelo no tiene NINGUNA unidad en stockData (caso tipico de
  // "sin disponibilidad"). Vamos al catalogo, que trae el precio Baratito y la
  // ganancia del modelo del mismo snapshot del Motor.
  if (!a || a.gcia_vigente_min == null) {
    a = calcularAnalisisUnidad({ ...base, sinDisponibilidad: true });
  }
  if (!a || a.gcia_vigente_min == null) return null;
  return a;
}

// Referencia de precio y ganancia de HOY para un item guardado, SIN depender de que
// el vendedor haya pedido un precio (en "sin disponibilidad" puede no haberlo). Es lo
// que pre-llena el input del admin y lo que se usa para calcular el margen mientras
// tipea. Orden: chasis pedidos -> cualquier chasis del modelo -> catalogo (precio
// Baratito del modelo) -> el snapshot guardado en la consulta.
function refAdminUnidad(it) {
  if (!it) return null;
  if (it.precio_pedido != null) {
    const a = analisisAdminVivo(it);
    if (a && a.precio_lista > 0 && a.gcia_vigente_min != null) {
      return { oferta: a.oferta_vigente_min, precio_lista: a.precio_lista, gcia: a.gcia_vigente_min };
    }
  }
  const r = refPrecioModelo(resolveModeloCanonico(it.modelo) || it.modelo);
  if (r && r.precio_lista > 0 && r.oferta) {
    return { oferta: r.oferta, precio_lista: r.precio_lista, gcia: r.gcia || 0 };
  }
  if (it.precio_lista > 0) {
    return { oferta: it.oferta_vigente_min, precio_lista: it.precio_lista, gcia: it.gcia_vigente_min || 0 };
  }
  return null;
}

// ============ SUBMIT ============
async function submitConsulta() {
  const f = formData;
  const sinDisp = f.origen === 'sin_disponibilidad';
  // Venta ya hecha: no hay chasis que elegir ni precio que pedir — los dos salen de
  // la preventa. Lo unico obligatorio es el monto que va por transferencia.
  const ventaHecha = f.origen === 'venta_hecha';
  const errs = [];
  if (ventaHecha) {
    if (!f.pvVendida) errs.push('Falta elegir la venta');
    if (!f.unidades[0] || !f.unidades[0].transferenciaMonto) errs.push('Falta el monto que va por transferencia');
  }
  f.unidades.forEach((u, i) => {
    if (!u.modelo) errs.push(`Unidad ${i+1}: falta modelo`);
    if (ventaHecha) {
      // nada mas que validar: modelo y precio vienen del sistema.
    } else if (sinDisp) {
      // Sin disponibilidad: el color es obligatorio (es lo que se va a preguntar al
      // zonal) y el precio NO (puede ser solo "¿se consigue?").
      if (!(u.colorPedido || '').trim()) errs.push(`Unidad ${i+1}: falta el color a consultar`);
    } else {
      if (!u.esReparto && u.chasisSeleccionados.length === 0) errs.push(`Unidad ${i+1}: falta color`);
      if (!u.precioPedido) errs.push(`Unidad ${i+1}: falta precio`);
    }
    // El monto por transferencia no puede ser mayor que lo que se paga por el auto.
    if (u.transferenciaMonto && u.precioPedido && u.transferenciaMonto > u.precioPedido) {
      errs.push(`Unidad ${i+1}: la transferencia (${fmtMoney(u.transferenciaMonto)}) supera el precio pedido`);
    }
  });
  if (formData.pagaTransferencia === 'si' && !formData.unidades.some(u => u.transferenciaMonto > 0)) {
    errs.push('Dijiste que una parte va por transferencia pero no cargaste ningún monto');
  }
  if (errs.length) { alert('Faltan datos:\n\n• ' + errs.join('\n• ')); return; }

  // En modo gerente, debe haber un vendedor elegido
  if (currentMode === 'gerente' && !gerenteVendedorActivo) {
    alert('Falta elegir el vendedor para esta consulta.');
    return;
  }
  showLoading('Enviando...');
  try {
    // Si gerente, la consulta queda asignada al vendedor elegido y se registra quién la cargó
    const vend = currentMode === 'gerente' && gerenteVendedorActivo
      ? gerenteVendedorActivo
      : { id: currentUser.id, usuario: currentUser.usuario, nombre: currentUser.nombre || currentUser.usuario };

    // Decision de diseño: cuando el vendedor pide N unidades, creamos N consultas
    // separadas (cada una con 1 item). El admin las responde individualmente, cada
    // respuesta dispara su propio WA. Los datos del cliente, ubicacion, financiacion,
    // observaciones, etc., se duplican en cada cabecera (es OK, son pocos bytes y
    // permite que cada consulta sea totalmente autocontenida).
    const N = f.unidades.length;
    const consultaIds = [];
    for (let i = 0; i < N; i++) {
      const u = f.unidades[i];
      const a = calcularAnalisisUnidad({ ...u, sinDisponibilidad: sinDisp || ventaHecha });
      // % financiacion calculado sobre el precio_pedido de ESTA unidad (antes era
      // siempre el de la unidad 1 — ahora cada consulta es independiente).
      let finPct = null;
      if (f.financia === 'si' && f.finMonto && u.precioPedido) {
        const base = u.precioPedido - FYF;
        if (base > 0) finPct = f.finMonto / base;
      }
      const cabecera = {
        vendedor_id: vend.id,
        vendedor_usuario: vend.usuario,
        vendedor_nombre: vend.nombre,
        cargada_por_id: currentMode === 'gerente' ? currentUser.id : null,
        cargada_por_nombre: currentMode === 'gerente' ? (currentUser.nombre || currentUser.usuario) : null,
        tipo_cliente: f.tipoCliente,
        provincia: f.provincia,
        localidad: f.localidad,
        cliente_nombre: f.cliNombre || null,
        cliente_apellido: f.cliApellido || null,
        fuente_dato: f.fuenteDato || null,
        fuente_dato_otro: f.fuenteDato === 'otro' ? f.fuenteDatoOtro : null,
        tiene_usado: f.tipoCliente === 'particular' ? f.tieneUsado : null,
        reventa_nombre: f.reventaNombre || null,
        financia: f.financia === 'si',
        financia_entidad: f.financia === 'si' ? (f.tipoCliente === 'reventa' ? 'vwfs' : f.finEntidad) : null,
        financia_entidad_otro: f.finEntidad === 'otros' ? f.finEntidadOtro : null,
        financia_monto: f.financia === 'si' ? f.finMonto : null,
        financia_pct: finPct,
        vs_otro_concesionario: f.vsOtro,
        concesionario_nombre: f.vsOtro === 'si' ? f.conceNombre : null,
        concesionario_precio: f.vsOtro === 'si' ? f.concePrecio : null,
        observaciones_vendedor: (f.observaciones || '').trim() || null,
        // De que bolsa salio el auto. Define que ve el admin y como se responde:
        // stock/reparto -> precio; sin_disponibilidad -> primero "¿se consigue?".
        origen: f.origen || 'stock',
        estado: 'pendiente',
        // Venta ya hecha: la preventa y el precio de venta quedan en la cabecera, y
        // la consulta nace ya marcada como vendida — porque lo esta. Asi el cruce con
        // la solapa Ventas funciona sin que nadie tenga que marcar nada despues.
        ...(ventaHecha && f.pvVendida ? {
          preventa: f.pvVendida.preventa,
          venta_fecha: f.pvVendida.fecha || null,
          venta_precio_sin_fyf: f.pvVendida.precio_sin_fyf || null,
          resultado_venta: 'vendida',
          resultado_venta_at: new Date().toISOString()
        } : {})
      };
      const inserted = await sbFetch('consultas_0km', { method: 'POST', body: JSON.stringify(cabecera) });
      const consultaId = inserted[0].id;
      consultaIds.push(consultaId);

      // calcularAnalisisUnidad ya funciona igual para stock y reparto: para reparto toma
      // los datos del analisis de cualquier registro de stockData con el mismo modelo y
      // el precio_lista del catalogo.
      const item = {
        consulta_id: consultaId,
        orden: 1,
        modelo: u.modelo,
        version: u.modelo,
        // Venta ya hecha: el chasis sale de la preventa, no de una seleccion.
        chasis: ventaHecha && f.pvVendida && f.pvVendida.serie
          ? [{ serie: f.pvVendida.serie, color: f.pvVendida.color || null,
               oferta_vigente: f.pvVendida.oferta_baratito || null, fuente_oferta: 'venta' }]
          : (a ? a.chasisSnapshot : []),
        precio_lista: a ? a.precio_lista : null,
        oferta_vigente_min: a ? a.oferta_vigente_min : null,
        gcia_vigente_min: a ? a.gcia_vigente_min : null,
        // En "sin disponibilidad" puede venir sin precio (consulta de disponibilidad pura).
        precio_pedido: u.precioPedido || null,
        // Color pedido a mano. Solo se llena en "sin disponibilidad": en los otros
        // origenes el color va dentro del snapshot de `chasis`.
        color_pedido: (sinDisp || ventaHecha) ? (u.colorPedido || '').trim() || null : null,
        dto_extra_pedido: a ? a.dto_extra_pedido : null,
        // Ya viene NETA del costo de la transferencia (ver calcularAnalisisUnidad).
        gcia_resultante: a ? a.gcia_resultante : null,
        // Parte del precio que el cliente pide pagar por transferencia bancaria en vez
        // de depositar en SICE. La alicuota se guarda como snapshot para poder releer
        // la consulta dentro de unos meses; el analisis del admin usa la de hoy.
        transferencia_monto: u.transferenciaMonto || null,
        transferencia_alicuota: u.transferenciaMonto ? alicuotaTransferencia() : null,
        transferencia_costo: u.transferenciaMonto ? Math.round(costoTransferencia(u.transferenciaMonto)) : null,
        // es_reparto = el auto pedido no esta fisicamente: o el modelo entero venia
        // solo por reparto (fallback CSV), o todos los chasis elegidos son de reparto.
        es_reparto: !!u.esReparto ||
          !!(a && a.chasisSnapshot.length > 0 && a.chasisSnapshot.every(ch => ch.enReparto))
      };
      await sbFetch('consultas_0km_items', { method: 'POST', body: JSON.stringify([item]) });
    }

    // Una notificacion WA por consulta (asi cada vehiculo le llega aparte al admin/gerentes).
    consultaIds.forEach(id => notifyAdminNuevaConsulta(id).catch(e => console.error(e)));

    hideLoading();
    showToast(N === 1 ? 'Consulta enviada' : `${N} consultas enviadas`);
    document.getElementById('vendedorWizard').classList.add('hidden');
    document.getElementById('vendedorList').classList.remove('hidden');
    cargarMisConsultas();
  } catch(e) {
    hideLoading();
    console.error(e);
    alert('Error al enviar: ' + (e.message || e));
  }
}

// Dispara la Edge Function notify-whatsapp-consulta. Fire-and-forget.

// ============ MIS CONSULTAS (vendedor / gerente) ============
// Historial de reaperturas (0km + usados juntos). Son pocas: se traen las ultimas 500
// de una y se indexan por consulta, en vez de una consulta por detalle abierto.
async function cargarReaperturas() {
  try {
    const filas = await sbFetch('consultas_reaperturas?select=*&order=created_at.desc&limit=500');
    const map = {};
    (filas || []).forEach(r => {
      const k = `${r.tipo}:${r.consulta_id}`;
      (map[k] = map[k] || []).push(r);
    });
    reaperturasMap = map;
  } catch(e) {
    console.warn('[Reaperturas] error al cargar (no critico):', e.message || e);
  }
}

/** Reaperturas de una consulta, de la mas nueva a la mas vieja. */
function reaperturasDe(tipo, consultaId) {
  return reaperturasMap[`${tipo}:${consultaId}`] || [];
}

async function cargarMisConsultas() {
  const cont = document.getElementById('misConsultasList');
  cont.innerHTML = '<div class="empty">Cargando...</div>';
  try {
    // Filtro segun rol y tab activo:
    // - Vendedor: sus propias consultas (vendedor_id = el).
    // - Gerente / "Mis cargas": consultas que el cargo (cargada_por_id = el).
    // - Gerente / "Respondidas": todas las consultas respondidas (estado != pendiente),
    //   sin filtrar x el — el dropdown de la UI filtra por vendedor despues.
    let filtro;
    if (currentMode === 'gerente' && gerenteTab === 'respondidas') {
      filtro = `estado=not.in.(pendiente,en_gestion)&`;
    } else if (currentMode === 'gerente') {
      filtro = `cargada_por_id=eq.${currentUser.id}&`;
    } else {
      filtro = `vendedor_id=eq.${currentUser.id}&`;
    }
    const [data] = await Promise.all([sbFetch(`consultas_0km?${filtro}order=created_at.desc`), cargarReaperturas()]);
    const ids = (data || []).map(c => c.id);
    let items = [];
    if (ids.length > 0) items = await sbFetch(`consultas_0km_items?consulta_id=in.(${ids.join(',')})&order=orden.asc`);
    myConsultas = (data || []).map(c => ({ ...c, items: items.filter(i => i.consulta_id === c.id) }));
    // Si estamos en tab "respondidas", poblar el dropdown de vendedores con
    // los que aparecen en los resultados (asi solo lista vendedores con consultas respondidas).
    if (currentMode === 'gerente' && gerenteTab === 'respondidas') {
      poblarFiltroVendedores();
    }
    renderVendedorList();
  } catch(e) {
    console.error(e);
    cont.innerHTML = '<div class="empty"><p>Error al cargar</p></div>';
  }
}
function poblarFiltroVendedores() {
  const sel = document.getElementById('gerenteVendedorFiltro');
  if (!sel) return;
  // Recolectar vendedores unicos de myConsultas
  const map = new Map();
  for (const c of myConsultas) {
    if (c.vendedor_id && !map.has(c.vendedor_id)) {
      map.set(c.vendedor_id, c.vendedor_nombre || c.vendedor_usuario || '—');
    }
  }
  const vendedores = Array.from(map.entries()).sort((a,b) => a[1].localeCompare(b[1]));
  const previo = sel.value;
  sel.innerHTML = '<option value="">Todos los vendedores</option>' +
    vendedores.map(([id, nombre]) => `<option value="${id}">${escapeHtml(nombre)}</option>`).join('');
  if (previo && vendedores.some(([id]) => id === previo)) sel.value = previo;
}
function setGerenteTab(tab) {
  gerenteTab = tab;
  document.getElementById('tabGerenteMisCargas').classList.toggle('active', tab === 'misCargas');
  document.getElementById('tabGerenteRespondidas').classList.toggle('active', tab === 'respondidas');
  // Mostrar/ocultar elementos especificos del tab
  const dropdown = document.getElementById('gerenteVendedorFiltro');
  const btnNueva = document.getElementById('btnNuevaConsulta');
  if (dropdown) dropdown.classList.toggle('hidden', tab !== 'respondidas');
  if (btnNueva) btnNueva.classList.toggle('hidden', tab === 'respondidas');
  if (seccion === 'usados') cargarMisConsultasUsados(); else cargarMisConsultas();
}
function renderVendedorList() {
  // La misma caja de busqueda sirve a las dos secciones (el oninput del HTML
  // llama siempre a esta): si estamos en usados, delega.
  if (seccion === 'usados') return renderVendedorListUsados();
  const cont = document.getElementById('misConsultasList');
  const q = (document.getElementById('vSearch').value || '').toLowerCase().trim();
  let list = myConsultas;
  // Filtro por vendedor (solo en tab "respondidas" del gerente)
  if (currentMode === 'gerente' && gerenteTab === 'respondidas') {
    const filtroVendId = (document.getElementById('gerenteVendedorFiltro').value || '').trim();
    if (filtroVendId) list = list.filter(c => c.vendedor_id === filtroVendId);
  }
  if (q) list = list.filter(c => JSON.stringify(c).toLowerCase().includes(q));
  if (list.length === 0) {
    const empty = (currentMode === 'gerente' && gerenteTab === 'respondidas')
      ? '<div class="empty"><div class="icon">📭</div><p>Sin consultas respondidas para ese filtro.</p></div>'
      : '<div class="empty"><div class="icon">📋</div><p>Sin consultas todavía. Tocá <strong>+ Nueva consulta</strong> arriba.</p></div>';
    cont.innerHTML = empty;
    return;
  }
  cont.innerHTML = list.map(c => renderConsultaCard(c)).join('');
}
// Badge de origen para las cards. Los tres orígenes se leen de un vistazo:
// stock no lleva badge (es lo normal), reparto ámbar, sin disponibilidad violeta.
function badgeOrigen(c, it) {
  const est = (txt, bg, fg) => ` <span style="background:${bg}; color:${fg}; padding:1px 5px; border-radius:6px; font-size:9px; font-weight:700; margin-left:4px">${txt}</span>`;
  if (c && c.origen === 'venta_hecha') return est('YA VENDIDA · TRANSFERENCIA', '#fed7aa', '#9a3412');
  if (c && c.origen === 'sin_disponibilidad') return est('SIN DISPONIBILIDAD', '#e0e7ff', '#3730a3');
  if ((c && c.origen === 'reparto') || (it && it.es_reparto)) return est('REPARTO', '#fbbf24', '#78350f');
  return '';
}
// Texto del estado para mostrar (los crudos de la DB no se leen bien).
function txtEstado(e) {
  if (e === 'en_gestion') return 'en gestión';
  return e || '';
}
function renderConsultaCard(c) {
  const cliente = c.tipo_cliente === 'particular' ? `${c.cliente_nombre || ''} ${c.cliente_apellido || ''}`.trim() : (c.reventa_nombre || '—');
  const unidadesStr = (c.items || []).map(it => {
    const col = it.color_pedido ? ` <span class="muted">${escapeHtml(it.color_pedido)}</span>` : '';
    return escapeHtml(it.modelo) + col + badgeOrigen(c, it);
  }).join(' · ');
  const vendedorLine = currentMode === 'gerente'
    ? `<div style="font-size:12px; color:var(--vw-blue); font-weight:600">Vendedor: ${escapeHtml(c.vendedor_nombre || c.vendedor_usuario || '—')}${c.cargada_por_nombre ? ` · cargada por ${escapeHtml(c.cargada_por_nombre)}` : ''}</div>`
    : '';
  const ventaBadge = c.resultado_venta === 'vendida'
    ? '<span style="background:#d1fae5; color:#065f46; padding:3px 8px; border-radius:12px; font-size:10px; font-weight:700; margin-left:6px">✓ VENDIDA</span>'
    : (c.resultado_venta === 'no_vendida'
      ? '<span style="background:#fee2e2; color:#991b1b; padding:3px 8px; border-radius:12px; font-size:10px; font-weight:700; margin-left:6px">✗ NO VENDIDA</span>'
      : '');
  return `
    <div class="card consulta-card" onclick="abrirDetalle(${c.id})">
      <div class="top">
        <h3>#${c.id} — ${escapeHtml(cliente)}</h3>
        <div><span class="estado ${c.estado}">${txtEstado(c.estado)}</span>${ventaBadge}</div>
      </div>
      <div class="body">
        ${vendedorLine}
        <div>${c.tipo_cliente === 'particular' ? 'Particular' : 'Reventa'} · ${escapeHtml(c.provincia || '')} / ${escapeHtml(c.localidad || '')}</div>
        <div class="resumen-units"><span>${unidadesStr || '—'}</span></div>
        <div class="meta" style="margin-top:6px">${fmtDate(c.created_at)}${c.estado === 'rechazada' && c.precio_max_admin ? ' · Mejor precio: ' + fmtMoney(c.precio_max_admin) : ''}</div>
      </div>
    </div>
  `;
}

          const precio = it.precio_pedido ? ` → ${fmtMoney(it.precio_pedido)}` : ' → <em>¿se consigue?</em>';

}

async function eliminarConsulta(consultaId) {
  if (currentMode !== 'admin' || !_esSuperadmin()) { showToast('No autorizado'); return; }
  const c = (adminConsultas || []).find(x => x.id === consultaId);
  const label = c ? `#${c.id} — ${c.vendedor_nombre || c.vendedor_usuario || ''}` : `#${consultaId}`;
  if (!confirm(`¿Borrar definitivamente esta consulta?\n\n${label}\n\nEsto no se puede deshacer.`)) return;
  showLoading('Borrando...');
  try {
    await sbFetch(`consultas_0km?id=eq.${consultaId}`, { method: 'DELETE' });
    closeModal();
    await cargarConsultasAdmin();
    hideLoading();
    showToast('Consulta borrada');
  } catch(e) { hideLoading(); console.error(e); alert('Error al borrar: ' + (e.message || e)); }
}
async function borrarSeleccionadas() {
  if (currentMode !== 'admin' || !_esSuperadmin()) { showToast('No autorizado'); return; }
  if (_selMultipleIds.size === 0) { showToast('No hay consultas seleccionadas'); return; }

    _selMultipleActivo = false;

      btn.textContent = '☑ Selección múltiple';

      btn.style.color = 'var(--vw-grey-4)';
    }
